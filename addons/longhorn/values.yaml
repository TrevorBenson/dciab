# DCiaB defaults for Longhorn on every cluster that runs it (MGMT first).
# Per-site values (replica count, backup target and its credentials Secret) are added by
# install.sh from the cluster's Longhorn settings (spec.storage.block). Version and chart
# source: bundle.lock.
# Images: nodes pull every upstream image through the site registry's mirrors (the
# ClusterClasses configure them), so the chart keeps its upstream image names.

# The chart's own StorageClass ("longhorn") isn't the default: DCiaB's four classes are
# (replicated is the default; lib/dciab_storage, applied by install.sh).
persistence:
  defaultClass: false
  reclaimPolicy: Delete

defaultSettings:
  # Image-mode nodes have read-only /usr and /opt; replica data lives under /var. On vSphere
  # nodes with dataDiskGiB, the class mounts the data disk here, so replicas never share the
  # root disk with etcd.
  defaultDataPath: /var/lib/longhorn
  # Don't schedule replicas on a disk with less than this much free space (percent).
  storageMinimalAvailablePercentage: 15
  # A drain that would take the last healthy replica of a volume first moves that replica
  # to another node, then lets the drain go on. Cluster API stops draining after the
  # class's nodeDrainTimeoutSeconds (30 minutes) and deletes the machine anyway, so the
  # replica must move, not just block the drain until the timeout.
  nodeDrainPolicy: block-for-eviction-if-contains-last-replica

csi:
  kubeletRootDir: /var/lib/kubelet

# No ingress: the UI stays a ClusterIP Service until the platform's gateway and SSO
# front it.
ingress:
  enabled: false

longhornUI:
  replicas: 1
