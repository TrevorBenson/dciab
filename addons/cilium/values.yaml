# DCiaB defaults for Cilium on every cluster (MGMT, INFRA, workload).
# Per-cluster values (the API endpoint, the cluster name) are added by install.sh from the
# cluster's capi-cluster values. Version and chart source: bundle.lock.

# Cilium replaces kube-proxy: the ClusterClasses skip kubeadm's kube-proxy addon, and
# Cilium's Gateway API support needs it. Without kube-proxy, Cilium must reach the API
# server directly, at the cluster's API VIP (k8sServiceHost, set per cluster).
kubeProxyReplacement: "true"
k8sServicePort: 6443

# Pod addresses come from each node's podCIDR, which kube-controller-manager allocates
# from the Cluster's clusterNetwork.pods range.
ipam:
  mode: kubernetes

operator:
  replicas: 2
  rollOutPods: true    # restart when its configuration changes

rollOutCiliumPods: true  # same for the agents
