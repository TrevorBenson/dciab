# The appliance's work directory and root's container storage in it (dciab media's target
# with workDisk.disk). The image ships the storage drop-in pointing there
# (/etc/containers/storage.conf.d/50-dciab-media.conf), so the Day 0 images load into their
# final storage at the first boot and dciab media's storage step has nothing to move.
d /var/lib/dciab/work 0755 root root -
d /var/lib/dciab/work/containers 0700 root root -
