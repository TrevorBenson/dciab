# DCiaB defaults on top of the packaged CRI-O config.
[crio.runtime]
cgroup_manager = "systemd"

[crio.network]
# /opt is read-only in image mode: CNI plugins that install themselves at runtime
# (Cilium) write to /var/lib/cni/bin, which /opt/cni/bin also points at.
plugin_dirs = ["/var/lib/cni/bin", "/usr/libexec/cni"]
