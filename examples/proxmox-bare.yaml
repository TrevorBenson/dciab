# DCiaB site config: Proxmox VE, starting from bare servers.
# Same as proxmox.yaml, plus spec.hypervisors (DCiaB installs Proxmox VE on the servers
# through their BMCs) and spec.time servedBy: dciab (the site has no NTP of its own, so the
# bootstrap host serves it on the DNS service IPs until the platform takes over).
#
# Limitation: the installed hosts are not clustered and only have local storage. CAPMOX
# reaches them through pve01's API and can't clone the template from local storage to
# another host. spec.failureDomains declares pve01 as the one domain, which keeps every VM
# there (even though nodes lists all three). There is no hypervisor-level redundancy:
# losing pve01 loses the platform. Proxmox VE clustering and shared storage are on the
# roadmap.
apiVersion: dciab.io/v1alpha1
kind: Site
metadata:
  name: dc3
spec:
  bundleVersion: 0.1.0

  platform:
    type: proxmox
    proxmox:
      url: https://pve01.dc3.example.net:8006
      tlsFingerprint: "A5:A5:0B:7F:93:E9:EA:23:8D:79:7B:83:BB:72:AE:F7:AD:98:1B:66:D4:BC:FA:2A:FD:40:63:91:59:C2:8A:5A"
      nodes: [pve01, pve02, pve03]       # PVE nodes CAPMOX may place VMs on (only pve01 until clustered: see above)
      templateNode: pve01                # the node holding the template; must be in nodes
      templateID: 9010
      storage: local-lvm                 # a fresh install's local storage
      bridge: vmbr0
      # vlanTag: 110                     # honoured, but not usable on a freshly installed host: DCiaB doesn't
                                         # make its bridge VLAN-aware yet. Not needed here: vmbr0 sits on the
                                         # access port for network.nodes.vlan
      credentials:
        tokenID: dciab@pve!capmox
        tokenSecret: {env: DCIAB_PVE_TOKEN}

  kubernetes:
    version: v1.36.6

  bootstrap:
    interface: "b8:ca:3a:00:00:05"       # server zero's NIC by MAC: its name isn't known before it boots
    managementVLAN: untagged             # an access port for network.nodes.vlan, like the hypervisors
    address: 10.30.110.5
    workDisk:
      disk: {serialNumber: "S6XXNX0T500001"}   # server zero's disk the appliance installs onto (wiped)
    recipients:
      - age1j5xfcwdps86qjrrxvv8uresmxqessnxskgml6p7x7xw8az4th6mpns0acs
      - age1skgjkfxj3tkldtdnkd9cwuhennz9uuvg4q058rte5yhwk2vypq0g0u2207

  time:
    servedBy: dciab                      # DCiaB serves NTP on the DNS service IPs (the bootstrap host on Day 0)
    upstream: []                         # nothing to sync from on this isolated site
    serveLocalClock: true                # so DCiaB's clock is the site's time

  failureDomains:
    domains:
      - name: pve01
        proxmox: {node: pve01}           # every VM runs here
    notHighlyAvailable:
      reason: unclustered hosts with local storage; losing pve01 stops the site, restore is from backups

  network:
    domain: dc3.example.com
    upstreamResolvers: []                # the seed DNS forwards nothing: nodes resolve only network.domain
    isolated: true                       # [opt] says [] is intended. A site with DNS lists it above instead;
                                         # otherwise names outside the domain fail and kubeadm init can stall
    nodes:
      cidr: 10.30.110.0/24
      gateway: 10.30.110.1
      vlan: 110
    dnsServiceIPs: [10.30.110.53, 10.30.110.54]
    loadBalancer:
      mode: l2

  clusters:
    mgmt:
      apiVIP: 10.30.110.10
      nodeIPRange: 10.30.110.20-10.30.110.29
      lbPool: 10.30.110.200-10.30.110.209
      podCIDR: 10.240.0.0/16
      serviceCIDR: 10.241.0.0/16
      controlPlane: {replicas: 3, cpu: 4, memoryGiB: 16, diskGiB: 100}
      workerPools: []
    infra:
      apiVIP: 10.30.110.11
      nodeIPRange: 10.30.110.30-10.30.110.49
      lbPool: 10.30.110.210-10.30.110.239
      podCIDR: 10.242.0.0/16
      serviceCIDR: 10.243.0.0/16
      controlPlane: {replicas: 3, cpu: 4, memoryGiB: 16, diskGiB: 100}
      workerPools:
        - {name: general, replicas: 3, cpu: 8, memoryGiB: 32, diskGiB: 150}

  storage:
    block:
      provider: proxmox-csi              # local-lvm: each volume stays on pve01, the one host
      proxmoxCSI:
        storage: local-lvm
        credentials:                     # its own token: the privileges in docs/PROXMOX.md
          tokenID: csi@pve!dciab
          tokenSecret: {env: DCIAB_PVE_CSI_TOKEN}

  pki:
    mode: import-intermediate
    commonName: DC3 Platform Intermediate CA
    certificate: {file: ./secrets/pki/intermediate.crt}
    key: {file: ./secrets/pki/intermediate.key}
    chain: {file: ./secrets/pki/chain.pem}

  identity:
    adminGroup: dc3-platform-admins
    initialAdmins:
      - username: tparker
        email: tparker@example.com
        sshPublicKey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleKeyDoNotUseExampleKeyDoNotUse00 tparker"

  baremetal:
    enabled: false

  # Installed by `dciab hypervisors` before `dciab seed`. BMCs are reached through
  # bootstrap.interface's default gateway; they must already have their addresses.
  hypervisors:
    type: proxmox
    method: virtualmedia
    bootMode: UEFISecureBoot             # UEFI | UEFISecureBoot
    managementVLAN: untagged             # the management NIC sits on an access port for network.nodes.vlan
                                         # (tagged: not yet supported)
    # rootPassword: {file: ./secrets/hv/root}   # [opt] unset: one generated per host, sealed with age
    installer:                           # what the Proxmox VE installer asks for
      keyboard: en-us
      country: us
      timezone: UTC
    hosts:
      - name: pve01
        address: 10.30.110.6
        bmc:
          address: redfish-virtualmedia+https://10.30.0.21/redfish/v1/Systems/System.Embedded.1
          tlsFingerprint: "3C:1F:9A:4E:7B:22:D0:85:6E:11:AF:92:C4:38:5D:E7:0B:6A:F1:29:8C:D4:47:E3:52:B9:16:7F:A0:C8:3E:D5"
          credentials: {username: dciab, password: {file: ./secrets/bmc/pve01}}
        bootMACAddress: "b8:ca:3a:01:03:01"   # the management NIC
        rootDeviceHints: {model: "Dell BOSS-N1"}
      - name: pve02
        address: 10.30.110.7
        bmc:
          address: redfish-virtualmedia+https://10.30.0.22/redfish/v1/Systems/System.Embedded.1
          caBundle: {file: ./secrets/bmc/ca.pem}
          credentials: {username: dciab, password: {file: ./secrets/bmc/pve02}}
        bootMACAddress: "b8:ca:3a:01:03:02"
        rootDeviceHints: {model: "Dell BOSS-N1"}
      - name: pve03
        address: 10.30.110.8
        bmc:
          address: redfish-virtualmedia+https://10.30.0.23/redfish/v1/Systems/System.Embedded.1
          caBundle: {file: ./secrets/bmc/ca.pem}
          credentials: {username: dciab, password: {file: ./secrets/bmc/pve03}}
        bootMACAddress: "b8:ca:3a:01:03:03"
        rootDeviceHints: {model: "Dell BOSS-N1"}
