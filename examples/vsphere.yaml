# DCiaB site config: vSphere.
# Every field is required unless marked [opt]; nothing site-specific has a default.
# Secrets are references only: {file: <path>} (relative to this file) or {env: <VAR>}.
apiVersion: dciab.io/v1alpha1
kind: Site
metadata:
  name: dc1                              # short site id, used in names and DNS labels
spec:
  bundleVersion: 0.1.0                   # must equal VERSION in the archive

  platform:
    type: vsphere                        # vsphere | proxmox
    vsphere:
      server: vcsa.dc1.example.net
      thumbprint: "53:19:77:F3:07:F2:EE:EB:E0:2C:81:E7:74:09:50:0C:D3:82:8F:7C:0B:A0:01:2F:07:F7:AC:2D:FF:51:8E:74"
      datacenter: DC1
      cluster: Compute-A
      datastore: vsanDatastore
      folder: /DC1/vm/dciab
      resourcePool: /DC1/host/Compute-A/Resources/dciab
      network: dvpg-mgmt-110             # port group for MGMT + INFRA nodes
      template: rocky10-kube-v1.36.6     # must exist; k8s version must match bundle.lock
      credentials:
        username: svc-dciab@vsphere.local
        password: {file: ./secrets/vsphere.pw}

  kubernetes:
    version: v1.36.6

  bootstrap:
    interface: ens192                    # bootstrap host NIC on the node network
    address: 10.20.110.5
    recipients:                          # age public keys; at least two
      - age1ffyw9h8rvfdsshhfl4jvfgvh5mdl3xv98a9sq5p6lyg5d7z62t2r2q9j6f
      - age1j5xfcwdps86qjrrxvv8uresmxqessnxskgml6p7x7xw8az4th6mpns0acs

  time:
    servedBy: site                       # site | dciab
    servers: [10.0.0.123, 10.0.1.123]

  failureDomains:                        # three DRS host groups in Compute-A; the site creates the groups and
    domains:                             # the k8s-region/k8s-zone tags first
      - {name: az1, vsphere: {computeCluster: Compute-A, hostGroup: az1-hosts, vmGroup: az1-vms}}
      - {name: az2, vsphere: {computeCluster: Compute-A, hostGroup: az2-hosts, vmGroup: az2-vms}}
      - {name: az3, vsphere: {computeCluster: Compute-A, hostGroup: az3-hosts, vmGroup: az3-vms}}

  network:
    domain: dc1.example.com              # zone the site delegates to DCiaB
    upstreamResolvers: [10.0.0.53, 10.0.1.53]   # the seed DNS forwards other names here; [] needs isolated: true
    nodes:
      cidr: 10.20.110.0/24
      gateway: 10.20.110.1
      vlan: 110
    dnsServiceIPs: [10.20.110.53, 10.20.110.54]  # held by the bootstrap host during seed
    loadBalancer:
      mode: bgp                          # bgp | l2
      bgp:
        localASN: 65110
        peers:
          - {address: 10.20.110.1, asn: 65000}
          - {address: 10.20.110.2, asn: 65000}

  clusters:
    mgmt:
      apiVIP: 10.20.110.10
      nodeIPRange: 10.20.110.20-10.20.110.29
      lbPool: 10.20.110.200-10.20.110.209
      podCIDR: 10.240.0.0/16
      serviceCIDR: 10.241.0.0/16
      controlPlane: {replicas: 3, cpu: 4, memoryGiB: 16, diskGiB: 100}
      workerPools: []                    # explicit: control plane nodes run MGMT workloads
    infra:
      apiVIP: 10.20.110.11
      nodeIPRange: 10.20.110.30-10.20.110.49
      lbPool: 10.20.110.210-10.20.110.239
      podCIDR: 10.242.0.0/16
      serviceCIDR: 10.243.0.0/16
      controlPlane: {replicas: 3, cpu: 4, memoryGiB: 16, diskGiB: 100}
      workerPools:
        - {name: general, replicas: 4, cpu: 16, memoryGiB: 64, diskGiB: 150}   # Longhorn data shares the root disk

  storage:
    longhorn:
      replicaCount: 3
      backupTarget: s3://longhorn@minio.dc1.example.net/dc1   # site-provided s3:// or nfs://
      backupCredentials: {file: ./secrets/longhorn-s3.env}      # required for s3; omitted for nfs

  pki:
    mode: generate-root                  # generate-root | import-intermediate
    commonName: DC1 Platform Root CA

  identity:
    adminGroup: dc1-platform-admins
    initialAdmins:
      - username: tparker
        email: tparker@example.com
        sshPublicKey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleKeyDoNotUseExampleKeyDoNotUse00 tparker"

  baremetal:
    enabled: false

  workloadClusters:                      # [opt]
    - name: apps01
      class: vsphere                     # must match platform.type for VM clusters
      apiVIP: 10.20.110.12
      nodeIPRange: 10.20.110.60-10.20.110.89
      lbPool: 10.20.110.240-10.20.110.249
      podCIDR: 10.244.0.0/16
      serviceCIDR: 10.245.0.0/16
      controlPlane: {replicas: 3, cpu: 4, memoryGiB: 16, diskGiB: 100}
      workerPools:
        - {name: general, replicas: 3, cpu: 8, memoryGiB: 32, diskGiB: 150}   # Longhorn data shares the root disk
