# DCiaB site config: Proxmox VE.
# Same shape as vsphere.yaml; only spec.platform differs.
apiVersion: dciab.io/v1alpha1
kind: Site
metadata:
  name: dc3
spec:
  bundleVersion: 0.1.0

  platform:
    type: proxmox
    proxmox:
      url: https://pve01.dc3.example.net:8006
      tlsFingerprint: "A5:A5:0B:7F:93:E9:EA:23:8D:79:7B:83:BB:72:AE:F7:AD:98:1B:66:D4:BC:FA:2A:FD:40:63:91:59:C2:8A:5A"
      nodes: [pve01, pve02, pve03]       # PVE nodes CAPMOX may place VMs on
      templateNode: pve01                # the node holding the template; must be in nodes
      templateID: 9010
      storage: ceph-vm
      bridge: vmbr0
      vlanTag: 110                       # [opt] only when the bridge is VLAN-aware
      credentials:
        tokenID: dciab@pve!capmox
        tokenSecret: {env: DCIAB_PVE_TOKEN}

  kubernetes:
    version: v1.36.6

  bootstrap:
    interface: eth0
    address: 10.30.110.5
    recipients:
      - age1j5xfcwdps86qjrrxvv8uresmxqessnxskgml6p7x7xw8az4th6mpns0acs
      - age1skgjkfxj3tkldtdnkd9cwuhennz9uuvg4q058rte5yhwk2vypq0g0u2207

  time:
    servedBy: site                       # the site's own NTP servers
    servers: [10.30.0.123]

  failureDomains:                        # one PVE node per domain, named after it
    domains:
      - {name: pve01, proxmox: {node: pve01}}
      - {name: pve02, proxmox: {node: pve02}}
      - {name: pve03, proxmox: {node: pve03}}

  network:
    domain: dc3.example.com
    upstreamResolvers: []                # the seed DNS forwards nothing: nodes resolve only network.domain
    isolated: true                       # [opt] says [] is intended. A site with DNS lists it above instead;
                                         # otherwise names outside the domain fail and kubeadm init can stall
    nodes:
      cidr: 10.30.110.0/24
      gateway: 10.30.110.1
      vlan: 110
    dnsServiceIPs: [10.30.110.53, 10.30.110.54]
    storage:                             # [opt] iSCSI/NVMe-oF fabrics for initiators inside the nodes (ceph-csi, SAN drivers)
      - {name: san-a, cidr: 10.40.10.0/24, vlan: 410, mtu: 9000}
      - {name: san-b, cidr: 10.40.20.0/24, vlan: 420, mtu: 9000}
    loadBalancer:
      mode: l2

  clusters:
    mgmt:
      apiVIP: 10.30.110.10
      nodeIPRange: 10.30.110.20-10.30.110.29
      lbPool: 10.30.110.200-10.30.110.209
      podCIDR: 10.240.0.0/16
      serviceCIDR: 10.241.0.0/16
      controlPlane: {replicas: 3, cpu: 4, memoryGiB: 16, diskGiB: 100}
      workerPools: []
    infra:
      apiVIP: 10.30.110.11
      nodeIPRange: 10.30.110.30-10.30.110.49
      lbPool: 10.30.110.210-10.30.110.239
      podCIDR: 10.242.0.0/16
      serviceCIDR: 10.243.0.0/16
      controlPlane: {replicas: 3, cpu: 4, memoryGiB: 16, diskGiB: 100}
      workerPools:
        - {name: general, replicas: 3, cpu: 8, memoryGiB: 32, diskGiB: 150}
      storageIPRanges:                   # [opt] a NIC on each storage network, for every INFRA node
        san-a: 10.40.10.30-10.40.10.49
        san-b: 10.40.20.30-10.40.20.49

  storage:
    block:
      provider: longhorn                 # on the root disk: CAPMOX gives VMs no second disk yet
      longhorn:
        replicaCount: 1                  # one copy: the Ceph datastore already replicates (ADR 0008)
        backupTarget: nfs://nas01.dc3.example.net:/exports/longhorn

  pki:
    mode: import-intermediate
    commonName: DC3 Platform Intermediate CA
    certificate: {file: ./secrets/pki/intermediate.crt}
    key: {file: ./secrets/pki/intermediate.key}
    chain: {file: ./secrets/pki/chain.pem}

  identity:
    adminGroup: dc3-platform-admins
    initialAdmins:
      - username: tparker
        email: tparker@example.com
        sshPublicKey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleKeyDoNotUseExampleKeyDoNotUse00 tparker"

  baremetal:
    enabled: false
