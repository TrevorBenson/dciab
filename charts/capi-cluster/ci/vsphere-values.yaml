# CI render: a vSphere workload cluster (matches examples/vsphere.yaml).
name: apps01
class: vsphere
kubernetesVersion: v1.36.6
apiVIP: 10.20.110.12
podCIDR: 10.244.0.0/16
serviceCIDR: 10.245.0.0/16
labels:
  dciab.io/baseline: "true"
podSecurity:
  exemptNamespaces: [kube-system, longhorn-system]
encryption:
  createSecret: true
nodes:
  registryMirror: registry.dc1.example.com
  mirroredRegistries: [docker.io, quay.io, ghcr.io, registry.k8s.io]
  trustBundle: |
    -----BEGIN CERTIFICATE-----
    MIIBdummyCertificateForCIOnly
    -----END CERTIFICATE-----
  ntpServers: [10.0.0.123, 10.0.1.123]
