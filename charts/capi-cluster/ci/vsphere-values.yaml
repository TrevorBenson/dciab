  dnsServers: [10.20.110.53, 10.20.110.54]
  oidc:
    issuerURL: https://auth.dc1.example.com/application/o/kubernetes/
    clientID: kubernetes
network:
  nodeIPRange: 10.20.110.60-10.20.110.89
  prefix: 24
  gateway: 10.20.110.1
controlPlane:
  replicas: 3
  machine: {cpu: 4, memoryGiB: 16, diskGiB: 100}
workerPools:
  - name: general
    replicas: 3
    machine: {cpu: 8, memoryGiB: 32, diskGiB: 150}
vsphere:
  server: vcsa.dc1.example.net
  thumbprint: "53:19:77:F3:07:F2:EE:EB:E0:2C:81:E7:74:09:50:0C:D3:82:8F:7C:0B:A0:01:2F:07:F7:AC:2D:FF:51:8E:74"
  datacenter: DC1
  datastore: vsanDatastore
  folder: /DC1/vm/dciab
  resourcePool: /DC1/host/Compute-A/Resources/dciab
  network: dvpg-mgmt-110
  template: rocky10-kube-v1.36.6
