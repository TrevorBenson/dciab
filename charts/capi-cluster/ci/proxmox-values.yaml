# CI render: the INFRA cluster on Proxmox (matches examples/proxmox.yaml).
name: infra
class: proxmox
kubernetesVersion: v1.36.6
apiVIP: 10.30.110.11
podCIDR: 10.242.0.0/16
serviceCIDR: 10.243.0.0/16
podSecurity:
  exemptNamespaces: [kube-system, longhorn-system]
encryption:
  createSecret: true
nodes:
  registryMirror: registry.dc3.example.com
  mirroredRegistries: [docker.io, quay.io, ghcr.io, registry.k8s.io]
  trustBundle: |
    -----BEGIN CERTIFICATE-----
    MIIBdummyCertificateForCIOnly
    -----END CERTIFICATE-----
  ntpServers: [10.30.0.123]
  sshAuthorizedKeys: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleKeyDoNotUseExampleKeyDoNotUse00 tparker"]
  dnsServers: [10.30.110.53, 10.30.110.54]
network:
  nodeIPRange: 10.30.110.30-10.30.110.49
  prefix: 24
  gateway: 10.30.110.1
controlPlane:
  replicas: 3
  machine: {cpu: 4, memoryGiB: 16, diskGiB: 100}
workerPools:
  - name: general
    replicas: 3
    machine: {cpu: 8, memoryGiB: 32, diskGiB: 150}
proxmox:
  allowedNodes: [pve01, pve02, pve03]
  templateNode: pve01
  templateID: 9010
  storage: ceph-vm
  bridge: vmbr0
  vlanTag: 110
