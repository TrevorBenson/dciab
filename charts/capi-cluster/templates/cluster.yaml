{{- include "capi-cluster.validate" . }}
{{- $v := .Values }}
{{- $vm := ne $v.class "metal3" }}
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: {{ $v.name | quote }}
  labels:
    {{- include "capi-cluster.labels" . | nindent 4 }}
    dciab.io/class: {{ $v.class | quote }}
    {{- with $v.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "capi-cluster.annotations" . | nindent 4 }}
spec:
  clusterNetwork:
    pods:
      cidrBlocks: [{{ $v.podCIDR | quote }}]
    services:
      cidrBlocks: [{{ $v.serviceCIDR | quote }}]
  topology:
    classRef:
      name: {{ printf "dciab-%s-%s" $v.class $v.classRevision | quote }}
      namespace: {{ $v.classNamespace | quote }}
    version: {{ $v.kubernetesVersion | quote }}
    controlPlane:
      replicas: {{ $v.controlPlane.replicas }}
    {{- with $v.workerPools }}
    workers:
      machineDeployments:
        {{- range . }}
        - class: default
          name: {{ .name | quote }}
          replicas: {{ .replicas }}
          {{- if .failureDomain }}
          {{- if eq $v.class "metal3" }}
          failureDomain: {{ .failureDomain | quote }}
          {{- else if eq $v.class "vsphere" }}
          failureDomain: {{ printf "%s-%s" $v.name .failureDomain | quote }}
          {{- end }}
          {{- end }}
          variables:
            overrides:
              {{- if $vm }}
              - name: machine
                value: {{ toJson .machine }}
              {{- else }}
              - name: hostSelector
                value: {{ toJson .hostSelector }}
              {{- end }}
              {{- if and .failureDomain (eq $v.class "proxmox") }}
              # CAPMOX has no failure domains yet: the class pins the pool to the domain's node.
              - name: failureDomain
                value: {{ .failureDomain | quote }}
              {{- end }}
        {{- end }}
    {{- end }}
    variables:
      - name: apiVIP
        value: {{ $v.apiVIP | quote }}
      - name: registryMirror
        value: {{ $v.nodes.registryMirror | quote }}
      - name: mirroredRegistries
        value: {{ toJson $v.nodes.mirroredRegistries }}
      - name: podSecurityExemptNamespaces
        value: {{ toJson $v.podSecurity.exemptNamespaces }}
      - name: trustBundle
        value: {{ $v.nodes.trustBundle | toJson }}
      - name: ntpServers
        value: {{ toJson $v.nodes.ntpServers }}
      - name: sshAuthorizedKeys
        value: {{ toJson $v.nodes.sshAuthorizedKeys }}
      {{- with $v.nodes.vipInterface }}
      - name: vipInterface
        value: {{ . | quote }}
      {{- end }}
      {{- if $v.controlPlane.schedulable }}
      # No worker nodes: the control plane nodes run the workloads.
      - name: controlPlaneSchedulable
        value: true
      {{- end }}
      {{- with $v.nodes.authentication }}
      - name: authentication
        value: {{ toJson . }}
      {{- end }}
      {{- if $vm }}
      # Cluster-level machine size: the control plane's. Worker pools override it.
      - name: machine
        value: {{ toJson $v.controlPlane.machine }}
      - name: dnsServers
        value: {{ toJson $v.nodes.dnsServers }}
      {{- with $v.nodes.mtu }}
      - name: mtu
        value: {{ . }}
      {{- end }}
      {{- with $v.storageNetworks }}
      - name: storageNetworks
        value:
          {{- range . }}
          - name: {{ .name | quote }}
            {{- if eq $v.class "proxmox" }}
            {{- with .bridge }}
            bridge: {{ . | quote }}
            {{- end }}
            {{- with .vlan }}
            vlan: {{ . }}
            {{- end }}
            {{- else }}
            portGroup: {{ .portGroup | quote }}
            {{- end }}
            {{- with .mtu }}
            mtu: {{ . }}
            {{- end }}
          {{- end }}
      {{- end }}
      {{- end }}
      {{- if eq $v.class "vsphere" }}
      - name: vsphere
        value: {{ toJson $v.vsphere }}
      {{- if $v.vsphereFailureDomains }}
      - name: zones
        value: true
      {{- end }}
      {{- if and (hasKey $v "clusterModules") (not $v.clusterModules) }}
      - name: disableClusterModule
        value: true
      {{- end }}
      {{- end }}
      {{- if eq $v.class "proxmox" }}
      - name: proxmox
        value: {{ toJson $v.proxmox }}
      - name: nodeNetwork
        value:
          addresses: [{{ $v.network.nodeIPRange | quote }}]
          prefix: {{ $v.network.prefix }}
          gateway: {{ $v.network.gateway | quote }}
      {{- with $v.topology }}
      - name: topology
        value: {{ toJson . }}
      {{- end }}
      {{- end }}
      {{- if eq $v.class "metal3" }}
      - name: image
        value: {{ toJson $v.metal3.image }}
      # Cluster-level host selector: the control plane's. Worker pools override it.
      - name: hostSelector
        value: {{ toJson $v.controlPlane.hostSelector }}
      {{- with $v.metal3.failureDomains }}
      - name: failureDomains
        value: {{ toJson . }}
      {{- end }}
      {{- end }}
