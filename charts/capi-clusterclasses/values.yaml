# Class revisions to install (classes/<revision>/). Keep every revision a cluster still
# uses. Removing one leaves its objects in the cluster (helm.sh/resource-policy: keep);
# delete them by hand once no cluster references them (README.md). See docs/VERSIONING.md.
revisions:
  - r1

# Providers whose classes are installed. DCiaB installs every provider on MGMT, so all
# three are on; turn one off only if its CRDs are absent from the cluster.
providers:
  vsphere: true
  proxmox: true
  metal3: true
