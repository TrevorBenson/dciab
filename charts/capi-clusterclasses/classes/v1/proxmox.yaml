# ClusterClass dciab-proxmox-v1: FROZEN.
# Clusters reference this class by name, and editing it rolls every one of them.
# To change anything here, copy classes/v1 to classes/v2, edit the copy, and move
# clusters over one at a time. Do not edit this file.
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: dciab-proxmox-v1
  annotations:
    dciab.io/description: "Proxmox VE (CAPMOX) machines for control plane and workers"
spec:
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KubeadmControlPlaneTemplate
      name: dciab-proxmox-v1-controlplane
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
        kind: ProxmoxMachineTemplate
        name: dciab-proxmox-v1-controlplane
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
      kind: ProxmoxClusterTemplate
      name: dciab-proxmox-v1
  workers:
    machineDeployments:
      - class: default
        bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            name: dciab-proxmox-v1-worker
        infrastructure:
          templateRef:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
            kind: ProxmoxMachineTemplate
            name: dciab-proxmox-v1-worker
  variables:
    - name: apiVIP
      required: true
      schema:
        openAPIV3Schema:
          type: string
          description: Control plane endpoint address, held by kube-vip on the control plane nodes.
    - name: registryMirror
      required: true
      schema:
        openAPIV3Schema:
          type: string
          minLength: 1
          description: >-
            Host (and optional port) of the registry mirror. Nodes pull docker.io, quay.io,
            ghcr.io and registry.k8s.io through https://<registryMirror>/v2/<upstream>/.
    - name: trustBundle
      required: true
      schema:
        openAPIV3Schema:
          type: string
          minLength: 1
          description: PEM CA bundle added to the node trust store (the platform CA).
    - name: ntpServers
      required: true
      schema:
        openAPIV3Schema:
          type: array
          minItems: 1
          items:
            type: string
    - name: sshAuthorizedKeys
      required: true
      schema:
        openAPIV3Schema:
          type: array
          minItems: 1
          items:
            type: string
          description: Public keys for the break-glass user 'dciab' on every node.
    - name: oidc
      required: false
      schema:
        openAPIV3Schema:
          type: object
          required: [issuerURL, clientID]
          properties:
            issuerURL:
              type: string
            clientID:
              type: string
            usernameClaim:
              type: string
              default: preferred_username
            groupsClaim:
              type: string
              default: groups
          description: API server OIDC settings (Authentik). Leave unset to disable.
    - name: machine
      required: true
      schema:
        openAPIV3Schema:
          type: object
          required: [cpu, memoryGiB, diskGiB]
          properties:
            cpu:
              type: integer
              minimum: 2
            memoryGiB:
              type: integer
              minimum: 4
            diskGiB:
              type: integer
              minimum: 40
          description: Machine size. Set at cluster level and override per control plane or worker pool.
    - name: dnsServers
      required: true
      schema:
        openAPIV3Schema:
          type: array
          minItems: 1
          items:
            type: string
          description: DNS resolvers for the nodes (the PowerDNS recursor service IPs).
    - name: proxmox
      required: true
      schema:
        openAPIV3Schema:
          type: object
          required: [allowedNodes, templateNode, templateID, storage, bridge]
          properties:
            allowedNodes:
              type: array
              minItems: 1
              items: {type: string}
            templateNode:
              type: string
              description: The node holding the VM template.
            templateID:
              type: integer
            storage:
              type: string
            bridge:
              type: string
            vlanTag:
              type: integer
              minimum: 1
              maximum: 4094
    - name: nodeNetwork
      required: true
      schema:
        openAPIV3Schema:
          type: object
          required: [addresses, prefix, gateway]
          properties:
            addresses:
              type: array
              minItems: 1
              items: {type: string}
              description: Node address ranges, such as 10.30.110.20-10.30.110.29.
            prefix:
              type: integer
              minimum: 1
              maximum: 32
            gateway:
              type: string

  patches:
    - name: nodeBase
      description: Trust bundle, registry mirrors, NTP and the break-glass user on every node.
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files
              valueFrom:
                template: |
                  - path: /etc/pki/ca-trust/source/anchors/dciab-platform-ca.crt
                    owner: root:root
                    permissions: "0644"
                    content: |
                    {{- .trustBundle | nindent 6 }}
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/docker.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://registry-1.docker.io"
                    [host."https://{{ .registryMirror }}/v2/docker.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/quay.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://quay.io"
                    [host."https://{{ .registryMirror }}/v2/quay.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/ghcr.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://ghcr.io"
                    [host."https://{{ .registryMirror }}/v2/ghcr.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/registry.k8s.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://registry.k8s.io"
                    [host."https://{{ .registryMirror }}/v2/registry.k8s.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/ntp
              valueFrom:
                template: |
                  enabled: true
                  servers: {{ .ntpServers | toJson }}
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/users
              valueFrom:
                template: |
                  - name: dciab
                    sudo: "ALL=(ALL) NOPASSWD:ALL"
                    sshAuthorizedKeys: {{ .sshAuthorizedKeys | toJson }}
        - selector:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            matchResources:
              machineDeploymentClass:
                names: [default]
          jsonPatches:
            - op: add
              path: /spec/template/spec/files
              valueFrom:
                template: |
                  - path: /etc/pki/ca-trust/source/anchors/dciab-platform-ca.crt
                    owner: root:root
                    permissions: "0644"
                    content: |
                    {{- .trustBundle | nindent 6 }}
            - op: add
              path: /spec/template/spec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/docker.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://registry-1.docker.io"
                    [host."https://{{ .registryMirror }}/v2/docker.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/quay.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://quay.io"
                    [host."https://{{ .registryMirror }}/v2/quay.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/ghcr.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://ghcr.io"
                    [host."https://{{ .registryMirror }}/v2/ghcr.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/registry.k8s.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://registry.k8s.io"
                    [host."https://{{ .registryMirror }}/v2/registry.k8s.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/ntp
              valueFrom:
                template: |
                  enabled: true
                  servers: {{ .ntpServers | toJson }}
            - op: add
              path: /spec/template/spec/users
              valueFrom:
                template: |
                  - name: dciab
                    sudo: "ALL=(ALL) NOPASSWD:ALL"
                    sshAuthorizedKeys: {{ .sshAuthorizedKeys | toJson }}
    - name: kubeVip
      description: kube-vip static pod holding the API VIP on control plane nodes.
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  path: /etc/kubernetes/manifests/kube-vip.yaml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    apiVersion: v1
                    kind: Pod
                    metadata:
                      name: kube-vip
                      namespace: kube-system
                    spec:
                      containers:
                        - name: kube-vip
                          image: ghcr.io/kube-vip/kube-vip:v1.3.1
                          imagePullPolicy: IfNotPresent
                          args: [manager]
                          env:
                            - {name: vip_arp, value: "true"}
                            - {name: port, value: "6443"}
                            - {name: vip_cidr, value: "32"}
                            - {name: cp_enable, value: "true"}
                            - {name: cp_namespace, value: kube-system}
                            - {name: vip_leaderelection, value: "true"}
                            - {name: vip_leasename, value: plndr-cp-lock}
                            - {name: vip_leaseduration, value: "15"}
                            - {name: vip_renewdeadline, value: "10"}
                            - {name: vip_retryperiod, value: "2"}
                            - {name: address, value: "{{ .apiVIP }}"}
                          securityContext:
                            capabilities:
                              add: [NET_ADMIN, NET_RAW]
                          volumeMounts:
                            - {mountPath: /etc/kubernetes/admin.conf, name: kubeconfig}
                      hostAliases:
                        - {hostnames: [kubernetes], ip: 127.0.0.1}
                      hostNetwork: true
                      volumes:
                        - name: kubeconfig
                          hostPath:
                            path: /etc/kubernetes/admin.conf
                            type: FileOrCreate

    - name: oidc
      description: API server OIDC flags, when the oidc variable is set.
      enabledIf: '{{ if .oidc }}true{{ end }}'
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs/-
              valueFrom:
                template: |
                  name: oidc-issuer-url
                  value: {{ .oidc.issuerURL | quote }}
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs/-
              valueFrom:
                template: |
                  name: oidc-client-id
                  value: {{ .oidc.clientID | quote }}
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs/-
              valueFrom:
                template: |
                  name: oidc-username-claim
                  value: {{ .oidc.usernameClaim | quote }}
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs/-
              valueFrom:
                template: |
                  name: oidc-groups-claim
                  value: {{ .oidc.groupsClaim | quote }}
    - name: proxmoxCluster
      description: Allowed nodes, node addressing, DNS, credentials Secret and control plane endpoint.
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
            kind: ProxmoxClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/allowedNodes
              valueFrom: {variable: proxmox.allowedNodes}
            - op: replace
              path: /spec/template/spec/dnsServers
              valueFrom: {variable: dnsServers}
            - op: add
              path: /spec/template/spec/ipv4Config
              valueFrom:
                template: |
                  addresses: {{ .nodeNetwork.addresses | toJson }}
                  prefix: {{ .nodeNetwork.prefix }}
                  gateway: {{ .nodeNetwork.gateway | quote }}
            - op: add
              path: /spec/template/spec/controlPlaneEndpoint
              valueFrom:
                template: |
                  host: {{ .apiVIP | quote }}
                  port: 6443
            - op: add
              path: /spec/template/spec/credentialsRef
              valueFrom:
                template: |
                  name: {{ .builtin.cluster.name }}-proxmox-credentials
    - name: proxmoxMachines
      description: Template, storage, size and network device for every machine.
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
            kind: ProxmoxMachineTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/sourceNode
              valueFrom: {variable: proxmox.templateNode}
            - op: add
              path: /spec/template/spec/templateID
              valueFrom: {variable: proxmox.templateID}
            - op: add
              path: /spec/template/spec/storage
              valueFrom: {variable: proxmox.storage}
            - op: add
              path: /spec/template/spec/numCores
              valueFrom: {variable: machine.cpu}
            - op: add
              path: /spec/template/spec/memoryMiB
              valueFrom:
                template: '{{ mul .machine.memoryGiB 1024 }}'
            - op: add
              path: /spec/template/spec/disks
              valueFrom:
                template: |
                  bootVolume:
                    disk: scsi0
                    sizeGb: {{ .machine.diskGiB }}
            - op: replace
              path: /spec/template/spec/network
              valueFrom:
                template: |
                  networkDevices:
                    - name: net0
                      bridge: {{ .proxmox.bridge | quote }}
                      model: virtio
                      defaultIPv4: true
                      {{- if .proxmox.vlanTag }}
                      vlan: {{ .proxmox.vlanTag }}
                      {{- end }}
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
            kind: ProxmoxMachineTemplate
            matchResources:
              machineDeploymentClass:
                names: [default]
          jsonPatches:
            - op: add
              path: /spec/template/spec/sourceNode
              valueFrom: {variable: proxmox.templateNode}
            - op: add
              path: /spec/template/spec/templateID
              valueFrom: {variable: proxmox.templateID}
            - op: add
              path: /spec/template/spec/storage
              valueFrom: {variable: proxmox.storage}
            - op: add
              path: /spec/template/spec/numCores
              valueFrom: {variable: machine.cpu}
            - op: add
              path: /spec/template/spec/memoryMiB
              valueFrom:
                template: '{{ mul .machine.memoryGiB 1024 }}'
            - op: add
              path: /spec/template/spec/disks
              valueFrom:
                template: |
                  bootVolume:
                    disk: scsi0
                    sizeGb: {{ .machine.diskGiB }}
            - op: replace
              path: /spec/template/spec/network
              valueFrom:
                template: |
                  networkDevices:
                    - name: net0
                      bridge: {{ .proxmox.bridge | quote }}
                      model: virtio
                      defaultIPv4: true
                      {{- if .proxmox.vlanTag }}
                      vlan: {{ .proxmox.vlanTag }}
                      {{- end }}

---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxClusterTemplate
metadata:
  name: dciab-proxmox-v1
spec:
  template:
    spec:
      dnsServers: [set-by-patch]
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxMachineTemplate
metadata:
  name: dciab-proxmox-v1-controlplane
spec:
  template:
    spec:
      full: true
      format: qcow2
      numSockets: 1
      metadataSettings:
        providerIDInjection: true
      network:
        networkDevices:
          - name: net0
            model: virtio
            defaultIPv4: true
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxMachineTemplate
metadata:
  name: dciab-proxmox-v1-worker
spec:
  template:
    spec:
      full: true
      format: qcow2
      numSockets: 1
      metadataSettings:
        providerIDInjection: true
      network:
        networkDevices:
          - name: net0
            model: virtio
            defaultIPv4: true
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlaneTemplate
metadata:
  name: dciab-proxmox-v1-controlplane
spec:
  template:
    spec:
      kubeadmConfigSpec:
        clusterConfiguration:
          apiServer:
            extraArgs:
              - {name: profiling, value: "false"}
          controllerManager:
            extraArgs:
              - {name: profiling, value: "false"}
          scheduler:
            extraArgs:
              - {name: profiling, value: "false"}
        initConfiguration:
          nodeRegistration:
            name: '{{ local_hostname }}'
            # no kubelet extra args
        joinConfiguration:
          nodeRegistration:
            name: '{{ local_hostname }}'
            # no kubelet extra args
        preKubeadmCommands:
          - update-ca-trust extract
          # kube-vip needs super-admin.conf while kubeadm init runs (Kubernetes 1.29+).
          - "[ -f /run/kubeadm/kubeadm.yaml ] && sed -i 's#path: /etc/kubernetes/admin.conf#path: /etc/kubernetes/super-admin.conf#' /etc/kubernetes/manifests/kube-vip.yaml || true"
        postKubeadmCommands:
          - "[ -f /run/kubeadm/kubeadm.yaml ] && sed -i 's#path: /etc/kubernetes/super-admin.conf#path: /etc/kubernetes/admin.conf#' /etc/kubernetes/manifests/kube-vip.yaml || true"
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: dciab-proxmox-v1-worker
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          name: '{{ local_hostname }}'
      preKubeadmCommands:
        - update-ca-trust extract
