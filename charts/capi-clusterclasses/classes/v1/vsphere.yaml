# ClusterClass dciab-vsphere-v1: FROZEN once released.
# Clusters reference this class by name, and editing it rolls every one of them.
# To change anything here, copy this version's folder to the next version, edit the
# copy, and move clusters over one at a time. Do not edit a released version.
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: dciab-vsphere-v1
  annotations:
    dciab.io/description: "vSphere (CAPV) machines for control plane and workers"
spec:
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KubeadmControlPlaneTemplate
      name: dciab-vsphere-v1-controlplane
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: VSphereMachineTemplate
        name: dciab-vsphere-v1-controlplane
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
      kind: VSphereClusterTemplate
      name: dciab-vsphere-v1
  workers:
    machineDeployments:
      - class: default
        bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            name: dciab-vsphere-v1-worker
        infrastructure:
          templateRef:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: VSphereMachineTemplate
            name: dciab-vsphere-v1-worker
  variables:
    - name: apiVIP
      required: true
      schema:
        openAPIV3Schema:
          type: string
          description: Control plane endpoint address, held by kube-vip on the control plane nodes.
    - name: vipInterface
      required: false
      schema:
        openAPIV3Schema:
          type: string
          minLength: 1
          description: >-
            Interface kube-vip announces the API VIP on. Leave unset to use the interface
            that holds the default route.
    - name: registryMirror
      required: true
      schema:
        openAPIV3Schema:
          type: string
          minLength: 1
          description: >-
            Host (and optional port) of the registry mirror. Nodes pull docker.io, quay.io,
            ghcr.io and registry.k8s.io through https://<registryMirror>/v2/<upstream>/.
    - name: trustBundle
      required: true
      schema:
        openAPIV3Schema:
          type: string
          minLength: 1
          description: PEM CA bundle added to the node trust store (the platform CA).
    - name: ntpServers
      required: true
      schema:
        openAPIV3Schema:
          type: array
          minItems: 1
          items:
            type: string
    - name: sshAuthorizedKeys
      required: true
      schema:
        openAPIV3Schema:
          type: array
          minItems: 1
          items:
            type: string
          description: Public keys for the break-glass user 'dciab' on every node.
    - name: oidc
      required: false
      schema:
        openAPIV3Schema:
          type: object
          required: [issuerURL, clientID]
          properties:
            issuerURL:
              type: string
            clientID:
              type: string
            usernameClaim:
              type: string
              default: preferred_username
            groupsClaim:
              type: string
              default: groups
          description: API server OIDC settings (Authentik). Leave unset to disable.
    - name: machine
      required: true
      schema:
        openAPIV3Schema:
          type: object
          required: [cpu, memoryGiB, diskGiB]
          properties:
            cpu:
              type: integer
              minimum: 2
            memoryGiB:
              type: integer
              minimum: 4
            diskGiB:
              type: integer
              minimum: 40
          description: Machine size. Set at cluster level and override per control plane or worker pool.
    - name: dnsServers
      required: true
      schema:
        openAPIV3Schema:
          type: array
          minItems: 1
          items:
            type: string
          description: DNS resolvers for the nodes (the PowerDNS recursor service IPs).
    - name: vsphere
      required: true
      schema:
        openAPIV3Schema:
          type: object
          required: [server, thumbprint, datacenter, datastore, folder, resourcePool, network, template]
          properties:
            server: {type: string}
            thumbprint: {type: string}
            datacenter: {type: string}
            datastore: {type: string}
            folder: {type: string}
            resourcePool: {type: string}
            network:
              type: string
              description: Port group for the nodes.
            template:
              type: string
              description: VM template; its Kubernetes version must match the topology version.

  patches:
    - name: nodeBase
      description: Trust bundle, registry mirrors, NTP and the break-glass user on every node.
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files
              valueFrom:
                template: |
                  - path: /etc/pki/ca-trust/source/anchors/dciab-platform-ca.crt
                    owner: root:root
                    permissions: "0644"
                    content: |
                    {{- .trustBundle | nindent 6 }}
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/docker.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://registry-1.docker.io"
                    [host."https://{{ .registryMirror }}/v2/docker.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/quay.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://quay.io"
                    [host."https://{{ .registryMirror }}/v2/quay.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/ghcr.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://ghcr.io"
                    [host."https://{{ .registryMirror }}/v2/ghcr.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/registry.k8s.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://registry.k8s.io"
                    [host."https://{{ .registryMirror }}/v2/registry.k8s.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/ntp
              valueFrom:
                template: |
                  enabled: true
                  servers: {{ .ntpServers | toJson }}
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/users
              valueFrom:
                template: |
                  - name: dciab
                    sudo: "ALL=(ALL) NOPASSWD:ALL"
                    sshAuthorizedKeys: {{ .sshAuthorizedKeys | toJson }}
        - selector:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            matchResources:
              machineDeploymentClass:
                names: [default]
          jsonPatches:
            - op: add
              path: /spec/template/spec/files
              valueFrom:
                template: |
                  - path: /etc/pki/ca-trust/source/anchors/dciab-platform-ca.crt
                    owner: root:root
                    permissions: "0644"
                    content: |
                    {{- .trustBundle | nindent 6 }}
            - op: add
              path: /spec/template/spec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/docker.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://registry-1.docker.io"
                    [host."https://{{ .registryMirror }}/v2/docker.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/quay.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://quay.io"
                    [host."https://{{ .registryMirror }}/v2/quay.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/ghcr.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://ghcr.io"
                    [host."https://{{ .registryMirror }}/v2/ghcr.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/registry.k8s.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://registry.k8s.io"
                    [host."https://{{ .registryMirror }}/v2/registry.k8s.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/ntp
              valueFrom:
                template: |
                  enabled: true
                  servers: {{ .ntpServers | toJson }}
            - op: add
              path: /spec/template/spec/users
              valueFrom:
                template: |
                  - name: dciab
                    sudo: "ALL=(ALL) NOPASSWD:ALL"
                    sshAuthorizedKeys: {{ .sshAuthorizedKeys | toJson }}
    - name: kubeVip
      description: kube-vip static pod holding the API VIP on control plane nodes.
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  path: /etc/kubernetes/manifests/kube-vip.yaml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    apiVersion: v1
                    kind: Pod
                    metadata:
                      name: kube-vip
                      namespace: kube-system
                    spec:
                      containers:
                        - name: kube-vip
                          image: ghcr.io/kube-vip/kube-vip:v1.3.1@sha256:1962f9daf226503f7e6b107f595cb28b7917fd2d0113957075e19a3e5a6c1e33
                          imagePullPolicy: IfNotPresent
                          args: [manager]
                          env:
                            - {name: vip_arp, value: "true"}
                            - {name: port, value: "6443"}
                            - {name: vip_cidr, value: "32"}
                            - {name: cp_enable, value: "true"}
                            - {name: cp_namespace, value: kube-system}
                            - {name: vip_leaderelection, value: "true"}
                            - {name: vip_leasename, value: plndr-cp-lock}
                            - {name: vip_leaseduration, value: "15"}
                            - {name: vip_renewdeadline, value: "10"}
                            - {name: vip_retryperiod, value: "2"}
                            - {name: address, value: "{{ .apiVIP }}"}
                            {{- if .vipInterface }}
                            - {name: vip_interface, value: "{{ .vipInterface }}"}
                            {{- end }}
                          securityContext:
                            capabilities:
                              add: [NET_ADMIN, NET_RAW]
                          volumeMounts:
                            - {mountPath: /etc/kubernetes/admin.conf, name: kubeconfig, readOnly: true}
                      hostAliases:
                        - {hostnames: [kubernetes], ip: 127.0.0.1}
                      hostNetwork: true
                      volumes:
                        - name: kubeconfig
                          hostPath:
                            path: /etc/kubernetes/admin.conf
                            type: FileOrCreate

    - name: oidc
      description: API server OIDC flags, when the oidc variable is set.
      enabledIf: '{{ if .oidc }}true{{ end }}'
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs/-
              valueFrom:
                template: |
                  name: oidc-issuer-url
                  value: {{ .oidc.issuerURL | quote }}
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs/-
              valueFrom:
                template: |
                  name: oidc-client-id
                  value: {{ .oidc.clientID | quote }}
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs/-
              valueFrom:
                template: |
                  name: oidc-username-claim
                  value: {{ .oidc.usernameClaim | quote }}
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs/-
              valueFrom:
                template: |
                  name: oidc-groups-claim
                  value: {{ .oidc.groupsClaim | quote }}
    - name: vsphereCluster
      description: vCenter connection, credentials Secret and control plane endpoint.
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: VSphereClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/server
              valueFrom: {variable: vsphere.server}
            - op: add
              path: /spec/template/spec/thumbprint
              valueFrom: {variable: vsphere.thumbprint}
            - op: add
              path: /spec/template/spec/controlPlaneEndpoint
              valueFrom:
                template: |
                  host: {{ .apiVIP | quote }}
                  port: 6443
            - op: add
              path: /spec/template/spec/identityRef
              valueFrom:
                template: |
                  kind: Secret
                  name: {{ .builtin.cluster.name }}-vsphere-credentials
    - name: vsphereMachines
      description: Placement, template, size and node addressing for every machine.
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: VSphereMachineTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/server
              valueFrom: {variable: vsphere.server}
            - op: add
              path: /spec/template/spec/thumbprint
              valueFrom: {variable: vsphere.thumbprint}
            - op: add
              path: /spec/template/spec/datacenter
              valueFrom: {variable: vsphere.datacenter}
            - op: add
              path: /spec/template/spec/datastore
              valueFrom: {variable: vsphere.datastore}
            - op: add
              path: /spec/template/spec/folder
              valueFrom: {variable: vsphere.folder}
            - op: add
              path: /spec/template/spec/resourcePool
              valueFrom: {variable: vsphere.resourcePool}
            - op: add
              path: /spec/template/spec/template
              valueFrom: {variable: vsphere.template}
            - op: add
              path: /spec/template/spec/numCPUs
              valueFrom: {variable: machine.cpu}
            - op: add
              path: /spec/template/spec/memoryMiB
              valueFrom:
                template: '{{ mul .machine.memoryGiB 1024 }}'
            - op: add
              path: /spec/template/spec/diskGiB
              valueFrom: {variable: machine.diskGiB}
            - op: add
              path: /spec/template/spec/network
              valueFrom:
                template: |
                  devices:
                    - networkName: {{ .vsphere.network | quote }}
                      addressesFromPools:
                        - apiGroup: ipam.cluster.x-k8s.io
                          kind: InClusterIPPool
                          name: {{ .builtin.cluster.name }}-nodes
                      nameservers: {{ .dnsServers | toJson }}
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: VSphereMachineTemplate
            matchResources:
              machineDeploymentClass:
                names: [default]
          jsonPatches:
            - op: add
              path: /spec/template/spec/server
              valueFrom: {variable: vsphere.server}
            - op: add
              path: /spec/template/spec/thumbprint
              valueFrom: {variable: vsphere.thumbprint}
            - op: add
              path: /spec/template/spec/datacenter
              valueFrom: {variable: vsphere.datacenter}
            - op: add
              path: /spec/template/spec/datastore
              valueFrom: {variable: vsphere.datastore}
            - op: add
              path: /spec/template/spec/folder
              valueFrom: {variable: vsphere.folder}
            - op: add
              path: /spec/template/spec/resourcePool
              valueFrom: {variable: vsphere.resourcePool}
            - op: add
              path: /spec/template/spec/template
              valueFrom: {variable: vsphere.template}
            - op: add
              path: /spec/template/spec/numCPUs
              valueFrom: {variable: machine.cpu}
            - op: add
              path: /spec/template/spec/memoryMiB
              valueFrom:
                template: '{{ mul .machine.memoryGiB 1024 }}'
            - op: add
              path: /spec/template/spec/diskGiB
              valueFrom: {variable: machine.diskGiB}
            - op: add
              path: /spec/template/spec/network
              valueFrom:
                template: |
                  devices:
                    - networkName: {{ .vsphere.network | quote }}
                      addressesFromPools:
                        - apiGroup: ipam.cluster.x-k8s.io
                          kind: InClusterIPPool
                          name: {{ .builtin.cluster.name }}-nodes
                      nameservers: {{ .dnsServers | toJson }}

---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: VSphereClusterTemplate
metadata:
  name: dciab-vsphere-v1
spec:
  template:
    spec:
      server: set-by-patch.invalid
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: VSphereMachineTemplate
metadata:
  name: dciab-vsphere-v1-controlplane
spec:
  template:
    spec:
      server: set-by-patch.invalid
      template: set-by-patch
      cloneMode: fullClone
      numCPUs: 2
      memoryMiB: 4096
      diskGiB: 40
      os: Linux
      powerOffMode: trySoft
      network:
        devices:
          - networkName: set-by-patch
            # Placeholder: replaced with the cluster's <cluster>-nodes pool by the vsphereMachines patch.
            addressesFromPools:
              - apiGroup: ipam.cluster.x-k8s.io
                kind: InClusterIPPool
                name: set-by-patch
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: VSphereMachineTemplate
metadata:
  name: dciab-vsphere-v1-worker
spec:
  template:
    spec:
      server: set-by-patch.invalid
      template: set-by-patch
      cloneMode: fullClone
      numCPUs: 2
      memoryMiB: 4096
      diskGiB: 40
      os: Linux
      powerOffMode: trySoft
      network:
        devices:
          - networkName: set-by-patch
            # Placeholder: replaced with the cluster's <cluster>-nodes pool by the vsphereMachines patch.
            addressesFromPools:
              - apiGroup: ipam.cluster.x-k8s.io
                kind: InClusterIPPool
                name: set-by-patch
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlaneTemplate
metadata:
  name: dciab-vsphere-v1-controlplane
spec:
  template:
    spec:
      kubeadmConfigSpec:
        clusterConfiguration:
          apiServer:
            extraArgs:
              - {name: profiling, value: "false"}
          controllerManager:
            extraArgs:
              - {name: profiling, value: "false"}
          scheduler:
            extraArgs:
              - {name: profiling, value: "false"}
        initConfiguration:
          nodeRegistration:
            name: '{{ local_hostname }}'
            kubeletExtraArgs:
                            - {name: cloud-provider, value: "external"}
        joinConfiguration:
          nodeRegistration:
            name: '{{ local_hostname }}'
            kubeletExtraArgs:
                            - {name: cloud-provider, value: "external"}
        preKubeadmCommands:
          - update-ca-trust extract
          # kube-vip needs super-admin.conf while kubeadm init runs (Kubernetes 1.29+).
          - "[ -f /run/kubeadm/kubeadm.yaml ] && sed -i 's#path: /etc/kubernetes/admin.conf#path: /etc/kubernetes/super-admin.conf#' /etc/kubernetes/manifests/kube-vip.yaml || true"
        postKubeadmCommands:
          - "[ -f /run/kubeadm/kubeadm.yaml ] && sed -i 's#path: /etc/kubernetes/super-admin.conf#path: /etc/kubernetes/admin.conf#' /etc/kubernetes/manifests/kube-vip.yaml || true"
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: dciab-vsphere-v1-worker
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          name: '{{ local_hostname }}'
          kubeletExtraArgs:
            - {name: cloud-provider, value: "external"}
      preKubeadmCommands:
        - update-ca-trust extract
