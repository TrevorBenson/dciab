# ClusterClass dciab-metal3-v1: FROZEN.
# Clusters reference this class by name, and editing it rolls every one of them.
# To change anything here, copy classes/v1 to classes/v2, edit the copy, and move
# clusters over one at a time. Do not edit this file.
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: dciab-metal3-v1
  annotations:
    dciab.io/description: "Bare-metal (Metal3) hosts for control plane and workers"
spec:
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KubeadmControlPlaneTemplate
      name: dciab-metal3-v1-controlplane
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: Metal3MachineTemplate
        name: dciab-metal3-v1-controlplane
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
      kind: Metal3ClusterTemplate
      name: dciab-metal3-v1
  workers:
    machineDeployments:
      - class: default
        bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            name: dciab-metal3-v1-worker
        infrastructure:
          templateRef:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: Metal3MachineTemplate
            name: dciab-metal3-v1-worker
  variables:
    - name: apiVIP
      required: true
      schema:
        openAPIV3Schema:
          type: string
          description: Control plane endpoint address, held by kube-vip on the control plane nodes.
    - name: registryMirror
      required: true
      schema:
        openAPIV3Schema:
          type: string
          minLength: 1
          description: >-
            Host (and optional port) of the registry mirror. Nodes pull docker.io, quay.io,
            ghcr.io and registry.k8s.io through https://<registryMirror>/v2/<upstream>/.
    - name: trustBundle
      required: true
      schema:
        openAPIV3Schema:
          type: string
          minLength: 1
          description: PEM CA bundle added to the node trust store (the platform CA).
    - name: ntpServers
      required: true
      schema:
        openAPIV3Schema:
          type: array
          minItems: 1
          items:
            type: string
    - name: sshAuthorizedKeys
      required: true
      schema:
        openAPIV3Schema:
          type: array
          minItems: 1
          items:
            type: string
          description: Public keys for the break-glass user 'dciab' on every node.
    - name: oidc
      required: false
      schema:
        openAPIV3Schema:
          type: object
          required: [issuerURL, clientID]
          properties:
            issuerURL:
              type: string
            clientID:
              type: string
            usernameClaim:
              type: string
              default: preferred_username
            groupsClaim:
              type: string
              default: groups
          description: API server OIDC settings (Authentik). Leave unset to disable.
    - name: image
      required: true
      schema:
        openAPIV3Schema:
          type: object
          required: [url, checksum, checksumType, diskFormat]
          properties:
            url:
              type: string
              description: HTTP(S) URL Ironic downloads the node image from.
            checksum:
              type: string
              description: Checksum value, or a URL to a checksum file.
            checksumType:
              type: string
              enum: [sha256, sha512]
            diskFormat:
              type: string
              enum: [raw, qcow2]
    - name: hostSelector
      required: true
      schema:
        openAPIV3Schema:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
          description: BareMetalHost labels the machines may claim. Override per pool.

  patches:
    - name: nodeBase
      description: Trust bundle, registry mirrors, NTP and the break-glass user on every node.
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files
              valueFrom:
                template: |
                  - path: /etc/pki/ca-trust/source/anchors/dciab-platform-ca.crt
                    owner: root:root
                    permissions: "0644"
                    content: |
                    {{- .trustBundle | nindent 6 }}
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/docker.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://registry-1.docker.io"
                    [host."https://{{ .registryMirror }}/v2/docker.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/quay.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://quay.io"
                    [host."https://{{ .registryMirror }}/v2/quay.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/ghcr.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://ghcr.io"
                    [host."https://{{ .registryMirror }}/v2/ghcr.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/registry.k8s.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://registry.k8s.io"
                    [host."https://{{ .registryMirror }}/v2/registry.k8s.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/ntp
              valueFrom:
                template: |
                  enabled: true
                  servers: {{ .ntpServers | toJson }}
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/users
              valueFrom:
                template: |
                  - name: dciab
                    sudo: "ALL=(ALL) NOPASSWD:ALL"
                    sshAuthorizedKeys: {{ .sshAuthorizedKeys | toJson }}
        - selector:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            matchResources:
              machineDeploymentClass:
                names: [default]
          jsonPatches:
            - op: add
              path: /spec/template/spec/files
              valueFrom:
                template: |
                  - path: /etc/pki/ca-trust/source/anchors/dciab-platform-ca.crt
                    owner: root:root
                    permissions: "0644"
                    content: |
                    {{- .trustBundle | nindent 6 }}
            - op: add
              path: /spec/template/spec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/docker.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://registry-1.docker.io"
                    [host."https://{{ .registryMirror }}/v2/docker.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/quay.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://quay.io"
                    [host."https://{{ .registryMirror }}/v2/quay.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/ghcr.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://ghcr.io"
                    [host."https://{{ .registryMirror }}/v2/ghcr.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/registry.k8s.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://registry.k8s.io"
                    [host."https://{{ .registryMirror }}/v2/registry.k8s.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/ntp
              valueFrom:
                template: |
                  enabled: true
                  servers: {{ .ntpServers | toJson }}
            - op: add
              path: /spec/template/spec/users
              valueFrom:
                template: |
                  - name: dciab
                    sudo: "ALL=(ALL) NOPASSWD:ALL"
                    sshAuthorizedKeys: {{ .sshAuthorizedKeys | toJson }}
    - name: kubeVip
      description: kube-vip static pod holding the API VIP on control plane nodes.
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  path: /etc/kubernetes/manifests/kube-vip.yaml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    apiVersion: v1
                    kind: Pod
                    metadata:
                      name: kube-vip
                      namespace: kube-system
                    spec:
                      containers:
                        - name: kube-vip
                          image: ghcr.io/kube-vip/kube-vip:v1.3.1
                          imagePullPolicy: IfNotPresent
                          args: [manager]
                          env:
                            - {name: vip_arp, value: "true"}
                            - {name: port, value: "6443"}
                            - {name: vip_cidr, value: "32"}
                            - {name: cp_enable, value: "true"}
                            - {name: cp_namespace, value: kube-system}
                            - {name: vip_leaderelection, value: "true"}
                            - {name: vip_leasename, value: plndr-cp-lock}
                            - {name: vip_leaseduration, value: "15"}
                            - {name: vip_renewdeadline, value: "10"}
                            - {name: vip_retryperiod, value: "2"}
                            - {name: address, value: "{{ .apiVIP }}"}
                          securityContext:
                            capabilities:
                              add: [NET_ADMIN, NET_RAW]
                          volumeMounts:
                            - {mountPath: /etc/kubernetes/admin.conf, name: kubeconfig}
                      hostAliases:
                        - {hostnames: [kubernetes], ip: 127.0.0.1}
                      hostNetwork: true
                      volumes:
                        - name: kubeconfig
                          hostPath:
                            path: /etc/kubernetes/admin.conf
                            type: FileOrCreate

    - name: oidc
      description: API server OIDC flags, when the oidc variable is set.
      enabledIf: '{{ if .oidc }}true{{ end }}'
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs/-
              valueFrom:
                template: |
                  name: oidc-issuer-url
                  value: {{ .oidc.issuerURL | quote }}
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs/-
              valueFrom:
                template: |
                  name: oidc-client-id
                  value: {{ .oidc.clientID | quote }}
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs/-
              valueFrom:
                template: |
                  name: oidc-username-claim
                  value: {{ .oidc.usernameClaim | quote }}
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs/-
              valueFrom:
                template: |
                  name: oidc-groups-claim
                  value: {{ .oidc.groupsClaim | quote }}
    - name: metal3Cluster
      description: Control plane endpoint.
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: Metal3ClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/controlPlaneEndpoint
              valueFrom:
                template: |
                  host: {{ .apiVIP | quote }}
                  port: 6443
    - name: metal3Machines
      description: Image, host selection and data template (addresses) for every machine.
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: Metal3MachineTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: replace
              path: /spec/template/spec/image
              valueFrom: {variable: image}
            - op: add
              path: /spec/template/spec/hostSelector
              valueFrom:
                template: |
                  matchLabels: {{ .hostSelector | toJson }}
            - op: add
              path: /spec/template/spec/dataTemplate
              valueFrom:
                template: |
                  name: {{ .builtin.cluster.name }}-controlplane
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: Metal3MachineTemplate
            matchResources:
              machineDeploymentClass:
                names: [default]
          jsonPatches:
            - op: replace
              path: /spec/template/spec/image
              valueFrom: {variable: image}
            - op: add
              path: /spec/template/spec/hostSelector
              valueFrom:
                template: |
                  matchLabels: {{ .hostSelector | toJson }}
            - op: add
              path: /spec/template/spec/dataTemplate
              valueFrom:
                template: |
                  name: {{ .builtin.cluster.name }}-{{ .builtin.machineDeployment.topologyName }}

---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: Metal3ClusterTemplate
metadata:
  name: dciab-metal3-v1
spec:
  template:
    spec:
      cloudProviderEnabled: false
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: Metal3MachineTemplate
metadata:
  name: dciab-metal3-v1-controlplane
spec:
  template:
    spec:
      automatedCleaningMode: metadata
      image:
        url: set-by-patch
        checksum: set-by-patch
        checksumType: sha256
        diskFormat: raw
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: Metal3MachineTemplate
metadata:
  name: dciab-metal3-v1-worker
spec:
  template:
    spec:
      automatedCleaningMode: metadata
      image:
        url: set-by-patch
        checksum: set-by-patch
        checksumType: sha256
        diskFormat: raw
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlaneTemplate
metadata:
  name: dciab-metal3-v1-controlplane
spec:
  template:
    spec:
      kubeadmConfigSpec:
        clusterConfiguration:
          apiServer:
            extraArgs:
              - {name: profiling, value: "false"}
          controllerManager:
            extraArgs:
              - {name: profiling, value: "false"}
          scheduler:
            extraArgs:
              - {name: profiling, value: "false"}
        initConfiguration:
          nodeRegistration:
            name: '{{ ds.meta_data.name }}'
            kubeletExtraArgs:
                            - {name: provider-id, value: "metal3://{{ ds.meta_data.providerid }}"}
        joinConfiguration:
          nodeRegistration:
            name: '{{ ds.meta_data.name }}'
            kubeletExtraArgs:
                            - {name: provider-id, value: "metal3://{{ ds.meta_data.providerid }}"}
        preKubeadmCommands:
          - update-ca-trust extract
          # kube-vip needs super-admin.conf while kubeadm init runs (Kubernetes 1.29+).
          - "[ -f /run/kubeadm/kubeadm.yaml ] && sed -i 's#path: /etc/kubernetes/admin.conf#path: /etc/kubernetes/super-admin.conf#' /etc/kubernetes/manifests/kube-vip.yaml || true"
        postKubeadmCommands:
          - "[ -f /run/kubeadm/kubeadm.yaml ] && sed -i 's#path: /etc/kubernetes/super-admin.conf#path: /etc/kubernetes/admin.conf#' /etc/kubernetes/manifests/kube-vip.yaml || true"
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: dciab-metal3-v1-worker
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          name: '{{ ds.meta_data.name }}'
          kubeletExtraArgs:
            - {name: provider-id, value: "metal3://{{ ds.meta_data.providerid }}"}
      preKubeadmCommands:
        - update-ca-trust extract
