# ClusterClass dciab-proxmox-r1. The -rN suffix is a DCiaB revision, not a Kubernetes API version.
# A draft until a DCiaB release tag contains it; frozen from then on, because editing a
# class rolls every cluster that uses it. After a release, changes go into the next
# revision. See docs/VERSIONING.md.
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: dciab-proxmox-r1
  annotations:
    helm.sh/resource-policy: keep
    dciab.io/description: "Proxmox VE (CAPMOX) machines for control plane and workers"
spec:
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KubeadmControlPlaneTemplate
      name: dciab-proxmox-r1-controlplane
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
        kind: ProxmoxMachineTemplate
        name: dciab-proxmox-r1-controlplane
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
      kind: ProxmoxClusterTemplate
      name: dciab-proxmox-r1
  workers:
    machineDeployments:
      - class: default
        bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            name: dciab-proxmox-r1-worker
        infrastructure:
          templateRef:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
            kind: ProxmoxMachineTemplate
            name: dciab-proxmox-r1-worker
  variables:
    - name: apiVIP
      required: true
      schema:
        openAPIV3Schema:
          type: string
          description: Control plane endpoint address, held by kube-vip on the control plane nodes.
    - name: vipInterface
      required: false
      schema:
        openAPIV3Schema:
          type: string
          minLength: 1
          description: >-
            Interface kube-vip announces the API VIP on. Leave unset to use the interface
            that holds the default route.
    - name: registryMirror
      required: true
      schema:
        openAPIV3Schema:
          type: string
          minLength: 1
          description: >-
            Host (and optional port) of the registry mirror. Nodes pull docker.io, quay.io,
            ghcr.io and registry.k8s.io through https://<registryMirror>/v2/<upstream>/.
    - name: trustBundle
      required: true
      schema:
        openAPIV3Schema:
          type: string
          minLength: 1
          description: PEM CA bundle added to the node trust store (the platform CA).
    - name: ntpServers
      required: true
      schema:
        openAPIV3Schema:
          type: array
          minItems: 1
          items:
            type: string
    - name: sshAuthorizedKeys
      required: true
      schema:
        openAPIV3Schema:
          type: array
          minItems: 1
          items:
            type: string
          description: Public keys for the break-glass user 'dciab' on every node.
    - name: oidc
      required: false
      schema:
        openAPIV3Schema:
          type: object
          required: [issuerURL, clientID]
          properties:
            issuerURL:
              type: string
            clientID:
              type: string
            usernameClaim:
              type: string
              default: preferred_username
            groupsClaim:
              type: string
              default: groups
          description: API server OIDC settings (Authentik). Leave unset to disable.
    - name: machine
      required: true
      schema:
        openAPIV3Schema:
          type: object
          required: [cpu, memoryGiB, diskGiB]
          properties:
            cpu:
              type: integer
              minimum: 2
            memoryGiB:
              type: integer
              minimum: 4
            diskGiB:
              type: integer
              minimum: 25
          description: Machine size. Set at cluster level and override per control plane or worker pool.
    - name: dnsServers
      required: true
      schema:
        openAPIV3Schema:
          type: array
          minItems: 1
          items:
            type: string
          description: DNS resolvers for the nodes (the PowerDNS recursor service IPs).
    - name: proxmox
      required: true
      schema:
        openAPIV3Schema:
          type: object
          required: [allowedNodes, templateNode, templateID, storage, bridge]
          properties:
            allowedNodes:
              type: array
              minItems: 1
              items: {type: string}
            templateNode:
              type: string
              minLength: 1
              description: The node holding the VM template.
            templateID:
              type: integer
            storage:
              type: string
            bridge:
              type: string
            vlanTag:
              type: integer
              minimum: 1
              maximum: 4094
    - name: nodeNetwork
      required: true
      schema:
        openAPIV3Schema:
          type: object
          required: [addresses, prefix, gateway]
          properties:
            addresses:
              type: array
              minItems: 1
              items: {type: string}
              description: Node address ranges, such as 10.30.110.20-10.30.110.29.
            prefix:
              type: integer
              minimum: 1
              maximum: 32
            gateway:
              type: string

  patches:
    - name: nodeBase
      description: Trust bundle, registry mirrors, NTP and the break-glass user on every node.
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files
              valueFrom:
                template: |
                  - path: /etc/pki/ca-trust/source/anchors/dciab-platform-ca.crt
                    owner: root:root
                    permissions: "0644"
                    content: |
                    {{- .trustBundle | nindent 6 }}
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/docker.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://registry-1.docker.io"
                    [host."https://{{ .registryMirror }}/v2/docker.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/quay.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://quay.io"
                    [host."https://{{ .registryMirror }}/v2/quay.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/ghcr.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://ghcr.io"
                    [host."https://{{ .registryMirror }}/v2/ghcr.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/registry.k8s.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://registry.k8s.io"
                    [host."https://{{ .registryMirror }}/v2/registry.k8s.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  path: /etc/containers/registries.conf.d/50-dciab-mirror.conf
                  owner: root:root
                  permissions: "0644"
                  content: |
                    [[registry]]
                    prefix = "docker.io"
                    location = "docker.io"
                    [[registry.mirror]]
                    location = "{{ .registryMirror }}/docker.io"

                    [[registry]]
                    prefix = "quay.io"
                    location = "quay.io"
                    [[registry.mirror]]
                    location = "{{ .registryMirror }}/quay.io"

                    [[registry]]
                    prefix = "ghcr.io"
                    location = "ghcr.io"
                    [[registry.mirror]]
                    location = "{{ .registryMirror }}/ghcr.io"

                    [[registry]]
                    prefix = "registry.k8s.io"
                    location = "registry.k8s.io"
                    [[registry.mirror]]
                    location = "{{ .registryMirror }}/registry.k8s.io"

            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/ntp
              valueFrom:
                template: |
                  enabled: true
                  servers: {{ .ntpServers | toJson }}
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/users
              valueFrom:
                template: |
                  - name: dciab
                    sudo: "ALL=(ALL) NOPASSWD:ALL"
                    sshAuthorizedKeys: {{ .sshAuthorizedKeys | toJson }}
        - selector:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            matchResources:
              machineDeploymentClass:
                names: [default]
          jsonPatches:
            - op: add
              path: /spec/template/spec/files
              valueFrom:
                template: |
                  - path: /etc/pki/ca-trust/source/anchors/dciab-platform-ca.crt
                    owner: root:root
                    permissions: "0644"
                    content: |
                    {{- .trustBundle | nindent 6 }}
            - op: add
              path: /spec/template/spec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/docker.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://registry-1.docker.io"
                    [host."https://{{ .registryMirror }}/v2/docker.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/quay.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://quay.io"
                    [host."https://{{ .registryMirror }}/v2/quay.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/ghcr.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://ghcr.io"
                    [host."https://{{ .registryMirror }}/v2/ghcr.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/files/-
              valueFrom:
                template: |
                  path: /etc/containerd/certs.d/registry.k8s.io/hosts.toml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    server = "https://registry.k8s.io"
                    [host."https://{{ .registryMirror }}/v2/registry.k8s.io"]
                      capabilities = ["pull", "resolve"]
                      override_path = true
            - op: add
              path: /spec/template/spec/files/-
              valueFrom:
                template: |
                  path: /etc/containers/registries.conf.d/50-dciab-mirror.conf
                  owner: root:root
                  permissions: "0644"
                  content: |
                    [[registry]]
                    prefix = "docker.io"
                    location = "docker.io"
                    [[registry.mirror]]
                    location = "{{ .registryMirror }}/docker.io"

                    [[registry]]
                    prefix = "quay.io"
                    location = "quay.io"
                    [[registry.mirror]]
                    location = "{{ .registryMirror }}/quay.io"

                    [[registry]]
                    prefix = "ghcr.io"
                    location = "ghcr.io"
                    [[registry.mirror]]
                    location = "{{ .registryMirror }}/ghcr.io"

                    [[registry]]
                    prefix = "registry.k8s.io"
                    location = "registry.k8s.io"
                    [[registry.mirror]]
                    location = "{{ .registryMirror }}/registry.k8s.io"

            - op: add
              path: /spec/template/spec/ntp
              valueFrom:
                template: |
                  enabled: true
                  servers: {{ .ntpServers | toJson }}
            - op: add
              path: /spec/template/spec/users
              valueFrom:
                template: |
                  - name: dciab
                    sudo: "ALL=(ALL) NOPASSWD:ALL"
                    sshAuthorizedKeys: {{ .sshAuthorizedKeys | toJson }}
    - name: kubeVip
      description: kube-vip static pod holding the API VIP on control plane nodes.
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  path: /etc/kubernetes/manifests/kube-vip.yaml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    apiVersion: v1
                    kind: Pod
                    metadata:
                      name: kube-vip
                      namespace: kube-system
                    spec:
                      containers:
                        - name: kube-vip
                          image: ghcr.io/kube-vip/kube-vip:v1.3.1@sha256:1962f9daf226503f7e6b107f595cb28b7917fd2d0113957075e19a3e5a6c1e33
                          imagePullPolicy: IfNotPresent
                          args: [manager]
                          env:
                            - {name: vip_arp, value: "true"}
                            - {name: port, value: "6443"}
                            - {name: vip_cidr, value: "32"}
                            - {name: cp_enable, value: "true"}
                            - {name: cp_namespace, value: kube-system}
                            - {name: vip_leaderelection, value: "true"}
                            - {name: vip_leasename, value: plndr-cp-lock}
                            - {name: vip_leaseduration, value: "15"}
                            - {name: vip_renewdeadline, value: "10"}
                            - {name: vip_retryperiod, value: "2"}
                            - {name: address, value: "{{ .apiVIP }}"}
                            {{- if .vipInterface }}
                            - {name: vip_interface, value: "{{ .vipInterface }}"}
                            {{- end }}
                          securityContext:
                            capabilities:
                              add: [NET_ADMIN, NET_RAW]
                          volumeMounts:
                            - {mountPath: /etc/kubernetes/admin.conf, name: kubeconfig, readOnly: true}
                      hostAliases:
                        - {hostnames: [kubernetes], ip: 127.0.0.1}
                      hostNetwork: true
                      volumes:
                        - name: kubeconfig
                          hostPath:
                            path: /etc/kubernetes/admin.conf
                            type: FileOrCreate

    - name: oidc
      description: API server OIDC flags, when the oidc variable is set.
      enabledIf: '{{ if .oidc }}true{{ end }}'
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs/-
              valueFrom:
                template: |
                  name: oidc-issuer-url
                  value: {{ .oidc.issuerURL | quote }}
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs/-
              valueFrom:
                template: |
                  name: oidc-client-id
                  value: {{ .oidc.clientID | quote }}
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs/-
              valueFrom:
                template: |
                  name: oidc-username-claim
                  value: {{ .oidc.usernameClaim | quote }}
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs/-
              valueFrom:
                template: |
                  name: oidc-groups-claim
                  value: {{ .oidc.groupsClaim | quote }}
    - name: proxmoxCluster
      description: Allowed nodes, node addressing, DNS, credentials Secret and control plane endpoint.
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
            kind: ProxmoxClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/allowedNodes
              valueFrom: {variable: proxmox.allowedNodes}
            - op: replace
              path: /spec/template/spec/dnsServers
              valueFrom: {variable: dnsServers}
            - op: add
              path: /spec/template/spec/ipv4Config
              valueFrom:
                template: |
                  addresses: {{ .nodeNetwork.addresses | toJson }}
                  prefix: {{ .nodeNetwork.prefix }}
                  gateway: {{ .nodeNetwork.gateway | quote }}
            - op: add
              path: /spec/template/spec/controlPlaneEndpoint
              valueFrom:
                template: |
                  host: {{ .apiVIP | quote }}
                  port: 6443
            - op: add
              path: /spec/template/spec/credentialsRef
              valueFrom:
                template: |
                  name: {{ .builtin.cluster.name }}-proxmox-credentials
    - name: proxmoxMachines
      description: Template, storage, size and network device for every machine.
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
            kind: ProxmoxMachineTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/sourceNode
              valueFrom: {variable: proxmox.templateNode}
            - op: add
              path: /spec/template/spec/templateID
              valueFrom: {variable: proxmox.templateID}
            - op: add
              path: /spec/template/spec/storage
              valueFrom: {variable: proxmox.storage}
            - op: add
              path: /spec/template/spec/numCores
              valueFrom: {variable: machine.cpu}
            - op: add
              path: /spec/template/spec/memoryMiB
              valueFrom:
                template: '{{ mul .machine.memoryGiB 1024 }}'
            - op: add
              path: /spec/template/spec/disks
              valueFrom:
                template: |
                  bootVolume:
                    disk: scsi0
                    sizeGb: {{ .machine.diskGiB }}
            - op: replace
              path: /spec/template/spec/network
              valueFrom:
                template: |
                  networkDevices:
                    - name: net0
                      bridge: {{ .proxmox.bridge | quote }}
                      model: virtio
                      defaultIPv4: true
                      {{- if .proxmox.vlanTag }}
                      vlan: {{ .proxmox.vlanTag }}
                      {{- end }}
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
            kind: ProxmoxMachineTemplate
            matchResources:
              machineDeploymentClass:
                names: [default]
          jsonPatches:
            - op: add
              path: /spec/template/spec/sourceNode
              valueFrom: {variable: proxmox.templateNode}
            - op: add
              path: /spec/template/spec/templateID
              valueFrom: {variable: proxmox.templateID}
            - op: add
              path: /spec/template/spec/storage
              valueFrom: {variable: proxmox.storage}
            - op: add
              path: /spec/template/spec/numCores
              valueFrom: {variable: machine.cpu}
            - op: add
              path: /spec/template/spec/memoryMiB
              valueFrom:
                template: '{{ mul .machine.memoryGiB 1024 }}'
            - op: add
              path: /spec/template/spec/disks
              valueFrom:
                template: |
                  bootVolume:
                    disk: scsi0
                    sizeGb: {{ .machine.diskGiB }}
            - op: replace
              path: /spec/template/spec/network
              valueFrom:
                template: |
                  networkDevices:
                    - name: net0
                      bridge: {{ .proxmox.bridge | quote }}
                      model: virtio
                      defaultIPv4: true
                      {{- if .proxmox.vlanTag }}
                      vlan: {{ .proxmox.vlanTag }}
                      {{- end }}
    - name: apiServerAudit
      description: >-
        Kubernetes API audit policy file on control plane nodes. The API server flags and
        mounts that use it are in the KubeadmControlPlaneTemplate. This patch comes after
        nodeBase, which creates the files list.
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              value:
                path: /etc/kubernetes/audit/policy.yaml
                owner: root:root
                permissions: "0600"
                content: |
                  apiVersion: audit.k8s.io/v1
                  kind: Policy
                  # One event per request, when the response is ready.
                  omitStages: [RequestReceived]
                  rules:
                    # First match wins. Noise first.
                    - level: None
                      nonResourceURLs: [/healthz*, /livez*, /readyz*, /version, /metrics]
                    - level: None
                      resources:
                        - {group: "", resources: [events]}
                        - {group: events.k8s.io, resources: [events]}
                    # Leader election and node heartbeats.
                    - level: None
                      users: [system:kube-controller-manager, system:kube-scheduler, system:apiserver]
                      resources: [{group: coordination.k8s.io, resources: [leases]}]
                    - level: None
                      userGroups: [system:nodes, system:serviceaccounts:kube-system]
                      resources: [{group: coordination.k8s.io, resources: [leases]}]
                    - level: None
                      namespaces: [kube-system]
                      resources:
                        - {group: coordination.k8s.io, resources: [leases], resourceNames: [plndr-cp-lock, plndr-svcs-lock]}
                    # Never log bodies that hold secrets or tokens.
                    - level: Metadata
                      resources:
                        - {group: "", resources: [secrets, configmaps, serviceaccounts/token]}
                        - {group: authentication.k8s.io, resources: [tokenreviews]}
                    # Read-only traffic from system components.
                    - level: None
                      users: [system:kube-controller-manager, system:kube-scheduler, system:kube-proxy, system:apiserver]
                      verbs: [get, list, watch]
                    - level: None
                      userGroups: [system:nodes]
                      verbs: [get, list, watch]
                    # Who changed RBAC, and to what.
                    - level: RequestResponse
                      verbs: [create, update, patch, delete, deletecollection]
                      resources: [{group: rbac.authorization.k8s.io}]
                    - level: Metadata

---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxClusterTemplate
metadata:
  name: dciab-proxmox-r1
  annotations:
    helm.sh/resource-policy: keep
spec:
  template:
    spec:
      dnsServers: [set-by-patch]
      # Placeholders (TEST-NET-1): CAPMOX's webhook rejects a template without an
      # endpoint and an IP pool. The proxmoxCluster patch replaces both.
      controlPlaneEndpoint:
        host: 192.0.2.5
        port: 6443
      ipv4Config:
        addresses: [192.0.2.10-192.0.2.20]
        prefix: 24
        gateway: 192.0.2.1
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxMachineTemplate
metadata:
  name: dciab-proxmox-r1-controlplane
  annotations:
    helm.sh/resource-policy: keep
spec:
  template:
    spec:
      # Placeholders: CAPMOX's CRD requires a clone source on the template itself.
      sourceNode: set-by-patch
      templateID: 100
      full: true
      format: qcow2
      numSockets: 1
      metadataSettings:
        providerIDInjection: true
      network:
        networkDevices:
          - name: net0
            bridge: set-by-patch
            model: virtio
            defaultIPv4: true
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxMachineTemplate
metadata:
  name: dciab-proxmox-r1-worker
  annotations:
    helm.sh/resource-policy: keep
spec:
  template:
    spec:
      # Placeholders: CAPMOX's CRD requires a clone source on the template itself.
      sourceNode: set-by-patch
      templateID: 100
      full: true
      format: qcow2
      numSockets: 1
      metadataSettings:
        providerIDInjection: true
      network:
        networkDevices:
          - name: net0
            bridge: set-by-patch
            model: virtio
            defaultIPv4: true
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlaneTemplate
metadata:
  name: dciab-proxmox-r1-controlplane
  annotations:
    helm.sh/resource-policy: keep
spec:
  template:
    spec:
      kubeadmConfigSpec:
        clusterConfiguration:
          apiServer:
            extraArgs:
              - {name: profiling, value: "false"}
              # Audit policy file: written by the apiServerAudit patch.
              - {name: audit-policy-file, value: /etc/kubernetes/audit/policy.yaml}
              - {name: audit-log-path, value: /var/log/kubernetes/audit/audit.log}
              - {name: audit-log-maxage, value: "30"}
              - {name: audit-log-maxbackup, value: "10"}
              - {name: audit-log-maxsize, value: "100"}
            extraVolumes:
              - name: audit-policy
                hostPath: /etc/kubernetes/audit/policy.yaml
                mountPath: /etc/kubernetes/audit/policy.yaml
                readOnly: true
                pathType: File
              - name: audit-logs
                hostPath: /var/log/kubernetes/audit
                mountPath: /var/log/kubernetes/audit
                readOnly: false
                pathType: DirectoryOrCreate
          controllerManager:
            extraArgs:
              - {name: profiling, value: "false"}
          scheduler:
            extraArgs:
              - {name: profiling, value: "false"}
        initConfiguration:
          # Cilium replaces kube-proxy (Gateway API needs it); see addons/cilium.
          skipPhases: [addon/kube-proxy]
          nodeRegistration:
            name: '{{ local_hostname }}'
            # The Node's spec.providerID, which Cluster API matches Machines to Nodes by.
            # CAPMOX puts the VM's instance ID in the NoCloud meta-data (providerIDInjection).
            kubeletExtraArgs:
              - {name: provider-id, value: "proxmox://{{ ds.meta_data.instance_id }}"}
        joinConfiguration:
          nodeRegistration:
            name: '{{ local_hostname }}'
            # The Node's spec.providerID, which Cluster API matches Machines to Nodes by.
            # CAPMOX puts the VM's instance ID in the NoCloud meta-data (providerIDInjection).
            kubeletExtraArgs:
              - {name: provider-id, value: "proxmox://{{ ds.meta_data.instance_id }}"}
        preKubeadmCommands:
          - update-ca-trust extract
          # kube-vip needs super-admin.conf while kubeadm init runs (Kubernetes 1.29+).
          - "[ -f /run/kubeadm/kubeadm.yaml ] && sed -i 's#path: /etc/kubernetes/admin.conf#path: /etc/kubernetes/super-admin.conf#' /etc/kubernetes/manifests/kube-vip.yaml || true"
        postKubeadmCommands:
          - "[ -f /run/kubeadm/kubeadm.yaml ] && sed -i 's#path: /etc/kubernetes/super-admin.conf#path: /etc/kubernetes/admin.conf#' /etc/kubernetes/manifests/kube-vip.yaml || true"
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: dciab-proxmox-r1-worker
  annotations:
    helm.sh/resource-policy: keep
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          name: '{{ local_hostname }}'
          kubeletExtraArgs:
            - {name: provider-id, value: "proxmox://{{ ds.meta_data.instance_id }}"}
      preKubeadmCommands:
        - update-ca-trust extract
