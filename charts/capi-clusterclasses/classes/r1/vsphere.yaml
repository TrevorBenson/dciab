# ClusterClass dciab-vsphere-r1. The -rN suffix is a DCiaB revision, not a Kubernetes API version.
# A draft until a DCiaB release tag contains it; frozen from then on, because editing a
# class rolls every cluster that uses it. After a release, changes go into the next
# revision. See docs/VERSIONING.md.
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: dciab-vsphere-r1
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    dciab.io/description: "vSphere (CAPV) machines for control plane and workers"
spec:
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KubeadmControlPlaneTemplate
      name: dciab-vsphere-r1-controlplane
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: VSphereMachineTemplate
        name: dciab-vsphere-r1-controlplane
    # Remediation: a Machine whose Node stays NotReady or unreachable for 5 minutes, or
    # that never gets a Node, is replaced. VMs clone, boot and join well within this.
    # Only one unhealthy machine at a time is replaced, in the control plane and in each
    # worker pool: two or more at once is an outage to look at, not a node to replace. An
    # absolute 1, not a percentage, so pools of one or two machines are repaired too.
    # KubeadmControlPlane never remediates in a way that loses etcd quorum; its retry
    # limits are in the KubeadmControlPlaneTemplate.
    healthCheck:
      checks:
        nodeStartupTimeoutSeconds: 1200
        unhealthyNodeConditions:
          - {type: Ready, status: Unknown, timeoutSeconds: 300}
          - {type: Ready, status: "False", timeoutSeconds: 300}
      remediation:
        triggerIf:
          unhealthyLessThanOrEqualTo: 1
    # Draining waits at most 30 minutes, and detaching volumes at most 10, so a stuck pod or
    # volume never blocks an upgrade or a remediation forever. Longhorn's drain policy
    # (block-for-eviction-if-contains-last-replica, addons/longhorn) moves a last replica
    # off the node within that time instead of only blocking.
    deletion:
      nodeDrainTimeoutSeconds: 1800
      nodeVolumeDetachTimeoutSeconds: 600
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
      kind: VSphereClusterTemplate
      name: dciab-vsphere-r1
  workers:
    machineDeployments:
      - class: default
        bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            name: dciab-vsphere-r1-worker
        infrastructure:
          templateRef:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: VSphereMachineTemplate
            name: dciab-vsphere-r1-worker
        healthCheck:
          checks:
            nodeStartupTimeoutSeconds: 1200
            unhealthyNodeConditions:
              - {type: Ready, status: Unknown, timeoutSeconds: 300}
              - {type: Ready, status: "False", timeoutSeconds: 300}
          remediation:
            triggerIf:
              unhealthyLessThanOrEqualTo: 1
        deletion:
          nodeDrainTimeoutSeconds: 1800
          nodeVolumeDetachTimeoutSeconds: 600
  variables:
    - name: apiVIP
      required: true
      schema:
        openAPIV3Schema:
          type: string
          description: Control plane endpoint address, held by kube-vip on the control plane nodes.
    - name: vipInterface
      required: false
      schema:
        openAPIV3Schema:
          type: string
          minLength: 1
          description: >-
            Interface kube-vip announces the API VIP on. Leave unset to use the interface
            that holds the default route.
    - name: registryMirror
      required: true
      schema:
        openAPIV3Schema:
          type: string
          minLength: 1
          description: >-
            Host (and optional port) of the registry mirror. Nodes pull every registry in
            mirroredRegistries through https://<registryMirror>/v2/<upstream>/.
    - name: mirroredRegistries
      required: true
      schema:
        openAPIV3Schema:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$'
          description: >-
            Upstream registries (such as docker.io; no port) that nodes pull through registryMirror.
            Each one gets a containerd hosts.toml and a CRI-O mirror entry. A list, so a
            new upstream needs no new class revision.
    - name: podSecurityExemptNamespaces
      required: true
      schema:
        openAPIV3Schema:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          description: >-
            Namespaces Pod Security admission leaves alone: kube-system and the namespaces
            of the CNI and CSI pods that must run privileged. Every other namespace gets
            baseline enforced and restricted as warnings and audit annotations, unless its
            own pod-security.kubernetes.io labels say otherwise.
    - name: trustBundle
      required: true
      schema:
        openAPIV3Schema:
          type: string
          minLength: 1
          description: PEM CA bundle added to the node trust store (the platform CA).
    - name: ntpServers
      required: true
      schema:
        openAPIV3Schema:
          type: array
          minItems: 1
          items:
            type: string
    - name: sshAuthorizedKeys
      required: true
      schema:
        openAPIV3Schema:
          type: array
          minItems: 1
          items:
            type: string
          description: Public keys for the break-glass user 'dciab' on every node.
    - name: controlPlaneSchedulable
      required: false
      schema:
        openAPIV3Schema:
          type: boolean
          default: false
          description: >-
            Register the control plane nodes without kubeadm's
            node-role.kubernetes.io/control-plane:NoSchedule taint, so ordinary pods run on
            them. For a cluster without worker nodes, which otherwise has nowhere to run them.
    - name: authentication
      required: false
      schema:
        openAPIV3Schema:
          type: object
          required: [issuers]
          properties:
            issuers:
              type: array
              minItems: 1
              # Bounded, so the API server's CEL cost estimate for the rules below stays small.
              maxItems: 4
              # Each issuer's users and groups get their own prefix, so two issuers can never
              # name the same user or group (alice from Authentik isn't alice from the site IdP).
              x-kubernetes-validations:
                - rule: self.all(a, self.exists_one(b, b.url == a.url))
                  message: each issuer URL may appear once
                - rule: self.all(a, self.exists_one(b, b.name == a.name))
                  message: each issuer name may appear once
                - rule: "self.all(a, self.exists_one(b, (has(b.usernamePrefix) ? b.usernamePrefix : b.name + ':') == (has(a.usernamePrefix) ? a.usernamePrefix : a.name + ':')))"
                  message: each issuer needs its own username prefix
                - rule: "self.all(a, self.exists_one(b, (has(b.groupsPrefix) ? b.groupsPrefix : b.name + ':') == (has(a.groupsPrefix) ? a.groupsPrefix : a.name + ':')))"
                  message: each issuer needs its own groups prefix
              items:
                type: object
                required: [name, url, clientID]
                properties:
                  name:
                    type: string
                    pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                    maxLength: 63
                    description: Short issuer name; the default username and groups prefix is <name>:.
                  url:
                    type: string
                    pattern: '^https://'
                    maxLength: 512
                  clientID:
                    type: string
                    minLength: 1
                    maxLength: 256
                    description: The audience the issuer's ID tokens carry.
                  usernameClaim:
                    type: string
                    maxLength: 256
                    default: preferred_username
                  usernamePrefix:
                    type: string
                    minLength: 1
                    maxLength: 63
                    description: Default <name>:. Must differ from every other issuer's.
                  groupsClaim:
                    type: string
                    maxLength: 256
                    default: groups
                  groupsPrefix:
                    type: string
                    minLength: 1
                    maxLength: 63
                    description: Default <name>:. Must differ from every other issuer's.
                  certificateAuthority:
                    type: string
                    maxLength: 65536
                    description: PEM CA bundle for the issuer's TLS certificate, when the node trust store lacks it.
          description: >-
            JWT issuers the API server trusts, written to an AuthenticationConfiguration file
            (structured authentication). Several may be listed at once, for example Authentik
            and the site's IdP while people move from one to the other. Leave unset for
            certificate-only clusters (MGMT and INFRA).
    - name: zones
      required: false
      schema:
        openAPIV3Schema:
          type: boolean
          default: false
          description: >-
            True when the site declares vSphere failure domains: the cluster spreads its
            control plane over the VSphereDeploymentZones labelled dciab.io/cluster=<cluster>
            (charts/capi-cluster renders them), and each worker pool names one.
    - name: disableClusterModule
      required: false
      schema:
        openAPIV3Schema:
          type: boolean
          default: false
          description: >-
            True only on sites without DRS (platform.vsphere.clusterModules: false). Cluster
            modules (DRS anti-affinity) otherwise keep each group's VMs on separate hosts.
    - name: machine
      required: true
      schema:
        openAPIV3Schema:
          type: object
          required: [cpu, memoryGiB, diskGiB]
          properties:
            cpu:
              type: integer
              minimum: 2
            memoryGiB:
              type: integer
              minimum: 4
            diskGiB:
              type: integer
              minimum: 25
            dataDiskGiB:
              type: integer
              minimum: 10
              description: >-
                Optional second disk, mounted at /var/lib/longhorn, so Longhorn never writes
                to the root disk that etcd uses. Its size must differ from diskGiB: the node
                finds the disk by its size.
          description: Machine size. Set at cluster level and override per control plane or worker pool.
    - name: dnsServers
      required: true
      schema:
        openAPIV3Schema:
          type: array
          minItems: 1
          items:
            type: string
          description: DNS resolvers for the nodes (the PowerDNS recursor service IPs).
    - name: mtu
      required: false
      schema:
        openAPIV3Schema:
          type: integer
          minimum: 1280
          maximum: 9216
          description: MTU of the node NIC. Leave unset for the platform's default (usually 1500).
    - name: storageNetworks
      required: false
      schema:
        openAPIV3Schema:
          type: array
          default: []
          items:
            type: object
            required: [name, portGroup]
            properties:
              name:
                type: string
                pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                description: The network.storage entry; addresses come from the pool <cluster>-storage-<name>.
              portGroup:
                type: string
                minLength: 1
                description: Port group of the storage network.
              mtu:
                type: integer
                minimum: 1280
                maximum: 9216
          description: >-
            Storage networks (iSCSI or NVMe-oF, one per path for multipathing): one extra NIC
            per entry on every node, with an address from the cluster's pool for it and no
            gateway. Empty by default.
    - name: vsphere
      required: true
      schema:
        openAPIV3Schema:
          type: object
          required: [server, thumbprint, datacenter, datastore, folder, resourcePool, network, template]
          properties:
            server: {type: string}
            thumbprint: {type: string}
            datacenter: {type: string}
            datastore: {type: string}
            folder: {type: string}
            resourcePool: {type: string}
            network:
              type: string
              description: Port group for the nodes.
            template:
              type: string
              description: VM template; its Kubernetes version must match the topology version.

  patches:
    - name: nodeBase
      description: Trust bundle, a registry mirror per mirroredRegistries entry, NTP and the break-glass user on every node.
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files
              valueFrom:
                template: |
                  - path: /etc/pki/ca-trust/source/anchors/dciab-platform-ca.crt
                    owner: root:root
                    permissions: "0644"
                    content: |
                    {{- .trustBundle | nindent 6 }}
                  {{- range .mirroredRegistries }}
                  - path: /etc/containerd/certs.d/{{ . }}/hosts.toml
                    owner: root:root
                    permissions: "0644"
                    content: |
                      server = "https://{{ if eq . "docker.io" }}registry-1.docker.io{{ else }}{{ . }}{{ end }}"
                      [host."https://{{ $.registryMirror }}/v2/{{ . }}"]
                        capabilities = ["pull", "resolve"]
                        override_path = true
                  {{- end }}
                  - path: /etc/containers/registries.conf.d/50-dciab-mirror.conf
                    owner: root:root
                    permissions: "0644"
                    content: |
                      {{- range .mirroredRegistries }}
                      [[registry]]
                      prefix = "{{ . }}"
                      location = "{{ . }}"
                      [[registry.mirror]]
                      location = "{{ $.registryMirror }}/{{ . }}"
                      {{- end }}
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/ntp
              valueFrom:
                template: |
                  enabled: true
                  servers: {{ .ntpServers | toJson }}
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/users
              valueFrom:
                template: |
                  - name: dciab
                    sudo: "ALL=(ALL) NOPASSWD:ALL"
                    sshAuthorizedKeys: {{ .sshAuthorizedKeys | toJson }}
        - selector:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            matchResources:
              machineDeploymentClass:
                names: [default]
          jsonPatches:
            - op: add
              path: /spec/template/spec/files
              valueFrom:
                template: |
                  - path: /etc/pki/ca-trust/source/anchors/dciab-platform-ca.crt
                    owner: root:root
                    permissions: "0644"
                    content: |
                    {{- .trustBundle | nindent 6 }}
                  {{- range .mirroredRegistries }}
                  - path: /etc/containerd/certs.d/{{ . }}/hosts.toml
                    owner: root:root
                    permissions: "0644"
                    content: |
                      server = "https://{{ if eq . "docker.io" }}registry-1.docker.io{{ else }}{{ . }}{{ end }}"
                      [host."https://{{ $.registryMirror }}/v2/{{ . }}"]
                        capabilities = ["pull", "resolve"]
                        override_path = true
                  {{- end }}
                  - path: /etc/containers/registries.conf.d/50-dciab-mirror.conf
                    owner: root:root
                    permissions: "0644"
                    content: |
                      {{- range .mirroredRegistries }}
                      [[registry]]
                      prefix = "{{ . }}"
                      location = "{{ . }}"
                      [[registry.mirror]]
                      location = "{{ $.registryMirror }}/{{ . }}"
                      {{- end }}
            - op: add
              path: /spec/template/spec/ntp
              valueFrom:
                template: |
                  enabled: true
                  servers: {{ .ntpServers | toJson }}
            - op: add
              path: /spec/template/spec/users
              valueFrom:
                template: |
                  - name: dciab
                    sudo: "ALL=(ALL) NOPASSWD:ALL"
                    sshAuthorizedKeys: {{ .sshAuthorizedKeys | toJson }}
    - name: kubeVip
      description: kube-vip static pod holding the API VIP on control plane nodes.
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  path: /etc/kubernetes/manifests/kube-vip.yaml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    apiVersion: v1
                    kind: Pod
                    metadata:
                      name: kube-vip
                      namespace: kube-system
                    spec:
                      containers:
                        - name: kube-vip
                          image: ghcr.io/kube-vip/kube-vip:v1.3.1@sha256:1962f9daf226503f7e6b107f595cb28b7917fd2d0113957075e19a3e5a6c1e33
                          imagePullPolicy: IfNotPresent
                          args: [manager]
                          env:
                            - {name: vip_arp, value: "true"}
                            - {name: port, value: "6443"}
                            - {name: vip_cidr, value: "32"}
                            - {name: cp_enable, value: "true"}
                            - {name: cp_namespace, value: kube-system}
                            - {name: vip_leaderelection, value: "true"}
                            - {name: vip_leasename, value: plndr-cp-lock}
                            - {name: vip_leaseduration, value: "15"}
                            - {name: vip_renewdeadline, value: "10"}
                            - {name: vip_retryperiod, value: "2"}
                            - {name: address, value: "{{ .apiVIP }}"}
                            {{- if .vipInterface }}
                            - {name: vip_interface, value: "{{ .vipInterface }}"}
                            {{- end }}
                          securityContext:
                            capabilities:
                              add: [NET_ADMIN, NET_RAW]
                          volumeMounts:
                            - {mountPath: /etc/kubernetes/admin.conf, name: kubeconfig, readOnly: true}
                      hostAliases:
                        - {hostnames: [kubernetes], ip: 127.0.0.1}
                      hostNetwork: true
                      volumes:
                        - name: kubeconfig
                          hostPath:
                            path: /etc/kubernetes/admin.conf
                            type: FileOrCreate

    - name: authentication
      description: >-
        Structured authentication when the authentication variable is set: the
        AuthenticationConfiguration file, and the API server flag and mount that read it.
        Replaces the --oidc-* flags. Comes after nodeBase, which creates the files list.
      enabledIf: '{{ if .authentication }}true{{ end }}'
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  path: /etc/kubernetes/authentication/config.yaml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    apiVersion: apiserver.config.k8s.io/v1
                    kind: AuthenticationConfiguration
                    jwt:
                    {{- range $i := .authentication.issuers }}
                      - issuer:
                          url: {{ $i.url | quote }}
                          audiences: [{{ $i.clientID | quote }}]
                          {{- if $i.certificateAuthority }}
                          certificateAuthority: {{ $i.certificateAuthority | quote }}
                          {{- end }}
                        claimMappings:
                          username:
                            claim: {{ $i.usernameClaim | default "preferred_username" | quote }}
                            prefix: {{ $i.usernamePrefix | default (printf "%s:" $i.name) | quote }}
                          groups:
                            claim: {{ $i.groupsClaim | default "groups" | quote }}
                            prefix: {{ $i.groupsPrefix | default (printf "%s:" $i.name) | quote }}
                    {{- end }}
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs/-
              value: {name: authentication-config, value: /etc/kubernetes/authentication/config.yaml}
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraVolumes/-
              value:
                name: authentication-config
                hostPath: /etc/kubernetes/authentication/config.yaml
                mountPath: /etc/kubernetes/authentication/config.yaml
                readOnly: true
                pathType: File
    - name: vsphereCluster
      description: vCenter connection, credentials Secret and control plane endpoint.
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: VSphereClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/server
              valueFrom: {variable: vsphere.server}
            - op: add
              path: /spec/template/spec/thumbprint
              valueFrom: {variable: vsphere.thumbprint}
            - op: add
              path: /spec/template/spec/controlPlaneEndpoint
              valueFrom:
                template: |
                  host: {{ .apiVIP | quote }}
                  port: 6443
            - op: add
              path: /spec/template/spec/identityRef
              valueFrom:
                template: |
                  kind: Secret
                  name: {{ .builtin.cluster.name }}-vsphere-credentials
    - name: vsphereMachines
      description: Placement, template, size and node addressing for every machine.
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: VSphereMachineTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/server
              valueFrom: {variable: vsphere.server}
            - op: add
              path: /spec/template/spec/thumbprint
              valueFrom: {variable: vsphere.thumbprint}
            - op: add
              path: /spec/template/spec/datacenter
              valueFrom: {variable: vsphere.datacenter}
            - op: add
              path: /spec/template/spec/datastore
              valueFrom: {variable: vsphere.datastore}
            - op: add
              path: /spec/template/spec/folder
              valueFrom: {variable: vsphere.folder}
            - op: add
              path: /spec/template/spec/resourcePool
              valueFrom: {variable: vsphere.resourcePool}
            - op: add
              path: /spec/template/spec/template
              valueFrom: {variable: vsphere.template}
            - op: add
              path: /spec/template/spec/numCPUs
              valueFrom: {variable: machine.cpu}
            - op: add
              path: /spec/template/spec/memoryMiB
              valueFrom:
                template: '{{ mul .machine.memoryGiB 1024 }}'
            - op: add
              path: /spec/template/spec/diskGiB
              valueFrom: {variable: machine.diskGiB}
            - op: add
              path: /spec/template/spec/additionalDisksGiB
              valueFrom:
                template: '{{ if .machine.dataDiskGiB }}[{{ .machine.dataDiskGiB }}]{{ else }}[]{{ end }}'
            - op: add
              path: /spec/template/spec/network
              valueFrom:
                template: |
                  devices:
                    - networkName: {{ .vsphere.network | quote }}
                      addressesFromPools:
                        - apiGroup: ipam.cluster.x-k8s.io
                          kind: InClusterIPPool
                          name: {{ .builtin.cluster.name }}-nodes
                      nameservers: {{ .dnsServers | toJson }}
                      {{- if .mtu }}
                      mtu: {{ .mtu }}
                      {{- end }}
                    {{- range $n := .storageNetworks }}
                    - networkName: {{ $n.portGroup | quote }}
                      addressesFromPools:
                        - apiGroup: ipam.cluster.x-k8s.io
                          kind: InClusterIPPool
                          name: {{ $.builtin.cluster.name }}-storage-{{ $n.name }}
                      {{- if $n.mtu }}
                      mtu: {{ $n.mtu }}
                      {{- end }}
                    {{- end }}
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: VSphereMachineTemplate
            matchResources:
              machineDeploymentClass:
                names: [default]
          jsonPatches:
            - op: add
              path: /spec/template/spec/server
              valueFrom: {variable: vsphere.server}
            - op: add
              path: /spec/template/spec/thumbprint
              valueFrom: {variable: vsphere.thumbprint}
            - op: add
              path: /spec/template/spec/datacenter
              valueFrom: {variable: vsphere.datacenter}
            - op: add
              path: /spec/template/spec/datastore
              valueFrom: {variable: vsphere.datastore}
            - op: add
              path: /spec/template/spec/folder
              valueFrom: {variable: vsphere.folder}
            - op: add
              path: /spec/template/spec/resourcePool
              valueFrom: {variable: vsphere.resourcePool}
            - op: add
              path: /spec/template/spec/template
              valueFrom: {variable: vsphere.template}
            - op: add
              path: /spec/template/spec/numCPUs
              valueFrom: {variable: machine.cpu}
            - op: add
              path: /spec/template/spec/memoryMiB
              valueFrom:
                template: '{{ mul .machine.memoryGiB 1024 }}'
            - op: add
              path: /spec/template/spec/diskGiB
              valueFrom: {variable: machine.diskGiB}
            - op: add
              path: /spec/template/spec/additionalDisksGiB
              valueFrom:
                template: '{{ if .machine.dataDiskGiB }}[{{ .machine.dataDiskGiB }}]{{ else }}[]{{ end }}'
            - op: add
              path: /spec/template/spec/network
              valueFrom:
                template: |
                  devices:
                    - networkName: {{ .vsphere.network | quote }}
                      addressesFromPools:
                        - apiGroup: ipam.cluster.x-k8s.io
                          kind: InClusterIPPool
                          name: {{ .builtin.cluster.name }}-nodes
                      nameservers: {{ .dnsServers | toJson }}
                      {{- if .mtu }}
                      mtu: {{ .mtu }}
                      {{- end }}
                    {{- range $n := .storageNetworks }}
                    - networkName: {{ $n.portGroup | quote }}
                      addressesFromPools:
                        - apiGroup: ipam.cluster.x-k8s.io
                          kind: InClusterIPPool
                          name: {{ $.builtin.cluster.name }}-storage-{{ $n.name }}
                      {{- if $n.mtu }}
                      mtu: {{ $n.mtu }}
                      {{- end }}
                    {{- end }}
    - name: apiServerAudit
      description: >-
        Kubernetes API audit policy file on control plane nodes. The API server flags and
        mounts that use it are in the KubeadmControlPlaneTemplate. This patch comes after
        nodeBase, which creates the files list.
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              value:
                path: /etc/kubernetes/audit/policy.yaml
                owner: root:root
                permissions: "0600"
                content: |
                  apiVersion: audit.k8s.io/v1
                  kind: Policy
                  # One event per request, when the response is ready.
                  omitStages: [RequestReceived]
                  rules:
                    # First match wins. Noise first.
                    - level: None
                      nonResourceURLs: [/healthz*, /livez*, /readyz*, /version, /metrics]
                    - level: None
                      resources:
                        - {group: "", resources: [events]}
                        - {group: events.k8s.io, resources: [events]}
                    # Leader election and node heartbeats.
                    - level: None
                      users: [system:kube-controller-manager, system:kube-scheduler, system:apiserver]
                      resources: [{group: coordination.k8s.io, resources: [leases]}]
                    - level: None
                      userGroups: [system:nodes, system:serviceaccounts:kube-system]
                      resources: [{group: coordination.k8s.io, resources: [leases]}]
                    - level: None
                      namespaces: [kube-system]
                      resources:
                        - {group: coordination.k8s.io, resources: [leases], resourceNames: [plndr-cp-lock, plndr-svcs-lock]}
                    # Never log bodies that hold secrets or tokens.
                    - level: Metadata
                      resources:
                        - {group: "", resources: [secrets, configmaps, serviceaccounts/token]}
                        - {group: authentication.k8s.io, resources: [tokenreviews]}
                    # Read-only traffic from system components.
                    - level: None
                      users: [system:kube-controller-manager, system:kube-scheduler, system:kube-proxy, system:apiserver]
                      verbs: [get, list, watch]
                    - level: None
                      userGroups: [system:nodes]
                      verbs: [get, list, watch]
                    # Who changed RBAC, and to what.
                    - level: RequestResponse
                      verbs: [create, update, patch, delete, deletecollection]
                      resources: [{group: rbac.authorization.k8s.io}]
                    - level: Metadata
    - name: podSecurity
      description: >-
        Pod Security admission defaults on control plane nodes: baseline enforced,
        restricted as warnings and audit annotations, podSecurityExemptNamespaces exempt.
        The API server flag and mount are in the KubeadmControlPlaneTemplate.
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  path: /etc/kubernetes/admission/config.yaml
                  owner: root:root
                  permissions: "0644"
                  content: |
                    apiVersion: apiserver.config.k8s.io/v1
                    kind: AdmissionConfiguration
                    plugins:
                      - name: PodSecurity
                        configuration:
                          apiVersion: pod-security.admission.config.k8s.io/v1
                          kind: PodSecurityConfiguration
                          defaults:
                            enforce: baseline
                            enforce-version: latest
                            audit: restricted
                            audit-version: latest
                            warn: restricted
                            warn-version: latest
                          exemptions:
                            usernames: []
                            runtimeClasses: []
                            namespaces: {{ .podSecurityExemptNamespaces | toJson }}
    - name: secretEncryption
      description: >-
        Secrets encrypted at rest in etcd. The EncryptionConfiguration (secretbox, one key)
        comes from the Secret <cluster>-encryption-config in the cluster's namespace on the
        management cluster, which charts/capi-cluster creates once and never rotates by
        itself. The key is never in Git or in the class. The API server flag and mount are
        in the KubeadmControlPlaneTemplate.
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              valueFrom:
                template: |
                  path: /etc/kubernetes/encryption/config.yaml
                  owner: root:root
                  permissions: "0600"
                  contentFrom:
                    secret:
                      name: {{ .builtin.cluster.name }}-encryption-config
                      key: config.yaml
    - name: kubeletServingCerts
      description: >-
        Kubelets request their serving certificate from the cluster CA
        (serverTLSBootstrap) and rotate it, instead of a self-signed one. A kubeadm patch
        file; init and join read it from /etc/kubernetes/patches. The serving CSRs are
        approved by kubelet-csr-approver (addons/kubelet-csr-approver).
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              value:
                path: /etc/kubernetes/patches/kubeletconfiguration+merge.yaml
                owner: root:root
                permissions: "0644"
                content: |
                  serverTLSBootstrap: true
        - selector:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            matchResources:
              machineDeploymentClass:
                names: [default]
          jsonPatches:
            - op: add
              path: /spec/template/spec/files/-
              value:
                path: /etc/kubernetes/patches/kubeletconfiguration+merge.yaml
                owner: root:root
                permissions: "0644"
                content: |
                  serverTLSBootstrap: true
    - name: vsphereFailureDomains
      description: Spread the control plane over the cluster's deployment zones, when the site has zones.
      enabledIf: '{{ if .zones }}true{{ end }}'
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: VSphereClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/failureDomainSelector
              valueFrom:
                template: |
                  matchLabels:
                    dciab.io/cluster: {{ .builtin.cluster.name | quote }}
    - name: vsphereClusterModules
      description: Turn cluster modules off on a site without DRS.
      enabledIf: '{{ if .disableClusterModule }}true{{ end }}'
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: VSphereClusterTemplate
            matchResources:
              infrastructureCluster: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/disableClusterModule
              value: true
    - name: storageInitiators
      description: >-
        When the nodes have storage networks: load the NVMe/TCP and multipath kernel
        modules, and start multipathd where the node image has it. The initiators and
        their multipath configuration come with the node image.
      enabledIf: '{{ if .storageNetworks }}true{{ end }}'
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              value:
                path: /etc/modules-load.d/dciab-storage.conf
                owner: root:root
                permissions: "0644"
                content: |
                  nvme-tcp
                  dm_multipath
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/preKubeadmCommands/-
              value: "systemctl restart systemd-modules-load.service && if systemctl cat multipathd.service >/dev/null 2>&1; then systemctl enable --now multipathd.service; fi"
        - selector:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            matchResources:
              machineDeploymentClass:
                names: [default]
          jsonPatches:
            - op: add
              path: /spec/template/spec/files/-
              value:
                path: /etc/modules-load.d/dciab-storage.conf
                owner: root:root
                permissions: "0644"
                content: |
                  nvme-tcp
                  dm_multipath
            - op: add
              path: /spec/template/spec/preKubeadmCommands/-
              value: "systemctl restart systemd-modules-load.service && if systemctl cat multipathd.service >/dev/null 2>&1; then systemctl enable --now multipathd.service; fi"
    - name: dataDisk
      description: >-
        Machines with machine.dataDiskGiB: format the second disk once and mount it at
        /var/lib/longhorn (an fstab entry, so it comes back after a reboot), before kubeadm
        runs. The bootstrap fails when the disk isn't there, rather than letting Longhorn
        write to the root disk. Machines without it run a no-op.
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              value:
                path: /etc/dciab/data-disk.sh
                owner: root:root
                permissions: "0755"
                content: |
                  #!/bin/sh
                  # Mount this machine's data disk (dataDiskGiB) at /var/lib/longhorn. The disk
                  # is the blank one of exactly that size; it is formatted once and labelled.
                  set -eu
                  size_gib="${1:-0}"
                  [ "$size_gib" -gt 0 ] || exit 0
                  mnt=/var/lib/longhorn
                  label=dciab-data
                  if ! dev="$(blkid -L "$label")"; then
                    want=$((size_gib * 1024 * 1024 * 1024))
                    dev=""
                    for d in $(lsblk -dbnpo NAME,TYPE,SIZE | awk -v w="$want" '$2 == "disk" && $3 == w {print $1}'); do
                      if [ -z "$(lsblk -nro FSTYPE,PTTYPE "$d" | tr -d '[:space:]')" ]; then dev="$d"; break; fi
                    done
                    [ -n "$dev" ] || { echo "dciab-data-disk: no blank ${size_gib} GiB disk" >&2; exit 1; }
                    mkfs.xfs -q -L "$label" "$dev"
                  fi
                  mkdir -p "$mnt"
                  grep -q "^LABEL=$label " /etc/fstab || echo "LABEL=$label $mnt xfs defaults 0 2" >> /etc/fstab
                  mountpoint -q "$mnt" || mount "$mnt"
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/preKubeadmCommands/-
              valueFrom:
                template: '/etc/dciab/data-disk.sh {{ .machine.dataDiskGiB | default 0 }}'
        - selector:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            matchResources:
              machineDeploymentClass:
                names: [default]
          jsonPatches:
            - op: add
              path: /spec/template/spec/files/-
              value:
                path: /etc/dciab/data-disk.sh
                owner: root:root
                permissions: "0755"
                content: |
                  #!/bin/sh
                  # Mount this machine's data disk (dataDiskGiB) at /var/lib/longhorn. The disk
                  # is the blank one of exactly that size; it is formatted once and labelled.
                  set -eu
                  size_gib="${1:-0}"
                  [ "$size_gib" -gt 0 ] || exit 0
                  mnt=/var/lib/longhorn
                  label=dciab-data
                  if ! dev="$(blkid -L "$label")"; then
                    want=$((size_gib * 1024 * 1024 * 1024))
                    dev=""
                    for d in $(lsblk -dbnpo NAME,TYPE,SIZE | awk -v w="$want" '$2 == "disk" && $3 == w {print $1}'); do
                      if [ -z "$(lsblk -nro FSTYPE,PTTYPE "$d" | tr -d '[:space:]')" ]; then dev="$d"; break; fi
                    done
                    [ -n "$dev" ] || { echo "dciab-data-disk: no blank ${size_gib} GiB disk" >&2; exit 1; }
                    mkfs.xfs -q -L "$label" "$dev"
                  fi
                  mkdir -p "$mnt"
                  grep -q "^LABEL=$label " /etc/fstab || echo "LABEL=$label $mnt xfs defaults 0 2" >> /etc/fstab
                  mountpoint -q "$mnt" || mount "$mnt"
            - op: add
              path: /spec/template/spec/preKubeadmCommands/-
              valueFrom:
                template: '/etc/dciab/data-disk.sh {{ .machine.dataDiskGiB | default 0 }}'
    - name: controlPlaneSchedulable
      description: >-
        A cluster without worker nodes runs its workloads on its control plane nodes:
        nodeRegistration.taints is empty for kubeadm init and join, instead of kubeadm's
        default control-plane NoSchedule taint.
      enabledIf: '{{ if .controlPlaneSchedulable }}true{{ end }}'
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/initConfiguration/nodeRegistration/taints
              value: []
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/joinConfiguration/nodeRegistration/taints
              value: []

---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: VSphereClusterTemplate
metadata:
  name: dciab-vsphere-r1
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  template:
    spec:
      server: set-by-patch.invalid
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: VSphereMachineTemplate
metadata:
  name: dciab-vsphere-r1-controlplane
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  template:
    spec:
      server: set-by-patch.invalid
      template: set-by-patch
      cloneMode: fullClone
      numCPUs: 2
      memoryMiB: 4096
      diskGiB: 25
      os: Linux
      powerOffMode: trySoft
      network:
        devices:
          - networkName: set-by-patch
            # Placeholder: replaced with the cluster's <cluster>-nodes pool by the vsphereMachines patch.
            addressesFromPools:
              - apiGroup: ipam.cluster.x-k8s.io
                kind: InClusterIPPool
                name: set-by-patch
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: VSphereMachineTemplate
metadata:
  name: dciab-vsphere-r1-worker
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  template:
    spec:
      server: set-by-patch.invalid
      template: set-by-patch
      cloneMode: fullClone
      numCPUs: 2
      memoryMiB: 4096
      diskGiB: 25
      os: Linux
      powerOffMode: trySoft
      network:
        devices:
          - networkName: set-by-patch
            # Placeholder: replaced with the cluster's <cluster>-nodes pool by the vsphereMachines patch.
            addressesFromPools:
              - apiGroup: ipam.cluster.x-k8s.io
                kind: InClusterIPPool
                name: set-by-patch
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlaneTemplate
metadata:
  name: dciab-vsphere-r1-controlplane
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  template:
    spec:
      # Replace control plane machines 60 days before their kubeadm certificates (one
      # year) expire, so a cluster that is never upgraded never runs on expired ones.
      rollout:
        before:
          certificatesExpiryDays: 60
      # A control plane machine that keeps failing (a bad template, no free address) is
      # recreated at most 3 times, 10 minutes apart; a machine healthy for an hour starts
      # the count again.
      remediation:
        maxRetry: 3
        retryPeriodSeconds: 600
        minHealthyPeriodSeconds: 3600
      kubeadmConfigSpec:
        clusterConfiguration:
          apiServer:
            extraArgs:
              - {name: profiling, value: "false"}
              - {name: tls-min-version, value: VersionTLS12}
              # Audit policy file: written by the apiServerAudit patch.
              - {name: audit-policy-file, value: /etc/kubernetes/audit/policy.yaml}
              - {name: audit-log-path, value: /var/log/kubernetes/audit/audit.log}
              - {name: audit-log-maxage, value: "30"}
              - {name: audit-log-maxbackup, value: "10"}
              - {name: audit-log-maxsize, value: "100"}
              # Pod Security defaults: written by the podSecurity patch.
              - {name: admission-control-config-file, value: /etc/kubernetes/admission/config.yaml}
              # Secret encryption at rest: written by the secretEncryption patch.
              - {name: encryption-provider-config, value: /etc/kubernetes/encryption/config.yaml}
            extraVolumes:
              - name: admission-config
                hostPath: /etc/kubernetes/admission/config.yaml
                mountPath: /etc/kubernetes/admission/config.yaml
                readOnly: true
                pathType: File
              - name: encryption-config
                hostPath: /etc/kubernetes/encryption/config.yaml
                mountPath: /etc/kubernetes/encryption/config.yaml
                readOnly: true
                pathType: File
              - name: audit-policy
                hostPath: /etc/kubernetes/audit/policy.yaml
                mountPath: /etc/kubernetes/audit/policy.yaml
                readOnly: true
                pathType: File
              - name: audit-logs
                hostPath: /var/log/kubernetes/audit
                mountPath: /var/log/kubernetes/audit
                readOnly: false
                pathType: DirectoryOrCreate
          controllerManager:
            extraArgs:
              - {name: profiling, value: "false"}
          scheduler:
            extraArgs:
              - {name: profiling, value: "false"}
        initConfiguration:
          # Cilium replaces kube-proxy (Gateway API needs it); see addons/cilium.
          skipPhases: [addon/kube-proxy]
          # kubeadm patches, such as the kubelet's serverTLSBootstrap (kubeletServingCerts patch).
          patches:
            directory: /etc/kubernetes/patches
          nodeRegistration:
            name: '{{ local_hostname }}'
            kubeletExtraArgs:
                            - {name: cloud-provider, value: "external"}
        joinConfiguration:
          patches:
            directory: /etc/kubernetes/patches
          nodeRegistration:
            name: '{{ local_hostname }}'
            kubeletExtraArgs:
                            - {name: cloud-provider, value: "external"}
        preKubeadmCommands:
          - update-ca-trust extract
          # kube-vip needs super-admin.conf while kubeadm init runs (Kubernetes 1.29+).
          - "[ -f /run/kubeadm/kubeadm.yaml ] && sed -i 's#path: /etc/kubernetes/admin.conf#path: /etc/kubernetes/super-admin.conf#' /etc/kubernetes/manifests/kube-vip.yaml || true"
        postKubeadmCommands:
          - "[ -f /run/kubeadm/kubeadm.yaml ] && sed -i 's#path: /etc/kubernetes/super-admin.conf#path: /etc/kubernetes/admin.conf#' /etc/kubernetes/manifests/kube-vip.yaml || true"
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: dciab-vsphere-r1-worker
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  template:
    spec:
      joinConfiguration:
        patches:
          directory: /etc/kubernetes/patches
        nodeRegistration:
          name: '{{ local_hostname }}'
          kubeletExtraArgs:
            - {name: cloud-provider, value: "external"}
      preKubeadmCommands:
        - update-ca-trust extract
