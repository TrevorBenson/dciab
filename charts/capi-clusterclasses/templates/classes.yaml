{{- /*
Class files are served as they are, never rendered: their patches hold CAPI's own Go
templates, and a frozen class must reach the cluster byte for byte.
*/ -}}
{{- range $revision := .Values.revisions }}
{{- range $provider, $enabled := $.Values.providers }}
{{- if $enabled }}
{{- $path := printf "classes/%s/%s.yaml" $revision $provider }}
{{- $content := $.Files.Get $path }}
{{- if not $content }}
{{- fail (printf "class revision %s has no %s class (%s is missing)" $revision $provider $path) }}
{{- end }}
{{ $content }}
{{- end }}
{{- end }}
{{- end }}
