# Every version DCiaB ships, in one place. The archive build pipeline resolves each
# entry to a digest; until that pipeline exists, entries carry versions only.
#
# Rules:
# - Bump a version here, never inline in a chart or script.
# - Anything that changes a node (Kubernetes, kube-vip) also needs a new ClusterClass
#   revision in charts/capi-clusterclasses once the current one is released
#   (docs/VERSIONING.md).
apiVersion: dciab.io/v1alpha1
kind: BundleLock

kubernetes:
  # CAPI v1.14 supports v1.33-v1.37 for management and workload clusters.
  version: v1.36.6

clusterAPI:
  contract: v1beta2
  # Values for the ${VARIABLES} in the provider component manifests. DCiaB installs
  # providers with exactly these, in the e2e test and on site. Anything a manifest needs
  # that is missing here (and has no default) stops the install.
  variables:
    # ClusterClass needs the ClusterTopology feature gate, still off by default in v1.14,
    # in core CAPI and KCP (CLUSTER_TOPOLOGY) and in CAPMOX (ClusterTopology).
    CLUSTER_TOPOLOGY: "true"
    ClusterTopology: "true"
    # CAPV's global fallback credentials. DCiaB clusters always set identityRef to a
    # per-cluster Secret, so these stay empty.
    VSPHERE_USERNAME: ""
    VSPHERE_PASSWORD: ""
  core:
    repo: kubernetes-sigs/cluster-api
    version: v1.14.4
    components: [core-components.yaml, bootstrap-components.yaml, control-plane-components.yaml]
  operator:
    repo: kubernetes-sigs/cluster-api-operator
    version: v0.30.1
  providers:
    infrastructure-vsphere:
      repo: kubernetes-sigs/cluster-api-provider-vsphere
      version: v1.17.0
      components: [infrastructure-components.yaml]
    infrastructure-proxmox:
      repo: ionos-cloud/cluster-api-provider-proxmox
      version: v0.9.2
      components: [infrastructure-components.yaml]
    infrastructure-metal3:
      repo: metal3-io/cluster-api-provider-metal3
      version: v1.14.2
      components: [infrastructure-components.yaml]
    ipam-in-cluster:
      repo: kubernetes-sigs/cluster-api-ipam-provider-in-cluster
      version: v1.1.1
      components: [ipam-components.yaml]
    ipam-metal3:
      repo: metal3-io/ip-address-manager
      version: v1.14.3
      components: [ipam-components.yaml]

metal3:
  baremetalOperator:
    repo: metal3-io/baremetal-operator
    version: v0.14.3
    # BMO publishes no CRD bundle; fetch_crds.py reads this kustomization's resources.
    crds: config/base/crds/kustomization.yaml

certManager:
  repo: cert-manager/cert-manager
  version: v1.21.3
  components: [cert-manager.yaml]

# Images referenced directly by DCiaB's own manifests (charts bring their own lists).
# Pinned by digest; CI checks the tag still resolves to it (hack/check_image_digests.py).
images:
  kubeVip: ghcr.io/kube-vip/kube-vip:v1.3.1@sha256:1962f9daf226503f7e6b107f595cb28b7917fd2d0113957075e19a3e5a6c1e33

# Node images: VM templates cluster nodes are cloned from, built with Kubernetes
# image-builder (images/node/README.md). Built artifacts are never committed.
nodeImages:
  imageBuilder:
    version: v0.1.55
    # Pinned by digest; images/node/build.sh refuses to run without it.
    image: registry.k8s.io/scl-image-builder/cluster-node-image-builder-amd64:v0.1.55
    digest: "sha256:03051205c79c5c7d5ce3693b5ff3841fed6938f7e126137815bb7d70c1646dfe"
  rocky10:
    # Rocky Linux 10 minimal ISO: a versioned URL (10.N, not "10") and its sha256 from the
    # CHECKSUM file beside it.
    isoURL: "https://download.rockylinux.org/pub/rocky/10.3/isos/x86_64/Rocky-10.3-x86_64-minimal.iso"
    isoSHA256: "878a3f92281d3eb91ca9d1a195794d47b5bce4e02a85f351c606709e98481cc4"
  # Image mode (bootc) recipe, under evaluation: images/node-bootc/README.md.
  bootc:
    # Rocky Linux 10 bootc base from the RESF SIG/Containers recipe, at a pinned commit.
    sigRecipe:
      url: https://git.resf.org/sig_containers/rocky-bootc.git
      branch: r10
      commit: ""
    manifest: minimal
    # A prebuilt base (image@sha256:...) instead of building the recipe; empty = build it.
    baseImage: ""
    # Turns the OCI image into raw/qcow2/vmdk disks. Pin as image@sha256:<digest>.
    bootcImageBuilder: quay.io/centos-bootc/bootc-image-builder
    # CRI-O follows Kubernetes minor versions.
    crioSeries: v1.36

# Day 0, for sites that start from bare servers (docs/adr/0001-day0-hypervisors-and-services.md).
# Hypervisor installers DCiaB has tested. bundle.lock pins a version whether or not the
# archive carries the file: "shipped" says which.
hypervisors:
  proxmox:
    version: "9.2-1"
    isoURL: "https://enterprise.proxmox.com/iso/proxmox-ve_9.2-1.iso"
    isoSHA256: "4e88fe416df9b527624a175f24c9aa07c714d3332afb1ee3dbf3879573ef2c6c"
    shipped: true
  esxi:
    # Not redistributable: the site supplies the ISO (spec.hypervisors.installerFile) and
    # validate checks it against this sha256. Empty until the first build DCiaB has tested.
    version: ""
    isoFile: ""
    isoSHA256: ""
    shipped: false

# Day 0 services: DNS, NTP and HTTP on the bootstrap host, only until the platform's own
# services take over (docs/adr/0001-day0-hypervisors-and-services.md). Pinned by digest;
# hack/check_image_digests.py checks them like the images above.
day0:
  images:
    coredns: docker.io/coredns/coredns:1.14.6
    caddy: docker.io/library/caddy:2.11.7
    # Base of DCiaB's chrony image (images/day0-chrony/Containerfile).
    chronyBase: docker.io/rockylinux/rockylinux:10-minimal

charts:
  cilium: 1.20.5
  cert-manager: v1.21.3
  longhorn: 1.13.0

# Where online installs fetch the charts above. The archive build will vendor them.
chartRepositories:
  cilium: https://helm.cilium.io

# sha256 of each chart .tgz, checked before install. Empty: the installer warns and
# prints the sum to pin.
chartDigests:
  cilium: "0c7592eb75179ecf46dd3ec22145916f0164c4401214ea15afb5b230b1d11a21"

tools:
  helm: v4.3.2
  kind: v0.33.0   # default node image: Kubernetes v1.37.0 (CAPI v1.14 supports it as a management cluster)

# sha256 of every manifest hack/fetch_crds.py downloads; it refuses a mismatch or an
