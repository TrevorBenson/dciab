# Every version DCiaB ships, in one place. The archive build pipeline resolves each
# entry to a digest; until that pipeline exists, entries carry versions only.
#
# Rules:
# - Bump a version here, never inline in a chart or script.
# - Anything that changes a node (Kubernetes, kube-vip) also needs a new ClusterClass
#   revision in charts/capi-clusterclasses once the current one is released
#   (docs/VERSIONING.md).
apiVersion: dciab.io/v1alpha1
kind: BundleLock

kubernetes:
  # CAPI v1.14 supports v1.33-v1.37 for management and workload clusters.
  version: v1.36.6
  # Test only, never shipped: the version the Kubernetes upgrade gate starts from. Nodes
  # built at this version (images/node-bootc/build.sh --upgrade-from) are upgraded to
  # `version`. One minor below it.
  upgradeFrom: v1.35.9

clusterAPI:
  contract: v1beta2
  # Values for the ${VARIABLES} in the provider component manifests. DCiaB installs
  # providers with exactly these, in the e2e test and on site. Anything a manifest needs
  # that is missing here (and has no default) stops the install.
  variables:
    # ClusterClass needs the ClusterTopology feature gate, still off by default in v1.14,
    # in core CAPI and KCP (CLUSTER_TOPOLOGY) and in CAPMOX (ClusterTopology).
    CLUSTER_TOPOLOGY: "true"
    ClusterTopology: "true"
    # CAPV's global fallback credentials. DCiaB clusters always set identityRef to a
    # per-cluster Secret, so these stay empty.
    VSPHERE_USERNAME: ""
    VSPHERE_PASSWORD: ""
    # CAPV cluster modules (DRS VM-VM anti-affinity) for every vSphere site (ADR 0010); off
    # upstream. A site without DRS turns them off per cluster (platform.vsphere.clusterModules).
    EXP_NODE_ANTI_AFFINITY: "true"
  core:
    repo: kubernetes-sigs/cluster-api
    version: v1.14.4
    components: [core-components.yaml, bootstrap-components.yaml, control-plane-components.yaml]
  operator:
    repo: kubernetes-sigs/cluster-api-operator
    version: v0.30.1
  providers:
    infrastructure-vsphere:
      repo: kubernetes-sigs/cluster-api-provider-vsphere
      version: v1.17.0
      components: [infrastructure-components.yaml]
    infrastructure-proxmox:
      repo: ionos-cloud/cluster-api-provider-proxmox
      version: v0.9.2
      components: [infrastructure-components.yaml]
    infrastructure-metal3:
      repo: metal3-io/cluster-api-provider-metal3
      version: v1.14.2
      components: [infrastructure-components.yaml]
    ipam-in-cluster:
      repo: kubernetes-sigs/cluster-api-ipam-provider-in-cluster
      version: v1.1.1
      components: [ipam-components.yaml]
    ipam-metal3:
      repo: metal3-io/ip-address-manager
      version: v1.14.3
      components: [ipam-components.yaml]

metal3:
  baremetalOperator:
    repo: metal3-io/baremetal-operator
    version: v0.14.3
    # BMO publishes no CRD bundle; fetch_crds.py reads this kustomization's resources.
    crds: config/base/crds/kustomization.yaml

certManager:
  repo: cert-manager/cert-manager
  version: v1.21.3
  components: [cert-manager.yaml]

# Images referenced directly by DCiaB's own manifests (charts bring their own lists).
# Pinned by digest; CI checks the tag still resolves to it (hack/check_image_digests.py).
images:
  kubeVip: ghcr.io/kube-vip/kube-vip:v1.3.1@sha256:1962f9daf226503f7e6b107f595cb28b7917fd2d0113957075e19a3e5a6c1e33
  # The node image the bootstrap kind cluster boots: kind's own default for tools.kind.
  kindNode: docker.io/kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  # The seed registry dciab seed runs on the bootstrap host (Zot).
  zot: ghcr.io/project-zot/zot-linux-amd64:v2.1.20@sha256:95a837a0afacf5b7edc0c92493f04beee6891989b8d2fd50a00cf65a1e6d4fd5
  # Built from images/pve-assistant and published by CI on main; pinned by digest once
  # published (dciab hypervisors refuses an unpinned one).
  pveAssistant: ghcr.io/trevorbenson/dciab-pve-assistant:9.2.9@sha256:e133e61033fedd95f187d9e4393470b2e225c9d03a53e1c22ac6af335d8a5509
  # DCiaB's backup image (images/backup: age, rclone, kubectl, clusterctl and the backup
  # runner), for the etcd snapshot and CAPI export CronJobs (docs/BACKUP.md). Built and
  # published by CI on main; pinned by digest once published. dciab mgmt's backups step
  # refuses an unpinned one.
  backup: ghcr.io/trevorbenson/dciab-backup:8b7eed0a1365@sha256:6a74ac23fc02c987645948e19b2dcbeae48e6d9c55b6ec6b0628a60bc493074a

# Upstream registries nodes pull through the site registry (registry.<domain>/v2/<upstream>/).
# dciab cluster-values passes them to the mirroredRegistries ClusterClass variable, which
# gives each one a CRI-O mirror entry, so adding a registry here needs no new class
# revision (it does roll the nodes). Every image a node pulls must come from one
# of them; tests/test_clusterclasses.py checks the images pinned in this file.
mirroredRegistries: [docker.io, quay.io, ghcr.io, registry.k8s.io]

# Node images: built from the image mode (bootc) recipe, images/node-bootc/README.md, and
# turned into the disks and templates cluster nodes boot from. Built artifacts are never
# committed.
nodeImages:
  bootc:
    # Rocky Linux 10 bootc base from the RESF SIG/Containers recipe, at a pinned commit.
    sigRecipe:
      url: https://git.resf.org/sig_containers/rocky-bootc.git
      branch: r10
      commit: "7de0140298a426c89d7ca014f127689a596b5cc0"
    manifest: minimal
    # A prebuilt base (image@sha256:...) instead of building the recipe; empty = build it.
    baseImage: ghcr.io/trevorbenson/dciab-rocky-bootc-base@sha256:56cfba5c1ad3fb20f5a4e3fb532b01139b8f8089cfb86ef1e3cdc07760f2ebbd   # minimal-7de0140298a4, built by lab-runner-image.yml
    # Turns the OCI image into raw/qcow2/vmdk disks. Pin as image@sha256:<digest>.
    bootcImageBuilder: quay.io/centos-bootc/bootc-image-builder@sha256:dab86ee6b46dcade411b37f4e70b07d93b6a06da0dbfec6fe89247a220e0d9f8
    # CRI-O follows Kubernetes minor versions.
    crioSeries: v1.36
  # The node image and the disks the archive carries, built and published to GHCR by
  # .github/workflows/lab-node-image.yml on main (tag <kubernetes version>-<id>,
  # hack/lab/node-image-id.sh), once per tag. Pin each by digest after its first publish;
  # build/archive.py nodes copies every pinned disk into the payload and checks its sha256.
  # Empty = not published yet (a full archive refuses a missing Proxmox disk: --require-built).
  published:
    image: ""
    disks:
      proxmox: {ref: "", file: disk.qcow2, sha256: ""}   # imported as the Proxmox VE node template
      vsphere: {ref: "", file: disk.vmdk, sha256: ""}    # not built yet (vSphere lane)
      metal3: {ref: "", file: disk.raw, sha256: ""}      # not built yet (Metal3, r1beta)

# Day 0, for sites that start from bare servers (docs/adr/0001-day0-hypervisors-and-services.md).
# Hypervisor installers DCiaB has tested. bundle.lock pins a version whether or not the
# archive carries the file: "shipped" says which.

# proxmox-auto-install-assistant, which builds each hypervisor's installer ISO with its answer
# file inside (images/pve-assistant, lib/dciab_hypervisors/iso.py). Empty pins are filled from
# a first build: images/pve-assistant/build.sh prints them.
pveAssistant:
  # Pinned by digest (build.sh --print-pins prints it); hack/check_image_digests.py checks it.
  baseImage: docker.io/library/debian:trixie-slim@sha256:8aa5a7bf5a1955bddbe7d74fcdd0b91ab30e74362a8b73af672b0481b35b44a0
  keyringURL: https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg
  keyringSHA256: "136673be77aba35dcce385b28737689ad64fd785a797e57897589aed08db6e45"
  repository: http://download.proxmox.com/debian/pve trixie pve-no-subscription
  version: "9.2.9"
hypervisors:
  proxmox:
    version: "9.2-1"
    isoURL: "https://enterprise.proxmox.com/iso/proxmox-ve_9.2-1.iso"
    isoSHA256: "4e88fe416df9b527624a175f24c9aa07c714d3332afb1ee3dbf3879573ef2c6c"
    shipped: true
  esxi:
    # Not redistributable: the site supplies the ISO (spec.hypervisors.installerFile) and
    # validate checks it against this sha256. Empty until the first build DCiaB has tested.
    version: ""
    isoFile: ""
    isoSHA256: ""
    shipped: false

# Day 0 services: DNS, NTP and HTTP on the bootstrap host, only until the platform's own
# services take over (docs/adr/0001-day0-hypervisors-and-services.md). Pinned by digest;
# hack/check_image_digests.py checks them like the images above.
day0:
  images:
    coredns: docker.io/coredns/coredns:1.14.6@sha256:900f9c109f7a33545d3c811516e8376df9019147b750f5ce3e254468769176ea
    caddy: docker.io/library/caddy:2.11.7@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    # Base of DCiaB's chrony image (images/day0-chrony/Containerfile). Used at build time only.
    chronyBase: docker.io/rockylinux/rockylinux:10-minimal@sha256:f819149e93579b96a7e2fb7286dae4756173de68aafcc78e7e659650c6867b7b
    # DCiaB's chrony image: built from images/day0-chrony and published by CI on main
    # (<chrony version>-<recipe id>); pinned by digest once published, then shipped in the
    # archive like the images above. dciab services never builds it, and refuses an unpinned one.
    chrony: ghcr.io/trevorbenson/dciab-day0-chrony:4.8-2.el10-84e130375818@sha256:b839cb5a5e6c3e5780795b537d2e1cb7a4b4c56a0326df2c9a3c24418e1c8ed0

# The bootstrap appliance ("server zero") and the DCiaB USB it boots from
# (docs/adr/0002-bootstrap-appliance-on-ventoy.md). The appliance image builds on
# nodeImages.bootc's base; its tools are tools.kind, tools.helm and kubernetes.version.
bootstrapAppliance:
  # Pure-Python PyYAML for the appliance installer's disk choice: the installer
  # environment has python3 but not PyYAML. images/usb/build.sh puts it on the stick.
  pyyaml:
    version: "6.0.3"
    url: "https://files.pythonhosted.org/packages/05/8e/961c0007c59b8dd7729d542c61a4d537767a59645b82a0b521206e1e25c2/pyyaml-6.0.3.tar.gz"
    sha256: "d76623373421df22fb4cf8817020cbb7ef15c725b9d5e45f17e189bfc384190f"
  # Installed onto the USB image by images/usb/build.sh.
  ventoy:
    version: "1.1.17"
    url: "https://github.com/ventoy/Ventoy/releases/download/v1.1.17/ventoy-1.1.17-linux.tar.gz"
    sha256: "7fb4ed08cef6a6b4d39dd19260d8c80291a78dfdf9af7d461571e23cbbc43805"
  # sha256 of the linux-amd64 binaries baked into the appliance, for tools.kind,
  # tools.helm and kubernetes.version. Update them together with those versions.
  toolChecksums:
    kind: "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d"
    kubectl: "29818b6729dc9262b692307470d0558d027725e738be5dd47c760261868a2634"
    helm: "d1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983"   # of helm-<version>-linux-amd64.tar.gz

# DCiaB's backup image (images/backup), built by CI. Build time only.
backupImage:
  # Rocky Linux 10 minimal, the same pin as day0.images.chronyBase. The build adds python3 from
  # Rocky's repositories, and the pinned age, rclone, kubectl and clusterctl binaries.
  base: docker.io/rockylinux/rockylinux:10-minimal@sha256:f819149e93579b96a7e2fb7286dae4756173de68aafcc78e7e659650c6867b7b

charts:
  cilium: 1.20.5
  cert-manager: v1.21.3
  longhorn: 1.13.0
  # vSphere cloud provider (CPI), installed on vSphere clusters only. Its releases follow
  # Kubernetes minor versions: bump it with kubernetes.version.
  vsphere-cpi: 1.36.0
  # Approves kubelet serving-certificate CSRs (the classes set serverTLSBootstrap).
  kubelet-csr-approver: 1.2.16

# Array CSI drivers (ADR 0008, decision 4), installed from their upstream release manifests
# at these tags: hack/fetch_crds.py fetches each file (checked against checksums below), the
# archive carries it in payload/providers, and addons/csi applies it with DCiaB's changes.
csiDrivers:
  # The Proxmox CSI plugin: the usual block storage on Proxmox. Needs only an API token.
  proxmox-csi:
    repo: sergelogvinov/proxmox-csi-plugin
    version: v0.22.1
    manifests: [docs/deploy/proxmox-csi-plugin-release.yml]
  # The vSphere CSI driver: the usual choice on vSphere. v3.8 supports Kubernetes 1.34 to 1.36;
  # bump it with kubernetes.version, like the CPI.
  vsphere-csi:
    repo: kubernetes-sigs/vsphere-csi-driver
    version: v3.8.0
    manifests: [manifests/vanilla/vsphere-csi-driver.yaml]

# Where the charts above come from. The archive build (build/archive.py charts) vendors
# each chart listed here. cert-manager is installed from its release manifest instead.
chartRepositories:
  cilium: https://helm.cilium.io
  longhorn: https://charts.longhorn.io
  vsphere-cpi: https://kubernetes.github.io/cloud-provider-vsphere
  kubelet-csr-approver: https://postfinance.github.io/kubelet-csr-approver

# sha256 of each chart .tgz, checked before install and by the archive build. Empty: the
# installer warns and prints the sum to pin; the archive build refuses the chart.
chartDigests:
  cilium: "0c7592eb75179ecf46dd3ec22145916f0164c4401214ea15afb5b230b1d11a21"
  longhorn: "e57f010d2a8bcf0da5b8b03ffecf49c5bc35ddc2663588ce8f22b7567b6133ed"
  vsphere-cpi: "657f29b3409645592a6183c5199bb672dce7bb3b9e3ecbe70df7564d5e722752"
  kubelet-csr-approver: "2058b0f8e78ae1b8bee4a48fb39152bb6be4986486d73592ad2649c6f72cb268"

