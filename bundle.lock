  registry.k8s.io/cluster-api-vsphere/cluster-api-vsphere-controller:v1.17.0: "sha256:1f5a163b32e48e1fcaeee5ddc3e3aa93dc6fcdace85501d9078f014ab516d374"
  registry.k8s.io/cluster-api/cluster-api-controller:v1.14.4: "sha256:ee7b274a4c237d7831840c1a05a950c383f11a1755d3cca6292103cabb00bd26"
  registry.k8s.io/cluster-api/kubeadm-bootstrap-controller:v1.14.4: "sha256:674dd5e666d209c7bdb72525dd3bb40a670c068bd12d610b596b532a84463e62"
  registry.k8s.io/cluster-api/kubeadm-control-plane-controller:v1.14.4: "sha256:49f5cc1a0f9b3f909434e1cccf87d5d868e85e5c9ce849e8ae65ff409458befc"
  registry.k8s.io/coredns/coredns:v1.14.2: "sha256:e7e6440cfd1e919280958f5b5a6ab2b184d385bba774c12ad2a9e1e4183f90d9"
  registry.k8s.io/etcd:3.6.8-0: "sha256:397189418d1a00e500c0605ad18d1baf3b541a1004d768448c367e48071622e5"
  registry.k8s.io/kube-apiserver:v1.36.6: "sha256:c627b6c01a056b30feab4f277aecc0d690afab061f935615c0d67b32e39d7823"
  registry.k8s.io/kube-controller-manager:v1.36.6: "sha256:8548e3b0aa48070c69535a13b5728e337d99176451ddd5656a8d5203dedb937b"
  registry.k8s.io/kube-scheduler:v1.36.6: "sha256:a3f959875bf26c1219e5aa33032c673aee9c394d4bc10a48b9b1ac5e5c819068"
  registry.k8s.io/pause:3.10.2: "sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4"

# sha256 of release binaries DCiaB runs, checked after download. clusterctl's version is
# clusterAPI.core.version. Empty: the download warns and prints the sum to pin.
binarySHA256:
  clusterctl-linux-amd64: "c7301a8515ed329562b06c958463051dd55d9649fac591393f5df54a868fa79b"
  oras-linux-amd64.tar.gz: ""   # tools.oras; build/archive.py binaries --print-sums

tools:
  helm: v4.3.2
  oras: v1.3.6    # copies images into the archive's OCI layout and into the site registry
  kind: v0.33.0   # default node image: Kubernetes v1.37.0 (CAPI v1.14 supports it as a management cluster)

