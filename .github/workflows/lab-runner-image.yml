name: lab runner image

# Builds the lab runner (images/lab-runner) on a GitHub-hosted runner, and publishes it on
# main: the bootc image and its qcow2 disk, both to GHCR, once per tag. The lab then pulls
# the disk (hack/lab/fetch-runner-disk.sh) and only imports it into Proxmox; nothing is built
# on the lab. A pull request builds everything and publishes nothing.
#
# The tag is <VERSION>-<id> (hack/lab/runner-image-id.sh): it changes when the image would.
# After the first publish of a tag, pin its digests in bundle.lock (labRunner.image and
# labRunner.disk), as for the other published images. The packages are private until
# someone makes them public in GitHub's package settings.
on:
  push:
    branches: [main]
    paths:
      - images/lab-runner/**
      - images/node-bootc/**
      - hack/lab/runner-image-id.sh
      - bundle.lock
      - VERSION
      - .github/workflows/lab-runner-image.yml
  pull_request:
    paths:
      - images/lab-runner/**
      - images/node-bootc/**
      - hack/lab/runner-image-id.sh
      - bundle.lock
      - VERSION
      - .github/workflows/lab-runner-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-runner-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: lab runner image and disk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Tag
        id: tag
        run: |
          echo "tag=$(hack/lab/runner-image-id.sh)" >> "$GITHUB_OUTPUT"
          df -h /
      - name: Base image (the SIG recipe, minimal manifest)
        run: sudo images/node-bootc/build.sh --base-only
      - name: Lab runner image and qcow2 disk
        run: sudo images/lab-runner/build.sh --type qcow2
      - name: What was built
        run: |
          set -euo pipefail
          sudo podman images
          out=images/lab-runner/output/qcow2
          sudo chown -R "$(id -u):$(id -g)" images/lab-runner/output images/lab-runner/build
          qemu-img info "$out/disk.qcow2" | sed -n '1,6p'
          (cd "$out" && sha256sum disk.qcow2 | tee disk.qcow2.sha256)
      - name: Publish (main only; each tag once)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/$owner/dciab-lab-runner:$TAG"
          disk="ghcr.io/$owner/dciab-lab-runner-disk:$TAG"
          oras=images/lab-runner/build/bin/oras
          echo "$GH_TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$GH_TOKEN" | "$oras" login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # A tag is published once: bundle.lock pins its digests, so it is never overwritten.
          if skopeo inspect --raw "docker://$image" >/dev/null 2>&1 || "$oras" manifest fetch "$disk" >/dev/null 2>&1; then
            echo "already published: $TAG"; exit 0
          fi
          sudo podman push --digestfile "$RUNNER_TEMP/image.digest" localhost/dciab-lab-runner:$(<VERSION) "docker://$image"
          (cd images/lab-runner/output/qcow2 && "$oras" push --artifact-type application/vnd.dciab.lab-runner.disk \
            "$disk" disk.qcow2:application/x-qemu-disk disk.qcow2.sha256:text/plain) | tee "$RUNNER_TEMP/disk.out"
          disk_digest="$(sed -n 's/^Digest: //p' "$RUNNER_TEMP/disk.out")"
          {
            echo "### Published $TAG"
            echo "- image: \`$image@$(cat "$RUNNER_TEMP/image.digest")\`"
            echo "- disk: \`$disk@$disk_digest\`"
            echo "- pin both in bundle.lock (labRunner.image, labRunner.disk), and make the packages public so the lab can pull without a login"
            echo "- fetch: \`hack/lab/fetch-runner-disk.sh $TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
