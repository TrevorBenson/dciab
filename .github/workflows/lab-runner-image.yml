name: lab runner image

# Builds the lab runner (images/lab-runner) on the self-hosted lab runner and publishes it:
# the bootc image and its qcow2 disk, both to GHCR, once per tag. A hosted Ubuntu runner can't
# build the base (the SIG recipe's nested rpm-ostree compose fails there with
# "groupadd: cannot open /etc/gshadow: Permission denied"); the runner is Rocky 10 with
# SELinux, as the recipe expects. The very first runner VM was built by hand on the
# workstation (task 0011); this workflow builds every later one.
#
# Because the job-started hook refuses pull requests and other branches, this runs only on
# a push to main or a dispatch of main. A change to the image is checked by building it
# locally (images/lab-runner/build.sh) before merging; the merge then builds and publishes.
#
# The tag is <VERSION>-<id> (hack/lab/runner-image-id.sh): it changes when the image would.
# After the first publish of a tag, pin its digests in bundle.lock (labRunner.image and
# labRunner.disk), as for the other published images. The packages are private until
# someone makes them public in GitHub's package settings.
on:
  push:
    branches: [main]
    paths:
      - images/lab-runner/**
      - images/node-bootc/**
      - hack/lab/runner-image-id.sh
      - bundle.lock
      - VERSION
      - .github/workflows/lab-runner-image.yml
  workflow_dispatch:

permissions:
  contents: read

# One lab, one set of fixed addresses, shared with hand runs: the lab concurrency group.
concurrency:
  group: dciab-lab
  cancel-in-progress: false

jobs:
  image:
    name: lab runner image and disk
    runs-on: [self-hosted, dciab-lab]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Tag
        id: tag
        run: |
          echo "tag=$(hack/lab/runner-image-id.sh)" >> "$GITHUB_OUTPUT"
          df -h /
      - name: Base image (the SIG recipe, minimal manifest)
        run: sudo images/node-bootc/build.sh --base-only
      - name: Lab runner image and qcow2 disk
        run: sudo images/lab-runner/build.sh --type qcow2
      - name: What was built
        run: |
          set -euo pipefail
          sudo podman images
          out=images/lab-runner/output/qcow2
          sudo chown -R "$(id -u):$(id -g)" images/lab-runner/output images/lab-runner/build
          qemu-img info "$out/disk.qcow2" | sed -n '1,6p'
          (cd "$out" && sha256sum disk.qcow2 | tee disk.qcow2.sha256)
      - name: Publish (main only; each tag once)
        if: github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/$owner/dciab-lab-runner:$TAG"
          disk="ghcr.io/$owner/dciab-lab-runner-disk:$TAG"
          oras=oras   # in the runner image (/usr/bin)
          echo "$GH_TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$GH_TOKEN" | "$oras" login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # The Rocky bootc base (the SIG recipe), once per recipe commit and manifest. Hosted
          # runners can't build it, but they can pull it: pin the digest as
          # nodeImages.bootc.baseImage and every other build (and pull request job) uses it.
          read -r manifest commit < <(python3 -c 'import yaml;b=yaml.safe_load(open("bundle.lock"))["nodeImages"]["bootc"];print(b["manifest"],b["sigRecipe"]["commit"][:12])')
          base="ghcr.io/$owner/dciab-rocky-bootc-base:$manifest-$commit"
          base_note="base: already published \`$base\`"
          if ! skopeo inspect --raw "docker://$base" >/dev/null 2>&1; then
            sudo podman push --digestfile "$RUNNER_TEMP/base.digest" "localhost/dciab-rocky-bootc-base:$manifest" "docker://$base"
            base_note="base: \`$base@$(cat "$RUNNER_TEMP/base.digest")\` (pin as nodeImages.bootc.baseImage)"
          fi
          echo "- $base_note" >> "$GITHUB_STEP_SUMMARY"
          # A tag is published once per artifact: bundle.lock pins its digests, so a published
          # tag is never overwritten. Each artifact is checked on its own, so a run that
          # stopped after the image still pushes the disk.
          if skopeo inspect --raw "docker://$image" >/dev/null 2>&1; then
            image_digest="$(skopeo inspect --format '{{.Digest}}' "docker://$image")"
            echo "image already published: $TAG"
          else
            sudo podman push --digestfile "$RUNNER_TEMP/image.digest" "localhost/dciab-lab-runner:$(<VERSION)" "docker://$image"
            image_digest="$(cat "$RUNNER_TEMP/image.digest")"
          fi
          if "$oras" manifest fetch "$disk" >/dev/null 2>&1; then
            disk_digest="$("$oras" manifest fetch --descriptor "$disk" | python3 -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
            echo "disk already published: $TAG"
          else
            (cd images/lab-runner/output/qcow2 && "$oras" push --artifact-type application/vnd.dciab.lab-runner.disk \
              "$disk" disk.qcow2:application/x-qemu-disk disk.qcow2.sha256:text/plain) | tee "$RUNNER_TEMP/disk.out"
            disk_digest="$(sed -n 's/^Digest: //p' "$RUNNER_TEMP/disk.out")"
          fi
          {
            echo "### Published $TAG"
            echo "- image: \`$image@$image_digest\`"
            echo "- disk: \`$disk@$disk_digest\`"
            echo "- pin both in bundle.lock (labRunner.image, labRunner.disk), and make the packages public so the lab can pull without a login"
            echo "- fetch: \`hack/lab/fetch-runner-disk.sh $TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
