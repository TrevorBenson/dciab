name: dciab hypervisors on emulated bare servers

# dciab services, then dciab hypervisors against a VM behind a Redfish BMC emulator (sushy-tools
# in front of libvirt), on a GitHub-hosted runner with KVM: real Proxmox VE installs from the
# per-host ISO, the reinstall guard, Redfish preparation, post-install through the real Proxmox
# VE API, in both node network modes (an access port, and the node VLAN tagged only).
# hack/e2e/hypervisors/README.md says what each scenario proves and what an emulator can't.
on:
  pull_request:
    paths:
      - lib/dciab_hypervisors/**
      - lib/dciab_services/**
      - lib/dciab_validate/**
      - lib/steps/services.sh
      - hack/e2e/hypervisors/**
      - images/pve-assistant/**
      - images/day0-chrony/**
      - examples/proxmox-bare.yaml
      - schema/**
      - dciab
      - bundle.lock
      - .github/workflows/hypervisors-emulated.yml
  push:
    branches: [main]
    paths:
      - lib/dciab_hypervisors/**
      - lib/dciab_services/**
      - lib/dciab_validate/**
      - lib/steps/services.sh
      - hack/e2e/hypervisors/**
      - images/pve-assistant/**
      - images/day0-chrony/**
      - examples/proxmox-bare.yaml
      - schema/**
      - dciab
      - bundle.lock
      - .github/workflows/hypervisors-emulated.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hypervisors-emulated-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # A newer push to a PR replaces its run. Every other run (main, a dispatch) gets a group of its
  # own, so post-merge proofs never queue behind or cancel each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  emulated:
    name: emulated bare server (${{ matrix.leg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Each leg is its own runner with its own installs (run.py SCENARIOS); the untagged mode
        # is split in two so its two installs no longer run one after the other.
        include:
          - {leg: untagged-install, mode: untagged}
          - {leg: untagged-reinstall, mode: untagged}
          - {leg: tagged, mode: tagged}
    env:
      WORK: ${{ github.workspace }}/../emulator
      DCIAB_LEG: ${{ matrix.leg }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dockerhub-mirror
      - name: KVM, libvirt, OVMF
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils libvirt-daemon-system \
            libvirt-clients ovmf python3-libvirt python3-yaml python3-jsonschema python3-pip python3-venv dnsutils
          ls -l /dev/kvm
          free -g
          df -h "$GITHUB_WORKSPACE"
      - name: Proxmox VE installer ISO (bundle.lock)
        id: iso
        run: |
          set -euo pipefail
          read -r url sha < <(python3 -c 'import yaml; p = yaml.safe_load(open("bundle.lock"))["hypervisors"]["proxmox"]; print(p["isoURL"], p["isoSHA256"])')
          echo "name=$(basename "$url")" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # The ISO (about 1.7 GB) is cached from main only: PRs restore it, never save a copy of their own.
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/isos
          key: proxmox-iso-${{ steps.iso.outputs.sha }}
      - name: Download and check the ISO
        env:
          URL: ${{ steps.iso.outputs.url }}
          SHA: ${{ steps.iso.outputs.sha }}
          NAME: ${{ steps.iso.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/isos" "$WORK/isos"
          [ -f "$RUNNER_TEMP/isos/$NAME" ] || curl -fsSL --retry 3 -o "$RUNNER_TEMP/isos/$NAME" "$URL"
          echo "$SHA  $RUNNER_TEMP/isos/$NAME" | sha256sum -c -
          cp "$RUNNER_TEMP/isos/$NAME" "$WORK/isos/$NAME"
      - uses: actions/cache/save@v4
        if: github.event_name != 'pull_request' && matrix.leg == 'untagged-install'
        continue-on-error: true    # already saved (the key exists): nothing to do
        with:
          path: ${{ runner.temp }}/isos
          key: proxmox-iso-${{ steps.iso.outputs.sha }}
      - name: This branch's chrony and proxmox-auto-install-assistant images (root's podman)
        run: |
          set -euo pipefail
          echo "DCIAB_CHRONY_IMAGE=$(sudo images/day0-chrony/build.sh)" >> "$GITHUB_ENV"
          echo "DCIAB_PVE_ASSISTANT_IMAGE=$(sudo images/pve-assistant/build.sh)" >> "$GITHUB_ENV"
      - name: Emulated server, switch and BMC
        run: sudo hack/e2e/hypervisors/setup.sh "${{ matrix.mode }}" "$WORK"
      - name: Scenarios
        run: |
          sudo env "DCIAB_CHRONY_IMAGE=$DCIAB_CHRONY_IMAGE" "DCIAB_PVE_ASSISTANT_IMAGE=$DCIAB_PVE_ASSISTANT_IMAGE" \
            "DCIAB_LEG=$DCIAB_LEG" python3 hack/e2e/hypervisors/run.py "$WORK"
      - name: Report
        if: always()
        run: |
          set +e
          sudo python3 - "$WORK/report.json" 2> "$RUNNER_TEMP/annotations" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          try:
              r = json.load(open(sys.argv[1]))
          except OSError:
              print("no report.json"); sys.exit(0)
          cell = lambda v: str(v).replace("|", "\\|").replace("\n", " ")
          # Workflow-command escaping (not markdown): data, and properties such as title.
          esc = lambda v: str(v).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          prop = lambda v: esc(v).replace(":", "%3A").replace(",", "%2C")
          print(f"### {r.get('leg', r['mode'])}: {'passed' if r['passed'] else 'FAILED'}\n")
          print("| Scenario | Result | Seconds | Failing assertion or details |\n| --- | --- | --- | --- |")
          for s in r["scenarios"]:
              mark = "pass" if s["result"] == "pass" else "**FAIL**"
              print(f"| {s['name']} | {mark} | {s.get('seconds', '')} | {cell(s.get('error') or json.dumps(s.get('details', {})))} |")
              if s["result"] != "pass":   # an annotation on the run page, no log reading needed
                  print(f"::error title={prop('emulated ' + r.get('leg', r['mode']) + ': ' + s['name'])}::{esc(s.get('error', ''))}", file=sys.stderr)
          if r.get("error"):
              print(f"\n{cell(r['error'])}")
              print(f"::error title={prop('emulated ' + r.get('leg', r['mode']) + ': setup')}::{esc(r['error'])}", file=sys.stderr)
          PY
          # Workflow commands are read from the step's output: the annotations go there, the table to the summary.
          grep '^::error' "$RUNNER_TEMP/annotations" || true
          # Anything else on stderr (a traceback from the report itself) still reaches the log.
          grep -v '^::error' "$RUNNER_TEMP/annotations" >&2 || true
      - name: Diagnostics
        if: always()
        run: |
          set +e
          d="$RUNNER_TEMP/diag"
          mkdir -p "$d"
          sudo virsh -c qemu:///system screenshot pve01 "$d/pve01-screen.ppm" >/dev/null 2>&1
          sudo virsh -c qemu:///system dumpxml pve01 > "$d/pve01.xml" 2>&1
          sudo virsh -c qemu:///system domstate --reason pve01 > "$d/pve01-state.txt" 2>&1
          sudo bridge vlan show > "$d/bridge-vlans.txt" 2>&1
          sudo cp "$WORK/report.json" "$WORK/sushy.log" "$WORK/pve01-serial.log" "$d/" 2>/dev/null
          sudo cp -r "$WORK/logs" "$d/" 2>/dev/null
          sudo podman pod ps > "$d/pods.txt" 2>&1
          for c in coredns chrony-1 chrony-2 caddy; do sudo podman logs "dciab-services-$c" > "$d/$c.log" 2>&1; done
          sudo find "$WORK/site/.dciab/state" -name '*.json' -path '*installs*' -exec cp {} "$d/" \; 2>/dev/null
          sudo chown -R "$(id -u):$(id -g)" "$d"
          # Artifacts aren't always reachable: the tails go into the job log too.
          echo "::group::sushy-emulator log (tail)"; tail -n 150 "$d/sushy.log"; echo "::endgroup::"
          echo "::group::pve01 serial console (tail)"; tail -n 80 "$d/pve01-serial.log"; echo "::endgroup::"
          echo "::group::caddy log (tail)"; tail -n 40 "$d/caddy.log"; echo "::endgroup::"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hypervisors-emulated-${{ matrix.leg }}
          path: ${{ runner.temp }}/diag
          retention-days: 14
