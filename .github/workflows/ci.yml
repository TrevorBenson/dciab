name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR cancels its older run. Every other run (main, the post-merge proof) gets a
# group of its own, so main runs never queue behind or cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Python 3.12 is the floor: Rocky Linux 10's python3 (the bootstrap host's OS, ADR 0002).
    # The rocky10 job below also runs the validator on that distro's own Python.
    name: tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: .cache/crds
          key: crds-${{ hashFiles('bundle.lock') }}
      - name: Fetch the CRDs pinned in bundle.lock
        run: python hack/fetch_crds.py
      - run: python -m pytest -n auto -v
      - name: Schema is valid JSON Schema 2020-12
        run: python -c "import json; from jsonschema import Draft202012Validator as V; V.check_schema(json.load(open('schema/dciab.schema.json')))"
      - name: docs/CONFIG.md matches the schema, and every schema key has a description
        run: |
          python hack/gen_config_docs.py --check
          python -m pytest -q tests/test_config_docs.py

  charts:
    name: charts (helm render + CRD checks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Read the Helm version from bundle.lock
        id: lock
        run: echo "helm=$(python -c "import yaml; print(yaml.safe_load(open('bundle.lock'))['tools']['helm'])")" >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@v4
        with:
          version: ${{ steps.lock.outputs.helm }}
      - uses: actions/cache@v4
        with:
          path: .cache/crds
          key: crds-${{ hashFiles('bundle.lock') }}
      - name: Fetch the CRDs pinned in bundle.lock
        run: echo "CRDS=$(python hack/fetch_crds.py)" >> "$GITHUB_ENV"
      - name: Lint
        run: |
          set -euo pipefail
          helm lint charts/capi-clusterclasses
          for values in charts/capi-cluster/ci/*-values.yaml; do
            helm lint charts/capi-cluster --values "$values"
          done
      - name: Rendered objects carry helm.sh/resource-policy=keep
        run: python -m pytest -v tests/test_clusterclasses.py tests/test_cluster_values.py -k kept_by_helm
      - name: Render and check every CI cluster against the classes
        run: |
          set -euo pipefail
          mkdir -p out
          helm template classes charts/capi-clusterclasses --namespace dciab-clusterclasses > out/classes.yaml
          for values in charts/capi-cluster/ci/*-values.yaml; do
            name="$(basename "$values" -values.yaml)"
            helm template "$name" charts/capi-cluster --namespace "cluster-$name" --values "$values" > "out/$name.yaml"
            echo "== $name"
            python hack/check_manifests.py --crds "$CRDS" --expect Cluster=1 --expect ClusterClass=3 \
              out/classes.yaml:dciab-clusterclasses "out/$name.yaml:cluster-$name"
          done
      - name: Render Cilium and kubelet-csr-approver for every CI cluster
        run: |
          set -euo pipefail
          for values in charts/capi-cluster/ci/*-values.yaml; do
            addons/cilium/install.sh "$values" --template > /dev/null
            echo "ok: cilium renders for $values"
            addons/kubelet-csr-approver/install.sh "$values" --template > /dev/null
            echo "ok: kubelet-csr-approver renders for $values"
          done
      - name: MGMT gets no block storage; INFRA's renders, and MGMT's with overrides.mgmt
        env:
          DCIAB_PVE_CSI_TOKEN: placeholder
        run: |
          set -euo pipefail
          # ADR 0008, decision 4a: no example gives MGMT block storage, so dciab mgmt's
          # storage step installs nothing there.
          for config in examples/*.yaml; do
            provider="$(PYTHONPATH=lib python3 -m dciab_storage provider "$config" mgmt)"
            [[ "$provider" == none ]] || { echo "$config: MGMT gets block storage $provider" >&2; exit 1; }
            provider="$(PYTHONPATH=lib python3 -m dciab_storage provider "$config" infra)"
            case "$provider" in
              # metal3's INFRA backs up to the object store, which isn't built yet; its
              # workload clusters' Longhorn renders below (--images) and in the inventory.
              longhorn) [[ "$config" == *metal3* ]] || addons/longhorn/install.sh "$config" --template --cluster infra > /dev/null ;;
              *-csi) addons/csi/install.sh "$config" infra --template > /dev/null ;;
            esac
            echo "ok: MGMT none, INFRA $provider for $config"
          done
          # overrides.mgmt, written in full, gives MGMT block storage: block's provider and settings here.
          for name in proxmox proxmox-bare; do
            python3 - "examples/$name.yaml" "$RUNNER_TEMP/$name-mgmt.yaml" <<'PY'
          import copy, sys, yaml
          doc = yaml.safe_load(open(sys.argv[1]))
          block = doc["spec"]["storage"]["block"]
          key = {"proxmox-csi": "proxmoxCSI", "longhorn": "longhorn"}[block["provider"]]
          block["overrides"] = {"mgmt": {"provider": block["provider"], key: copy.deepcopy(block[key])}}
          yaml.safe_dump(doc, open(sys.argv[2], "w"), sort_keys=False)
          PY
          done
          addons/csi/install.sh "$RUNNER_TEMP/proxmox-mgmt.yaml" mgmt --template > /dev/null
          addons/longhorn/install.sh "$RUNNER_TEMP/proxmox-bare-mgmt.yaml" --template --cluster mgmt > /dev/null
          echo "ok: overrides.mgmt renders proxmox-csi and longhorn on MGMT"
          addons/longhorn/install.sh examples/metal3-cluster.yaml --images --cluster metal01
      - name: Render the vSphere CPI
        run: addons/vsphere-cpi/install.sh examples/vsphere.yaml --template > /dev/null
      - name: Nothing dciab mgmt installs on MGMT asks for a volume (ADR 0008, decision 4a)
        run: |
          set -euo pipefail
          # Everything but block storage, which MGMT gets only with overrides.mgmt: the
          # ClusterClasses and the mgmt cluster (rendered above), Cilium, kubelet-csr-approver,
          # the vSphere CPI, cert-manager, Cluster API and its providers. The backup CronJobs
          # are checked in tests/test_mgmt_no_volumes.py.
          mgmt="$RUNNER_TEMP/mgmt-installs"
          mkdir -p "$mgmt"
          for values in charts/capi-cluster/ci/*-values.yaml; do
            name="$(basename "$values" -values.yaml)"
            addons/cilium/install.sh "$values" --template > "$mgmt/cilium-$name.yaml"
            addons/kubelet-csr-approver/install.sh "$values" --template > "$mgmt/kubelet-csr-approver-$name.yaml"
          done
          addons/vsphere-cpi/install.sh examples/vsphere.yaml --template > "$mgmt/vsphere-cpi.yaml"
          python hack/check_no_volumes.py out "$mgmt" "$CRDS"/cert-manager-*/cert-manager.yaml \
            "$CRDS"/baremetal-operator-*/ "$CRDS"/cluster-api-*/ "$CRDS"/infrastructure-*/ "$CRDS"/ipam-*/
      - name: Bad values fail the render, with the expected message
        run: |
          set -uo pipefail
          # expect_fail <what> <message the error must contain> <command...>
          expect_fail() {
            local what="$1" want="$2"; shift 2
            if "$@" > /dev/null 2> out/err.txt; then
              echo "FAIL: $what should have been rejected"; exit 1
            fi
            if ! grep -qF -- "$want" out/err.txt; then
              echo "FAIL: $what was rejected, but not with \"$want\":"; cat out/err.txt; exit 1
            fi
            echo "ok: $what -> $want"
          }
          cat > out/dup-pools.yaml <<'YAML'
          workerPools:
            - {name: general, replicas: 1, machine: {cpu: 4, memoryGiB: 8, diskGiB: 40}}
            - {name: general, replicas: 2, machine: {cpu: 4, memoryGiB: 8, diskGiB: 40}}
          YAML
          expect_fail "no values" "values don't meet the specifications of the schema" \
            helm template bad charts/capi-cluster
          expect_fail "duplicate pool names" 'the name "general" is used more than once' \
            helm template bad charts/capi-cluster -f charts/capi-cluster/ci/vsphere-values.yaml -f out/dup-pools.yaml
          expect_fail "templateNode outside allowedNodes" 'proxmox.templateNode "pve09" must be one of' \
            helm template bad charts/capi-cluster -f charts/capi-cluster/ci/proxmox-values.yaml --set proxmox.templateNode=pve09
          expect_fail "IPv4 octet over 255" "apiVIP" \
            helm template bad charts/capi-cluster -f charts/capi-cluster/ci/vsphere-values.yaml --set apiVIP=10.20.110.300
          expect_fail "a label the chart sets" '"dciab.io/class" is set by the chart' \
            helm template bad charts/capi-cluster -f charts/capi-cluster/ci/vsphere-values.yaml --set 'labels.dciab\.io/class=other'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-manifests
          path: out/

  clusterclass-e2e:
    # CAPI's own topology controller applies the class patches to every CI cluster on a
    # kind cluster. No VM or server is built: the example infrastructure doesn't exist.
    name: ClusterClass e2e (kind + CAPI, no infrastructure)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Read tool versions from bundle.lock
        id: lock
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          lock = yaml.safe_load(open("bundle.lock"))
          print(f"helm={lock['tools']['helm']}")
          print(f"kind={lock['tools']['kind']}")
          print(f"capi={lock['clusterAPI']['core']['version']}")
          print(f"clusterctl_sha256={lock['binarySHA256']['clusterctl-linux-amd64']}")
          PY
      - uses: azure/setup-helm@v4
        with:
          version: ${{ steps.lock.outputs.helm }}
      - uses: helm/kind-action@v1
        with:
          version: ${{ steps.lock.outputs.kind }}
          cluster_name: dciab-e2e
      - uses: actions/cache@v4
        with:
          path: .cache/crds
          key: crds-${{ hashFiles('bundle.lock') }}
      - run: hack/e2e/run.sh
      - name: clusterctl (same version as Cluster API, sha256 from bundle.lock)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          bin="$RUNNER_TEMP/bin/clusterctl"
          curl -fsSL -o "$bin" \
            "https://github.com/kubernetes-sigs/cluster-api/releases/download/${{ steps.lock.outputs.capi }}/clusterctl-linux-amd64"
          want="${{ steps.lock.outputs.clusterctl_sha256 }}"
          got="$(sha256sum "$bin" | cut -d' ' -f1)"
          if [[ -z "$want" ]]; then
            echo "::warning::bundle.lock has no binarySHA256.clusterctl-linux-amd64; this download is $got"
          elif [[ "$got" != "$want" ]]; then
            echo "clusterctl sha256 is $got, bundle.lock pins $want" >&2; exit 1
          fi
          chmod +x "$bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$bin" version -o short
      - name: dciab mgmt up to the Cluster (the example infrastructure doesn't exist)
        run: |
          set -euo pipefail
          site="$(mktemp -d)"
          cp examples/proxmox.yaml "$site/dciab.yaml"
          for s in vsphere.pw longhorn-s3.env pki/intermediate.key; do
            mkdir -p "$(dirname "$site/secrets/$s")"; echo placeholder > "$site/secrets/$s"
          done
          printf -- '-----BEGIN CERTIFICATE-----\nMIIBe2eCertificateOnly\n-----END CERTIFICATE-----\n' > "$site/secrets/pki/chain.pem"
          # validate reads the imported intermediate, so it must be a real CA certificate.
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout /dev/null -subj /CN=dciab-ci -days 3650 -addext basicConstraints=critical,CA:TRUE -out "$site/secrets/pki/intermediate.crt" 2>/dev/null
          chmod -R go-rwx "$site/secrets"
          kind get kubeconfig --name dciab-e2e > "$site/bootstrap.kubeconfig"
          export DCIAB_PVE_TOKEN=placeholder DCIAB_PVE_CSI_TOKEN=placeholder
          ./dciab mgmt "$site/dciab.yaml" --bootstrap-kubeconfig "$site/bootstrap.kubeconfig" --until cluster
          # Re-running changes nothing.
          ./dciab mgmt "$site/dciab.yaml" --bootstrap-kubeconfig "$site/bootstrap.kubeconfig" --until cluster
          kubectl -n cluster-mgmt wait cluster/mgmt --for=condition=TopologyReconciled --timeout=5m
          kubectl -n cluster-mgmt get cluster,kubeadmcontrolplane,secret -o wide
      - name: The storage step leaves a cluster without overrides.mgmt untouched (ADR 0008, decision 4a)
        run: |
          set -euo pipefail
          # The example gives MGMT no block storage. dciab mgmt's storage step, run here against
          # the kind cluster as a stand-in for MGMT, must install no driver and apply no
          # StorageClass or PVC; kind's own StorageClass stays the only one.
          kind get kubeconfig --name dciab-e2e > "$RUNNER_TEMP/kind.kubeconfig"
          before="$(kubectl get storageclass,pvc -A -o name | sort)"
          out="$(lib/steps/block-storage.sh examples/proxmox.yaml mgmt "$RUNNER_TEMP/kind.kubeconfig")"
          echo "$out"
          grep -q "^block storage: none$" <<<"$out"
          grep -q "no Longhorn, no CSI driver and no StorageClass on mgmt" <<<"$out"
          after="$(kubectl get storageclass,pvc -A -o name | sort)"
          [[ "$before" == "$after" ]] || { echo "the storage step changed StorageClasses or PVCs:"; diff <(echo "$before") <(echo "$after"); exit 1; }
          [[ -z "$(kubectl get storageclass -l app.kubernetes.io/managed-by=dciab -o name)" ]]
          ! kubectl get namespace longhorn-system csi-proxmox vmware-system-csi 2>/dev/null | grep -q Active
      - name: Nothing dciab mgmt installed on the kind cluster asks for a volume (ADR 0008, decision 4a)
        run: |
          set -euo pipefail
          # What is really there after dciab mgmt (the providers and the mgmt release), read
          # back from the cluster; Secrets hold no volumes and are left out. kind's own
          # StorageClass and local-path provisioner aren't DCiaB's.
          kubectl get "$(kubectl api-resources --verbs=list --namespaced=true -o name \
              | grep -vE '^(events|events.events.k8s.io|secrets)$' | paste -sd, -)" -A -o yaml > "$RUNNER_TEMP/live-namespaced.yaml"
          kubectl get storageclass,persistentvolume -o yaml > "$RUNNER_TEMP/live-cluster.yaml"
          python hack/check_no_volumes.py --ignore StorageClass/standard --ignore-namespace local-path-storage \
            "$RUNNER_TEMP/live-namespaced.yaml" "$RUNNER_TEMP/live-cluster.yaml"

  archive-inventory:
    # Every image a site needs, then a small archive payload built from it (build/archive.py).
    name: archive image inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dockerhub-mirror
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Read versions from bundle.lock
        id: lock
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          lock = yaml.safe_load(open("bundle.lock"))
          print(f"helm={lock['tools']['helm']}")
          print(f"k8s={lock['kubernetes']['version']}")
          PY
      - uses: azure/setup-helm@v4
        with:
          version: ${{ steps.lock.outputs.helm }}
      - uses: actions/cache@v4
        with:
          path: .cache/crds
          key: crds-${{ hashFiles('bundle.lock') }}
      - name: kubeadm (checksum from dl.k8s.io; used only to list images)
        env:
          K8S: ${{ steps.lock.outputs.k8s }}
        run: |
          set -euo pipefail
          [[ "$K8S" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad kubernetes.version: $K8S" >&2; exit 1; }
          cd "$RUNNER_TEMP"
          curl -fsSL --connect-timeout 20 --max-time 300 -O "https://dl.k8s.io/release/$K8S/bin/linux/amd64/kubeadm"
          echo "$(curl -fsSL --connect-timeout 20 --max-time 60 "https://dl.k8s.io/release/$K8S/bin/linux/amd64/kubeadm.sha256")  kubeadm" | sha256sum -c -
          chmod +x kubeadm
      - name: Inventory
        env:
          K8S: ${{ steps.lock.outputs.k8s }}
        run: |
          set -euo pipefail
          crds="$(python3 hack/fetch_crds.py)"
          addons/cilium/install.sh charts/capi-cluster/ci/proxmox-values.yaml --template > "$RUNNER_TEMP/cilium.yaml"
          addons/kubelet-csr-approver/install.sh charts/capi-cluster/ci/proxmox-values.yaml --template > "$RUNNER_TEMP/kubelet-csr-approver.yaml"
          # Longhorn's manager starts most of its images itself: list them from the chart values too.
          # The metal3 example's workload clusters run Longhorn (MGMT keeps no volumes).
          addons/longhorn/install.sh examples/metal3-cluster.yaml --template --cluster metal01 > "$RUNNER_TEMP/longhorn.yaml"
          addons/longhorn/install.sh examples/metal3-cluster.yaml --images --cluster metal01 > "$RUNNER_TEMP/longhorn-images.txt"
          addons/vsphere-cpi/install.sh examples/vsphere.yaml --template > "$RUNNER_TEMP/vsphere-cpi.yaml"
          mapfile -t longhorn < "$RUNNER_TEMP/longhorn-images.txt"
          (( ${#longhorn[@]} > 0 )) || { echo "no Longhorn images listed" >&2; exit 1; }
          "$RUNNER_TEMP/kubeadm" config images list --kubernetes-version "$K8S" > "$RUNNER_TEMP/kubeadm.txt"
          args=(--manifests "$crds" --extra "$RUNNER_TEMP/cilium.yaml" --extra "$RUNNER_TEMP/longhorn.yaml"
                --extra "$RUNNER_TEMP/vsphere-cpi.yaml"
                --extra "$RUNNER_TEMP/kubelet-csr-approver.yaml"
                --kubeadm-images "$RUNNER_TEMP/kubeadm.txt")
          for ref in "${longhorn[@]}"; do args+=(--image "$ref=longhorn chart values"); done
          python3 build/inventory.py "${args[@]}"
          python3 build/inventory.py "${args[@]}" --format yaml > images.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: image-inventory
          path: images.yaml
      - name: Pins to review (imageDigests lines for unpinned images; every binary's sha256)
        run: |
          python3 build/archive.py digests --inventory images.yaml
          python3 build/archive.py binaries --out "$RUNNER_TEMP/sums" --print-sums
          python3 build/package.py tools --out "$RUNNER_TEMP/sums" --print-sums
      - name: Archive payload (two small images, every chart, provider manifests, binaries, SBOMs)
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/payload"
          python3 build/archive.py binaries --out "$out"
          python3 build/archive.py images --inventory images.yaml --out "$out" --oras "$out/bin/oras" \
            --only registry.k8s.io/pause --only ghcr.io/kube-vip/kube-vip
          python3 build/archive.py charts --out "$out"
          python3 build/archive.py providers --out "$out" --manifests "$(python3 hack/fetch_crds.py)"
          # Node disks: pulled and checked when bundle.lock pins them; skipped (noted) until then.
          python3 build/archive.py nodes --out "$out" --oras "$out/bin/oras"
          python3 build/package.py tools --out "$RUNNER_TEMP/build"
          python3 build/package.py sboms --payload "$out" --syft "$RUNNER_TEMP/build/tools/syft"
          python3 build/archive.py sums --out "$out"
          du -sh "$out"/*
      - name: Package, sign with a throwaway key, verify
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/payload" cosign="$RUNNER_TEMP/payload/bin/cosign" keys="$RUNNER_TEMP/keys"
          mkdir -p "$keys"
          COSIGN_PASSWORD="$(openssl rand -hex 16)"
          export COSIGN_PASSWORD
          (cd "$keys" && "$cosign" generate-key-pair)
          python3 build/package.py package --payload "$out" --out "$RUNNER_TEMP/dist" \
            --signing-key "$keys/cosign.key" --cosign "$cosign"
          tar="$(ls "$RUNNER_TEMP"/dist/dciab-*.tar)"
          ls -l "$tar"; du -h "$tar"
          ./dciab verify-archive --key "$keys/cosign.pub" --cosign "$cosign" "$tar"
          mkdir "$RUNNER_TEMP/site" && tar -C "$RUNNER_TEMP/site" -xf "$tar"
          site="$(ls -d "$RUNNER_TEMP"/site/dciab-*)"
          "$site/dciab" verify-archive --key "$keys/cosign.pub" --cosign "$cosign"
          (cd "$site" && sha256sum --quiet -c MANIFEST)
          # A changed file fails the check.
          echo tampered >> "$site/README.md"
          if "$site/dciab" verify-archive --key "$keys/cosign.pub" --cosign "$cosign"; then
            echo "FAIL: a tampered archive verified" >&2; exit 1
          fi
          # Unsigned, the same inputs give the same tar byte for byte.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python3 build/package.py package --payload "$out" --out "$RUNNER_TEMP/r1"
          python3 build/package.py package --payload "$out" --out "$RUNNER_TEMP/r2"
          cmp "$RUNNER_TEMP"/r1/dciab-*.tar "$RUNNER_TEMP"/r2/dciab-*.tar

  seed-e2e:
    # dciab seed for real: a payload (CoreDNS, Zot, the kind node image, the provider images and
    # manifests, the binaries), then seed DNS, the seed registry and kind built from it alone.
    name: dciab seed (DNS + Zot + kind from a payload)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dockerhub-mirror
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - run: sudo apt-get update -q && sudo apt-get install -y -q dnsutils
      - name: Payload
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/payload"
          crds="$(python3 hack/fetch_crds.py)"
          python3 build/inventory.py --manifests "$crds" --format yaml > "$RUNNER_TEMP/images.yaml"
          python3 build/archive.py binaries --out "$out"
          python3 build/archive.py images --inventory "$RUNNER_TEMP/images.yaml" --out "$out" --oras "$out/bin/oras" \
            --only coredns/coredns --only project-zot --only kindest/node --only jetstack --only registry.k8s.io/cluster-api \
            --only capi-ipam --only ionos-cloud --only metal3-io
          python3 build/archive.py providers --out "$out" --manifests "$crds"
          python3 build/archive.py charts --out "$out"
          python3 build/archive.py sums --out "$out"
          du -sh "$out"/*
      - name: Site config, age identities, and the bootstrap address on a dummy interface
        run: |
          set -euo pipefail
          sudo ip link add dciab0 type dummy
          sudo ip link set dciab0 up
          sudo ip addr add 10.30.110.5/32 dev dciab0
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          keygen="$RUNNER_TEMP/payload/bin/age-keygen"
          "$keygen" -o "$site/id1.txt" 2>/dev/null
          "$keygen" -o "$site/id2.txt" 2>/dev/null
          python3 - "$site" <<'PY'
          import subprocess, sys, yaml
          site = sys.argv[1]
          keygen = site.replace("site", "payload") + "/bin/age-keygen"
          cfg = yaml.safe_load(open("examples/proxmox.yaml"))
          cfg["spec"]["bootstrap"]["recipients"] = [
              subprocess.run([keygen, "-y", f"{site}/id{i}.txt"], check=True, capture_output=True, text=True).stdout.strip()
              for i in (1, 2)]
          cfg["spec"]["pki"] = {"mode": "generate-root", "commonName": "CI Platform Root CA"}
          cfg["spec"]["bootstrap"]["interface"] = "dciab0"   # seed's dns step adds the DNS service IPs to it
          yaml.safe_dump(cfg, open(f"{site}/dciab.yaml", "w"), sort_keys=False)
          PY
      - name: dciab seed
        env:
          DCIAB_PVE_TOKEN: ci-not-a-secret
          DCIAB_PVE_CSI_TOKEN: ci-not-a-secret
        run: |
          sudo env "PATH=$PATH" "DCIAB_PVE_TOKEN=$DCIAB_PVE_TOKEN" "DCIAB_PVE_CSI_TOKEN=$DCIAB_PVE_CSI_TOKEN" ./dciab seed "$RUNNER_TEMP/site/dciab.yaml" \
            --payload "$RUNNER_TEMP/payload" --state "$RUNNER_TEMP/state"
      - name: Check the result, then rerun (must change nothing)
        env:
          DCIAB_PVE_TOKEN: ci-not-a-secret
          DCIAB_PVE_CSI_TOKEN: ci-not-a-secret
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/state"
          kc="$state/bootstrap.kubeconfig"
          sudo "$RUNNER_TEMP/payload/bin/kubectl" --kubeconfig "$kc" get deployments -A
          sudo "$RUNNER_TEMP/payload/bin/kubectl" --kubeconfig "$kc" get clusterclasses -A
          # Seed DNS: the registry name on both DNS service IPs, CoreDNS loaded from the payload.
          for ip in 10.30.110.53 10.30.110.54; do
            test "$(dig +short @"$ip" registry.dc3.example.com)" = 10.30.110.5
          done
          # The provider images came through the seed registry.
          # (Logs to a file first: grep -q closing the pipe early would fail the step under pipefail.)
          sudo podman logs dciab-registry > "$RUNNER_TEMP/registry.log" 2>&1
          grep -q 'jetstack/cert-manager-controller/manifests' "$RUNNER_TEMP/registry.log" \
            || { echo "the registry served no cert-manager image"; tail -50 "$RUNNER_TEMP/registry.log"; exit 1; }
          # Nobody can push: the registry is read-only.
          if sudo "$RUNNER_TEMP/payload/bin/oras" push --ca-file "$state/pki/trust-bundle.pem" \
               10.30.110.5/ci/test:1 /etc/hostname 2>/dev/null; then
            echo "::error::pushing to the seed registry should fail"; exit 1
          fi
          sudo env "PATH=$PATH" "DCIAB_PVE_TOKEN=$DCIAB_PVE_TOKEN" "DCIAB_PVE_CSI_TOKEN=$DCIAB_PVE_CSI_TOKEN" ./dciab seed "$RUNNER_TEMP/site/dciab.yaml" \
            --payload "$RUNNER_TEMP/payload" --state "$RUNNER_TEMP/state" --until kind | tee "$RUNNER_TEMP/rerun.txt"
          grep -q "pki: unchanged" "$RUNNER_TEMP/rerun.txt"
          grep -q "dns: pod dciab-services already runs this config" "$RUNNER_TEMP/rerun.txt"
          if grep -E "^dns: (wrote|added|opened|loaded) " "$RUNNER_TEMP/rerun.txt"; then echo "::error::the dns rerun changed something"; exit 1; fi
          grep -q "registry: already serving" "$RUNNER_TEMP/rerun.txt"
          grep -q "kind: cluster dciab-bootstrap exists" "$RUNNER_TEMP/rerun.txt"
      - name: The seed registry and the DNS-only pod run as systemd units (back after a reboot)
        run: |
          set -euo pipefail
          for unit in dciab-registry.service dciab-services.service dciab-services-addresses.service; do
            systemctl is-active --quiet "$unit" || { echo "::error::$unit isn't active"; systemctl status "$unit" --no-pager || true; exit 1; }
            systemctl show -p WantedBy "$unit" | grep -q multi-user.target || { echo "::error::$unit isn't started at boot"; exit 1; }
          done
          # systemd brings the registry back on its own (Restart=always), and a restart keeps serving.
          sudo podman kill dciab-registry >/dev/null
          for i in $(seq 1 30); do
            code="$(curl -sk -o /dev/null -w '%{http_code}' https://10.30.110.5/v2/ || true)"
            [[ "$code" == 200 ]] && break
            sleep 2
          done
          test "$code" = 200 || { echo "::error::the registry answered '$code' after systemd restarted it"; journalctl -u dciab-registry.service --no-pager | tail -40; exit 1; }
          test "$(dig +short @10.30.110.53 registry.dc3.example.com)" = 10.30.110.5
      - name: dciab mgmt from seed's outputs, offline from the payload (up to the Cluster)
        env:
          DCIAB_PVE_TOKEN: ci-not-a-secret
          DCIAB_PVE_CSI_TOKEN: ci-not-a-secret
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/state"
          bin="$RUNNER_TEMP/payload/bin"
          # No --bootstrap-kubeconfig or --trust-bundle: they default to what seed wrote.
          sudo env "PATH=$bin:$PATH" "DCIAB_PVE_TOKEN=$DCIAB_PVE_TOKEN" "DCIAB_PVE_CSI_TOKEN=$DCIAB_PVE_CSI_TOKEN" ./dciab mgmt "$RUNNER_TEMP/site/dciab.yaml" \
            --state "$state" --payload "$RUNNER_TEMP/payload" --until cluster
          sudo grep -q "BEGIN CERTIFICATE" "$state/mgmt-values.yaml"   # seed's platform CA reaches the nodes
          sudo "$bin/kubectl" --kubeconfig "$state/bootstrap.kubeconfig" -n cluster-mgmt get cluster mgmt
      - name: dciab status (read-only) reports where the bootstrap stands
        run: |
          set -euo pipefail
          out="$(sudo env "PATH=$RUNNER_TEMP/payload/bin:$PATH" ./dciab status "$RUNNER_TEMP/site/dciab.yaml" \
            --state "$RUNNER_TEMP/state" || true)"
          echo "$out"
          for check in dns pki registry bootstrap; do
            grep -Eq "^$check +ok " <<<"$out" || { echo "::error::$check should be ok"; exit 1; }
          done
          grep -Eq "^mgmt +down .*not moved" <<<"$out"
      - name: With firewalld on, seed keeps 443 and DNS open, and the bootstrap cluster reaches the registry through it
        env:
          DCIAB_PVE_TOKEN: ci-not-a-secret
          DCIAB_PVE_CSI_TOKEN: ci-not-a-secret
        run: |
          set -euo pipefail
          sudo apt-get install -y -q firewalld
          sudo systemctl enable --now firewalld
          sudo firewall-cmd --state
          sudo firewall-cmd --zone="$(sudo firewall-cmd --get-default-zone)" --change-interface=dciab0
          sudo env "PATH=$PATH" "DCIAB_PVE_TOKEN=$DCIAB_PVE_TOKEN" "DCIAB_PVE_CSI_TOKEN=$DCIAB_PVE_CSI_TOKEN" ./dciab seed "$RUNNER_TEMP/site/dciab.yaml" \
            --payload "$RUNNER_TEMP/payload" --state "$RUNNER_TEMP/state" --until registry | tee "$RUNNER_TEMP/fw.txt"
          zone="$(sudo firewall-cmd --get-zone-of-interface=dciab0)"
          for p in 443/tcp 53/udp 53/tcp; do
            sudo firewall-cmd --zone="$zone" --query-port="$p" >/dev/null || { echo "::error::$p isn't open"; exit 1; }
            sudo firewall-cmd --permanent --zone="$zone" --query-port="$p" >/dev/null || { echo "::error::$p isn't permanent"; exit 1; }
          done
          sudo grep -q '"permanent"' "$RUNNER_TEMP/state/seed-created.json"
          # From inside the kind node (a podman network, filtered by firewalld like any client).
          node=dciab-bootstrap-control-plane
          code="$(sudo podman exec "$node" curl -sk -o /dev/null -w '%{http_code}' --max-time 10 https://10.30.110.5/v2/ || true)"
          test "$code" = 200 || { echo "the kind node got '$code' from the registry"; sudo firewall-cmd --list-all-zones | head -80; exit 1; }
          # --remove closes exactly what seed opened, runtime and permanent.
          sudo env "PATH=$RUNNER_TEMP/payload/bin:$PATH" ./dciab seed "$RUNNER_TEMP/site/dciab.yaml" --state "$RUNNER_TEMP/state" --remove --force
          for p in 443/tcp 53/udp 53/tcp; do
            if sudo firewall-cmd --zone="$zone" --query-port="$p" >/dev/null \
               || sudo firewall-cmd --permanent --zone="$zone" --query-port="$p" >/dev/null; then
              echo "::error::$p is still open after --remove"; exit 1
            fi
          done

  pve-assistant:
    # The image dciab hypervisors builds per-host Proxmox VE ISOs with, then a real host ISO
    # from the pinned installer ISO and an answer file rendered from examples/proxmox-bare.yaml.
    name: Proxmox VE per-host installer ISO
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dockerhub-mirror
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Build the assistant image (prints the pins it used)
        id: build
        run: echo "tag=$(images/pve-assistant/build.sh --print-pins)" >> "$GITHUB_OUTPUT"
      - name: Installer ISO (pinned in bundle.lock)
        run: |
          set -euo pipefail
          read -r url sha < <(python3 -c 'import yaml; p = yaml.safe_load(open("bundle.lock"))["hypervisors"]["proxmox"]; print(p["isoURL"], p["isoSHA256"])')
          mkdir -p "$RUNNER_TEMP/isos"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/isos/$(basename "$url")" "$url"
          echo "$sha  $RUNNER_TEMP/isos/$(basename "$url")" | sha256sum -c -
      - name: Build pve01's ISO and check its answer file is inside
        env:
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          set -euo pipefail
          PYTHONPATH=lib python3 - "$TAG" "$RUNNER_TEMP" <<'PY'
          import sys, yaml
          from pathlib import Path
          from dciab_hypervisors import answer, iso
          tag, tmp = sys.argv[1], Path(sys.argv[2])
          lock = yaml.safe_load(open("bundle.lock"))["hypervisors"]["proxmox"]
          doc = yaml.safe_load(open("examples/proxmox-bare.yaml"))
          host = doc["spec"]["hypervisors"]["hosts"][0]
          text = answer.render(doc, host, answer.root_hash(tmp / "answers", host["name"], "ci-not-a-secret", []))
          base = tmp / "isos" / Path(lock["isoURL"]).name
          iso.check_base(base, lock["isoSHA256"])
          assert iso.build(host["name"], text, base, lock["isoSHA256"], tmp / "host-isos", tag)
          assert not iso.build(host["name"], text, base, lock["isoSHA256"], tmp / "host-isos", tag)
          (tmp / "expected.toml").write_text(text)
          PY
          podman run --rm --network none --entrypoint osirrox -v "$RUNNER_TEMP:/t:Z" "$TAG" \
            -indev /t/host-isos/pve01.iso -extract /answer.toml /t/got.toml
          diff "$RUNNER_TEMP/expected.toml" "$RUNNER_TEMP/got.toml"
          ls -l "$RUNNER_TEMP/host-isos"
      - name: Build a tagged pve01 ISO and check its answer file and first-boot script
        # managementVLAN: tagged puts [first-boot] in the answer file and the script on the ISO
        # (prepare-iso --on-first-boot). Checked here with the real pinned assistant.
        env:
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          set -euo pipefail
          PYTHONPATH=lib python3 - "$TAG" "$RUNNER_TEMP" <<'PY'
          import sys, yaml
          from pathlib import Path
          from dciab_hypervisors import answer, firstboot, iso
          tag, tmp = sys.argv[1], Path(sys.argv[2])
          lock = yaml.safe_load(open("bundle.lock"))["hypervisors"]["proxmox"]
          doc = yaml.safe_load(open("examples/proxmox-bare.yaml"))
          doc["spec"]["hypervisors"]["managementVLAN"] = "tagged"
          doc["spec"]["platform"]["proxmox"]["vlanTag"] = doc["spec"]["network"]["nodes"]["vlan"]
          host = doc["spec"]["hypervisors"]["hosts"][0]
          text = answer.render(doc, host, answer.root_hash(tmp / "answers-tagged", host["name"], "ci-not-a-secret", []))
          for line in ("[first-boot]", 'source = "from-iso"', 'ordering = "before-network"'):
              assert line in text.splitlines(), line
          script = firstboot.render(doc, host)
          base = tmp / "isos" / Path(lock["isoURL"]).name
          out = tmp / "host-isos-tagged"
          assert iso.build(host["name"], text, base, lock["isoSHA256"], out, tag, first_boot=script)
          assert not iso.build(host["name"], text, base, lock["isoSHA256"], out, tag, first_boot=script)
          (tmp / "tagged-expected.toml").write_text(text)
          (tmp / "tagged-expected.sh").write_text(script)
          PY
          podman run --rm --network none -v "$RUNNER_TEMP:/t:Z" "$TAG" validate-answer /t/tagged-expected.toml
          listing="$(podman run --rm --network none --entrypoint xorriso -v "$RUNNER_TEMP:/t:Z" "$TAG" \
            -indev /t/host-isos-tagged/pve01.iso -lsl / 2>/dev/null)"
          echo "$listing"
          hook="$(printf '%s\n' "$listing" | awk '{print $NF}' | tr -d "'" | grep -i 'first-boot' | head -n1)"
          test -n "$hook" || { echo "no first-boot executable at the ISO's root"; exit 1; }
          echo "first-boot executable on the ISO: /$hook"
          podman run --rm --network none --entrypoint osirrox -v "$RUNNER_TEMP:/t:Z" "$TAG" \
            -indev /t/host-isos-tagged/pve01.iso -extract /answer.toml /t/tagged-got.toml -extract "/$hook" /t/tagged-got.sh
          diff "$RUNNER_TEMP/tagged-expected.toml" "$RUNNER_TEMP/tagged-got.toml"
          diff "$RUNNER_TEMP/tagged-expected.sh" "$RUNNER_TEMP/tagged-got.sh"
      - name: Publish (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.build.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(podman run --rm --entrypoint dpkg-query "$TAG" -W -f '${Version}' proxmox-auto-install-assistant)"
          dest="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dciab-pve-assistant:$version"
          # Log in first: skopeo reads the same auth file, so the check below also sees a private package.
          echo "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # A version is published once: bundle.lock pins its digest, so it's never overwritten.
          if skopeo inspect --raw "docker://$dest" >/dev/null 2>&1; then
            echo "already published: $dest"; exit 0
          fi
          podman push --digestfile "$RUNNER_TEMP/digest" "$TAG" "docker://$dest"
          echo "published: $dest@$(cat "$RUNNER_TEMP/digest")  (pin it as bundle.lock images.pveAssistant)"

  day0-chrony:
    # DCiaB's Day 0 chrony image, built here and never at the site (its build installs chrony
    # from the Rocky Linux repositories). Published on main, once per version; bundle.lock pins
    # it as day0.images.chrony and the archive ships it like the other images.
    name: Day 0 chrony image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dockerhub-mirror
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Build
        id: build
        run: echo "tag=$(images/day0-chrony/build.sh)" >> "$GITHUB_OUTPUT"
      - name: chrony runs and the pin matches this recipe
        env:
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          set -euo pipefail
          podman run --rm --network none --entrypoint /usr/sbin/chronyd "$TAG" --version
          pinned="$(python3 -c 'import yaml; print(yaml.safe_load(open("bundle.lock"))["day0"]["images"].get("chrony") or "")')"
          id="$(images/day0-chrony/build.sh --recipe-id)"
          tagged="${pinned%@*}"
          if [[ "$tagged" != *"-$id" ]]; then
            echo "::warning::bundle.lock day0.images.chrony (${pinned:-unpinned}) isn't built from this recipe ($id); pin the image this job publishes on main"
          fi
      - name: Publish (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.build.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(podman run --rm --entrypoint rpm "$TAG" -q --qf '%{VERSION}-%{RELEASE}' chrony)"
          dest="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dciab-day0-chrony:$version-$(images/day0-chrony/build.sh --recipe-id)"
          # Log in first: skopeo reads the same auth file, so the check below also sees a private package.
          echo "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # A version is published once: bundle.lock pins its digest, so it's never overwritten.
          if skopeo inspect --raw "docker://$dest" >/dev/null 2>&1; then
            echo "already published: $dest"; exit 0
          fi
          podman push --digestfile "$RUNNER_TEMP/digest" "$TAG" "docker://$dest"
          echo "published: $dest@$(cat "$RUNNER_TEMP/digest")  (pin it as bundle.lock day0.images.chrony)"

  backup-image:
    # DCiaB's backup image (images/backup): age, rclone, kubectl, clusterctl and the backup
    # runner, for MGMT's etcd snapshot and CAPI export CronJobs. Built here, never at the
    # site; published on main once per recipe. bundle.lock pins it as images.backup.
    name: backup image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dockerhub-mirror
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Build
        id: build
        run: |
          set -euo pipefail
          # Not inside echo "$(...)": a failed build must fail this step.
          tag="$(images/backup/build.sh)"
          [[ -n "$tag" ]] || { echo "::error::images/backup/build.sh printed no tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: The tools run and the pin matches this recipe
        env:
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          set -euo pipefail
          for tool in "age --version" "rclone version" "etcdutl version" "kubectl version --client" "clusterctl version"; do
            podman run --rm --network none --entrypoint sh "$TAG" -c "$tool"
          done
          podman run --rm --network none "$TAG" --help >/dev/null
          pinned="$(python3 -c 'import yaml; print(yaml.safe_load(open("bundle.lock"))["images"].get("backup") or "")')"
          id="$(images/backup/build.sh --recipe-id)"
          tagged="${pinned%@*}"
          if [[ "$tagged" != *":$id" ]]; then
            echo "::warning::bundle.lock images.backup (${pinned:-unpinned}) isn't built from this recipe ($id); pin the image this job publishes on main"
          fi
      - name: Publish (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.build.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dest="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dciab-backup:$(images/backup/build.sh --recipe-id)"
          echo "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # A recipe is published once: bundle.lock pins its digest, so it's never overwritten.
          if skopeo inspect --raw "docker://$dest" >/dev/null 2>&1; then
            echo "already published: $dest"; exit 0
          fi
          podman push --digestfile "$RUNNER_TEMP/digest" "$TAG" "docker://$dest"
          echo "published: $dest@$(cat "$RUNNER_TEMP/digest")  (pin it as bundle.lock images.backup)"

  frozen-classes:
    # A class revision freezes when a DCiaB GA release tag (vN.0.0) first contains it; alpha and beta tags freeze nothing (docs/VERSIONING.md).
    name: released ClusterClasses are unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: hack/check_frozen_classes.sh

  image-digests:
    name: bundle.lock image digests match the registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python hack/check_image_digests.py

  services:
    # dciab services for real: rootful podman, the pod on a dummy interface that carries
    # examples/proxmox-bare.yaml's bootstrap NIC (by MAC) and address.
    name: dciab services (rootful podman pod, DNS/NTP/HTTP)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dockerhub-mirror
      - name: Packages (firewalld stopped until the image build is done; its rules block the build's network)
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q python3-yaml python3-jsonschema dnsutils firewalld
          sudo systemctl disable --now firewalld
      - name: This branch's chrony image (job day0-chrony publishes it on main)
        run: |
          set -euo pipefail
          # Not inside echo "$(...)": a failed build must fail this step.
          img="$(sudo images/day0-chrony/build.sh)"
          [[ "$img" == localhost/dciab/day0-chrony:* ]] || { echo "::error::the chrony build printed '$img'"; exit 1; }
          sudo podman image exists "$img"
          echo "DCIAB_CHRONY_IMAGE=$img" >> "$GITHUB_ENV"
      - name: firewalld runs, as on the bootstrap host
        run: sudo systemctl enable --now firewalld && sudo firewall-cmd --state
      - name: Site and dummy interface
        run: |
          set -euo pipefail
          mkdir -p /tmp/site
          cp examples/proxmox-bare.yaml /tmp/site/dciab.yaml
          for s in hv/root bmc/pve01 bmc/pve02 bmc/pve03 bmc/ca.pem pki/intermediate.crt pki/intermediate.key pki/chain.pem; do
            mkdir -p "$(dirname "/tmp/site/secrets/$s")"
            echo placeholder > "/tmp/site/secrets/$s"
            chmod 600 "/tmp/site/secrets/$s"
          done
          # validate reads the imported intermediate, so it must be a real CA certificate.
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout /dev/null -subj /CN=dciab-ci -days 3650 -addext basicConstraints=critical,CA:TRUE -out /tmp/site/secrets/pki/intermediate.crt 2>/dev/null
          sudo ip link add dciab0 type dummy
          sudo ip link set dciab0 address b8:ca:3a:00:00:05 up
          sudo ip addr add 10.30.110.5/24 dev dciab0
          DCIAB_PVE_TOKEN=placeholder DCIAB_PVE_CSI_TOKEN=placeholder ./dciab services /tmp/site/dciab.yaml --print
      - name: dciab services
        run: sudo DCIAB_PVE_TOKEN=placeholder DCIAB_PVE_CSI_TOKEN=placeholder DCIAB_CHRONY_IMAGE="$DCIAB_CHRONY_IMAGE" ./dciab services /tmp/site/dciab.yaml
      - name: A rerun changes nothing
        run: |
          set -euo pipefail
          out="$(sudo DCIAB_PVE_TOKEN=placeholder DCIAB_PVE_CSI_TOKEN=placeholder DCIAB_CHRONY_IMAGE="$DCIAB_CHRONY_IMAGE" ./dciab services /tmp/site/dciab.yaml)"
          echo "$out"
          grep -q "already runs this config" <<<"$out"
          if grep -E "^(wrote|added|opened) " <<<"$out"; then echo "::error::the rerun changed something"; exit 1; fi
      - name: DNS both ways, refusal outside the zones, ranged HTTP, NTP
        run: |
          set -euo pipefail
          test "$(dig +short @10.30.110.53 pve01.dc3.example.com)" = 10.30.110.6
          test "$(dig +short @10.30.110.54 registry.dc3.example.com)" = 10.30.110.5
          test "$(dig +short @10.30.110.54 -x 10.30.110.7)" = pve02.dc3.example.com.
          dig @10.30.110.53 example.org | grep -q 'status: REFUSED'
          printf '0123456789' | sudo tee /tmp/site/.dciab/state/isos/test.iso >/dev/null
          test "$(curl -sS --noproxy '*' -r 2-5 http://10.30.110.5/isos/test.iso)" = 2345
          # each host's ISO (answer file inside) only for its BMC's address; this runner is the bootstrap address
          printf 'iso' | sudo tee /tmp/site/.dciab/state/host-isos/pve01.iso >/dev/null
          test "$(curl -sS --noproxy '*' -o /dev/null -w '%{http_code}' http://10.30.110.5/host-isos/pve01.iso)" = 403
          test "$(curl -sS --noproxy '*' -o /dev/null -w '%{http_code}' http://10.30.110.5/answers/pve01.toml)" = 404
          for ip in 10.30.110.53 10.30.110.54; do
            PYTHONPATH=lib python3 -c "import sys; from dciab_services import probe; s = probe.ntp(sys.argv[1]); print(sys.argv[1], 'stratum', s); sys.exit(0 if s and s < 16 else 1)" "$ip"
          done
      - name: Units and permanent ports, so a reboot brings everything back
        run: |
          set -euo pipefail
          test "$(systemctl is-enabled dciab-services-addresses.service)" = enabled
          systemctl is-active --quiet dciab-services.service
          for unit in dciab-services.service dciab-services-addresses.service; do
            systemctl show -p WantedBy "$unit" | grep -q multi-user.target || { echo "::error::$unit isn't started at boot"; exit 1; }
          done
          zone="$(sudo firewall-cmd --get-default-zone)"
          for p in 53/udp 53/tcp 80/tcp 123/udp; do
            sudo firewall-cmd --zone="$zone" --query-port="$p" >/dev/null
            sudo firewall-cmd --permanent --zone="$zone" --query-port="$p" >/dev/null || { echo "::error::$p isn't permanent"; exit 1; }
          done
          # Each scope DCiaB opened is recorded on its own line.
          sudo grep -qx "port $zone 53/udp runtime" /tmp/site/.dciab/state/services/created
          sudo grep -qx "port $zone 53/udp permanent" /tmp/site/.dciab/state/services/created
          # The pod's unit waits for the ISO folders and container storage, and re-adds the IPs on each start.
          grep -q "^RequiresMountsFor=.*/isos .*/host-isos .*storage" /etc/containers/systemd/dciab-services.kube \
            || { cat /etc/containers/systemd/dciab-services.kube; exit 1; }
          grep -q "^ExecStartPre=ip addr replace 10.30.110.53/24 dev dciab0" /etc/containers/systemd/dciab-services.kube
      - name: A service IP that disappears (NetworkManager reapplying the interface) comes back with a pod restart
        run: |
          set -euo pipefail
          answers() {   # answers <server> <name> <want>: retried while the pod starts
            local r=""; for _ in $(seq 1 20); do r="$(dig +short +time=1 +tries=1 @"$1" "$2" || true)"; [[ "$r" == "$3" ]] && return 0; sleep 1; done
            echo "dig @$1 $2: got '$r', want '$3'"; return 1
          }
          sudo ip addr del 10.30.110.53/24 dev dciab0
          sudo systemctl restart dciab-services.service
          answers 10.30.110.53 pve01.dc3.example.com 10.30.110.6
      - name: A simulated reboot (units stopped, addresses gone, runtime firewall reset) comes back
        run: |
          set -euo pipefail
          answers() {   # answers <server> <name> <want>: retried while the pod starts
            local r=""; for _ in $(seq 1 20); do r="$(dig +short +time=1 +tries=1 @"$1" "$2" || true)"; [[ "$r" == "$3" ]] && return 0; sleep 1; done
            echo "dig @$1 $2: got '$r', want '$3'"; return 1
          }
          sudo systemctl stop dciab-services.service dciab-services-addresses.service
          if sudo podman pod exists dciab-services; then echo "::error::the pod should stop with its unit"; exit 1; fi
          sudo ip addr del 10.30.110.53/24 dev dciab0
          sudo ip addr del 10.30.110.54/24 dev dciab0
          sudo firewall-cmd --reload   # runtime rules back to the permanent ones, as after a boot
          # What boot starts: multi-user.target wants both units; the pod's unit pulls in the addresses.
          systemctl list-dependencies --plain multi-user.target | grep dciab-services.service >/dev/null
          sudo systemctl start dciab-services.service
          answers 10.30.110.53 pve01.dc3.example.com 10.30.110.6
          answers 10.30.110.54 registry.dc3.example.com 10.30.110.5
          zone="$(sudo firewall-cmd --get-default-zone)"
          sudo firewall-cmd --zone="$zone" --query-port=53/udp >/dev/null
          out="$(sudo DCIAB_PVE_TOKEN=placeholder DCIAB_PVE_CSI_TOKEN=placeholder DCIAB_CHRONY_IMAGE="$DCIAB_CHRONY_IMAGE" ./dciab services /tmp/site/dciab.yaml)"
          echo "$out"
          grep -q "already runs this config" <<<"$out"
          if grep -E "^(wrote|added|opened) " <<<"$out"; then echo "::error::the rerun after the reboot changed something"; exit 1; fi
      - name: A rerun while firewalld is stopped leaves the firewall ports alone
        run: |
          set -euo pipefail
          zone="$(sudo firewall-cmd --get-default-zone)"
          sudo systemctl stop firewalld
          out="$(sudo DCIAB_PVE_TOKEN=placeholder DCIAB_PVE_CSI_TOKEN=placeholder DCIAB_CHRONY_IMAGE="$DCIAB_CHRONY_IMAGE" ./dciab services /tmp/site/dciab.yaml 2>&1)"
          echo "$out"
          grep -q "firewall ports weren't checked" <<<"$out"
          if grep -E "closed |no longer wanted: port" <<<"$out"; then echo "::error::a port was closed with firewalld stopped"; exit 1; fi
          # An unchanged config is a no-op even with firewalld stopped: the note isn't a change.
          grep -q "already runs this config" <<<"$out"
          if grep -q "started pod" <<<"$out"; then echo "::error::the pod was restarted for an unchanged config"; exit 1; fi
          sudo grep -qx "port $zone 53/udp permanent" /tmp/site/.dciab/state/services/created
          sudo systemctl start firewalld
          for p in 53/udp 53/tcp 80/tcp 123/udp; do
            sudo firewall-cmd --zone="$zone" --query-port="$p" >/dev/null || { echo "::error::$p closed at runtime"; exit 1; }
            sudo firewall-cmd --permanent --zone="$zone" --query-port="$p" >/dev/null || { echo "::error::$p no longer permanent"; exit 1; }
          done
      - name: A changed config stopped before the pod step leaves the old config whole, across a reboot
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml
          d = yaml.safe_load(open("/tmp/site/dciab.yaml"))
          d["spec"]["network"]["dnsServiceIPs"][1] = "10.30.110.55"
          yaml.safe_dump(d, open("/tmp/site/dciab.yaml", "w"), sort_keys=False)
          PY
          answers() {   # answers <server> <name> <want>: retried while the pod starts
            local r=""; for _ in $(seq 1 20); do r="$(dig +short +time=1 +tries=1 @"$1" "$2" || true)"; [[ "$r" == "$3" ]] && return 0; sleep 1; done
            echo "dig @$1 $2: got '$r', want '$3'"; return 1
          }
          sudo DCIAB_PVE_TOKEN=placeholder DCIAB_PVE_CSI_TOKEN=placeholder DCIAB_CHRONY_IMAGE="$DCIAB_CHRONY_IMAGE" ./dciab services /tmp/site/dciab.yaml --until address
          # The live files and both units still describe the old IP (.54); only the stage has .55.
          for f in /etc/systemd/system/dciab-services-addresses.service /etc/containers/systemd/dciab-services.kube; do
            grep -q 10.30.110.54 "$f" && ! grep -q 10.30.110.55 "$f" || { echo "$f:"; cat "$f"; exit 1; }
          done
          sudo grep -q 10.30.110.54 /tmp/site/.dciab/state/services/coredns/Corefile
          sudo grep -q 10.30.110.55 /tmp/site/.dciab/state/services/.staged/coredns/Corefile
          # A reboot now brings back the old config, whole.
          sudo systemctl stop dciab-services.service dciab-services-addresses.service
          sudo ip addr del 10.30.110.54/24 dev dciab0
          sudo systemctl start dciab-services.service
          answers 10.30.110.54 registry.dc3.example.com 10.30.110.5
      - name: A changed config (new DNS service IP, forwarding for the site only), then --down
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml
          d = yaml.safe_load(open("/tmp/site/dciab.yaml"))
          d["spec"]["network"]["dnsServiceIPs"][1] = "10.30.110.55"
          d["spec"]["network"]["upstreamResolvers"] = ["8.8.8.8"]
          d["spec"]["network"]["isolated"] = False
          yaml.safe_dump(d, open("/tmp/site/dciab.yaml", "w"), sort_keys=False)
          PY
          out="$(sudo DCIAB_PVE_TOKEN=placeholder DCIAB_PVE_CSI_TOKEN=placeholder DCIAB_CHRONY_IMAGE="$DCIAB_CHRONY_IMAGE" ./dciab services /tmp/site/dciab.yaml)"
          echo "$out"
          grep -q "no longer wanted: address dciab0 10.30.110.54/24" <<<"$out"
          addrs="$(ip -o -4 addr show dev dciab0 | awk '{print $4}' | sort | tr '\n' ' ')"
          test "$addrs" = "10.30.110.5/24 10.30.110.53/24 10.30.110.55/24 " || { echo "::error::addresses: $addrs"; exit 1; }
          test "$(dig +short @10.30.110.55 registry.dc3.example.com)" = 10.30.110.5
          # Forwarding: from the node network it is tried, from anywhere else refused.
          sudo ip addr add 192.0.2.10/32 dev dciab0
          if dig +time=5 -b 10.30.110.5 @10.30.110.53 example.org | grep -q 'status: REFUSED'; then
            echo "::error::a node-network client was refused forwarding"; exit 1
          fi
          dig -b 192.0.2.10 @10.30.110.53 example.org | grep -q 'status: REFUSED'
          test "$(dig +short -b 192.0.2.10 @10.30.110.53 registry.dc3.example.com)" = 10.30.110.5   # the zone answers anyone
          sudo ip addr del 192.0.2.10/32 dev dciab0
          # --down: exactly what dciab services added, and a rerun changes nothing.
          sudo ./dciab services /tmp/site/dciab.yaml --down
          if sudo podman pod exists dciab-services; then echo "::error::the pod is still there"; exit 1; fi
          test "$(ip -o -4 addr show dev dciab0 | awk '{print $4}')" = 10.30.110.5/24
          sudo test ! -e /tmp/site/.dciab/state/services/created
          for f in /etc/systemd/system/dciab-services-addresses.service /etc/containers/systemd/dciab-services.kube; do
            if test -e "$f"; then echo "::error::$f is still there"; exit 1; fi
          done
          if systemctl is-enabled dciab-services-addresses.service 2>/dev/null; then echo "::error::still enabled"; exit 1; fi
          zone="$(sudo firewall-cmd --get-default-zone)"
          for p in 53/udp 53/tcp 80/tcp 123/udp; do
            if sudo firewall-cmd --zone="$zone" --query-port="$p" >/dev/null \
               || sudo firewall-cmd --permanent --zone="$zone" --query-port="$p" >/dev/null; then
              echo "::error::$p is still open"; exit 1
            fi
          done
          sudo ./dciab services /tmp/site/dciab.yaml --down | grep -q "lists nothing"
      - name: Pod logs
        if: failure()
        run: |
          sudo podman pod ps || true
          sudo podman ps -a || true
          for c in coredns chrony-1 chrony-2 caddy; do echo "== $c"; sudo podman logs "dciab-services-$c" 2>&1 | tail -40 || true; done

  redfish-mockups:
    # dciab hypervisors' Redfish code (reinstall guard, preparation, media) against DMTF's Redfish
    # Mockup Server and public mockups, plus overlays for vendor behaviour (hack/redfish/README.md).
    name: Redfish mockups (DMTF Mockup Server)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The pinned Mockup Server, its requirements and DMTF's mockups
        run: |
          set -euo pipefail
          pip install -r requirements-dev.txt
          pip install --require-hashes -r "$(python3 -c 'import yaml; print(yaml.safe_load(open("bundle.lock"))["redfishTesting"]["mockupServer"]["requirements"])')"
          echo "DCIAB_REDFISH_MOCKUPS=$(python3 hack/redfish/fetch.py "$RUNNER_TEMP/redfish")" >> "$GITHUB_ENV"
      - name: Tests (none may be skipped)
        run: |
          set -euo pipefail
          python3 -m pytest -q -rs tests/test_redfish_mockups.py tests/test_redfish_tooling.py | tee "$RUNNER_TEMP/out.txt"
          if grep -q "skipped" "$RUNNER_TEMP/out.txt"; then echo "::error::the mockup tests were skipped"; exit 1; fi

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck dciab hack/e2e/run.sh hack/check_frozen_classes.sh lib/steps/mgmt.sh lib/steps/mgmt-pivot.sh lib/steps/services.sh lib/steps/capi-providers.sh lib/steps/storage-classes.sh lib/steps/block-storage.sh images/node-bootc/build.sh images/node-bootc/rootfs/usr/libexec/dciab/growroot images/bootstrap-bootc/build.sh images/usb/build.sh images/day0-chrony/build.sh images/backup/build.sh images/lab-runner/build.sh images/lab-runner/rootfs/usr/libexec/dciab-lab-runner/loop images/lab-runner/rootfs/usr/libexec/dciab-lab-runner/job-started.sh addons/cilium/install.sh addons/longhorn/install.sh addons/vsphere-cpi/install.sh addons/csi/install.sh addons/kubelet-csr-approver/install.sh hack/e2e/boot-node-image.sh hack/lab/runner-image-id.sh hack/lab/fetch-runner-disk.sh hack/lab/pve.sh hack/lab/check-token.sh hack/lab/template.sh hack/lab/node-image-id.sh build/payload.sh hack/lab/cluster.sh hack/lab/mgmt.sh hack/e2e/hypervisors/setup.sh hack/media/rocky10-dropin.sh hack/media/preload-e2e.sh

  day0-preload:
    # dciab media's preload step loads the Day 0 images once from the archive's payload (#181).
    # This copies two of them into a payload the way build/archive.py does and loads them with
    # dciab_media.preload into a real podman.
    name: Day 0 image preload from the payload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dockerhub-mirror
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: oras (bundle.lock tools.oras, checked against binarySHA256)
        run: |
          set -euo pipefail
          read -r ver sha < <(python3 -c 'import yaml; l = yaml.safe_load(open("bundle.lock")); print(l["tools"]["oras"], l["binarySHA256"]["oras-linux-amd64.tar.gz"])')
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/oras.tgz" "https://github.com/oras-project/oras/releases/download/$ver/oras_${ver#v}_linux_amd64.tar.gz"
          echo "$sha  $RUNNER_TEMP/oras.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/oras.tgz" -C "$RUNNER_TEMP" oras
      - name: Preload into root's podman
        run: sudo env "PATH=$PATH" hack/media/preload-e2e.sh "$RUNNER_TEMP/oras"

  media-dropin-rocky10:
    # dciab media's storage step moves root's podman storage with a storage.conf.d drop-in;
    # this proves podman on Rocky Linux 10 (the appliance's OS) reads it (#165).
    name: media storage drop-in on Rocky Linux 10
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: rockylinux/rockylinux:10
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dockerhub-mirror
      - run: dnf -y install podman python3 python3-pyyaml
      - run: hack/media/rocky10-dropin.sh "$GITHUB_WORKSPACE"

  rocky10:
    # The validator must run on the bootstrap host with distro packages only.
    name: examples on Rocky Linux 10 (distro packages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: rockylinux/rockylinux:10
    steps:
      - uses: actions/checkout@v4
      # openssl: validate checks an imported intermediate CA with it (and only notes a skip without it).
      - run: dnf -y install python3 python3-jsonschema python3-pyyaml openssl
      - name: Validate every example with placeholder secrets
        env:
          DCIAB_PVE_TOKEN: placeholder
          DCIAB_PVE_CSI_TOKEN: placeholder
        run: |
          set -euo pipefail
          for example in examples/*.yaml; do
            work="$(mktemp -d)"
            cp "$example" "$work/"
            for s in vsphere.pw longhorn-s3.env backup-site.env backup-offsite.env pki/intermediate.key pki/chain.pem \
                     bmc/ca.pem bmc/r760-01 bmc/r760-02 bmc/r760-03 bmc/r760-04 bmc/r760-05 bmc/r760-06 bmc/r760-07 \
                     hv/root bmc/pve01 bmc/pve02 bmc/pve03; do
              mkdir -p "$(dirname "$work/secrets/$s")"
              echo placeholder > "$work/secrets/$s"
              chmod 600 "$work/secrets/$s"
            done
            # validate reads the imported intermediate, so it must be a real CA certificate.
            openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout /dev/null -subj /CN=dciab-ci \
              -days 3650 -addext basicConstraints=critical,CA:TRUE -addext keyUsage=critical,keyCertSign,cRLSign \
              -out "$work/secrets/pki/intermediate.crt" 2>/dev/null
            chmod 600 "$work/secrets/pki/intermediate.crt"
            out="$(./dciab validate "$work/$(basename "$example")" 2>&1)" || { echo "$out"; exit 1; }
            echo "$out"
            if grep -q "mode: import-intermediate" "$example" && grep -q "openssl is not installed" <<<"$out"; then
              echo "::error::$example: validate skipped the imported intermediate check (no openssl)"
              exit 1
            fi
          done
