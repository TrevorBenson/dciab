name: archive payload

# The full payload, every image on every platform: several GB, so on request only.
# CI builds a small payload on every PR (job "archive image inventory").
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payload:
    name: full archive payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dockerhub-mirror
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Read versions from bundle.lock
        id: lock
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          lock = yaml.safe_load(open("bundle.lock"))
          print(f"helm={lock['tools']['helm']}")
          print(f"k8s={lock['kubernetes']['version']}")
          PY
      - uses: azure/setup-helm@v4
        with:
          version: ${{ steps.lock.outputs.helm }}
      - name: Payload
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc   # room for every platform of every image
          build/payload.sh "$RUNNER_TEMP/payload" images.yaml
      - name: Package, sign with a throwaway key, verify
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/payload" cosign="$RUNNER_TEMP/payload/bin/cosign" keys="$RUNNER_TEMP/keys"
          mkdir -p "$keys"
          COSIGN_PASSWORD="$(openssl rand -hex 16)"
          export COSIGN_PASSWORD
          (cd "$keys" && "$cosign" generate-key-pair)
          python3 build/package.py package --payload "$out" --out "$RUNNER_TEMP/dist" \
            --signing-key "$keys/cosign.key" --cosign "$cosign"
          rm -rf "$out/images"   # room on the runner; the tar holds them now
          tar="$(ls "$RUNNER_TEMP"/dist/dciab-*.tar)"
          ls -l "$tar"; du -h "$tar"
          ./dciab verify-archive --key "$keys/cosign.pub" --cosign "$cosign" "$tar"
          tar -xOf "$tar" --wildcards '*/MANIFEST' > "$RUNNER_TEMP/MANIFEST"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-manifest
          path: |
            images.yaml
            ${{ runner.temp }}/payload/images.yaml
            ${{ runner.temp }}/payload/SHA256SUMS
            ${{ runner.temp }}/payload/sboms
            ${{ runner.temp }}/MANIFEST
