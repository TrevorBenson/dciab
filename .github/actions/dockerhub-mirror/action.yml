name: Docker Hub through a mirror
description: >-
  Hosted runners share addresses, so anonymous Docker Hub pulls hit its rate limit
  (toomanyrequests) and fail jobs at random. This points podman's docker.io at a pull-through
  mirror, with Docker Hub as the fallback, and sets DCIAB_MIRROR_DOCKER_IO for build/archive.py
  (oras doesn't read podman's configuration). Every image DCiaB pulls is pinned by digest, so
  the mirror can only serve the same bytes. Hosted runners only: not for the lab runner.
inputs:
  mirror:
    description: Docker Hub mirror host
    default: mirror.gcr.io
runs:
  using: composite
  steps:
    - shell: bash
      env:
        MIRROR: ${{ inputs.mirror }}
      # Root in a job container (media-dropin-rocky10's Rocky image) has no sudo.
      # mirror-by-digest-only: tag lookups (archive.py digests, pin checks) stay on Docker Hub,
      # so a tag the mirror cached before it moved can't print a stale digest.
      run: |
        SUDO=; [ "$(id -u)" = 0 ] || SUDO=sudo
        $SUDO mkdir -p /etc/containers/registries.conf.d
        printf '[[registry]]\nprefix = "docker.io"\nlocation = "docker.io"\n\n[[registry.mirror]]\nlocation = "%s"\npull-from-mirror = "digest-only"\n' "$MIRROR" \
          | $SUDO tee /etc/containers/registries.conf.d/00-dciab-dockerhub-mirror.conf >/dev/null
        echo "DCIAB_MIRROR_DOCKER_IO=$MIRROR" >> "$GITHUB_ENV"
        echo "docker.io pulls go through $MIRROR first"
